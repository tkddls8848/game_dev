<!doctype html>
<!--
  farm-signal 연출 목업 — 전보 · 시세판.

  손으로 그린 그림이 아니다. ../data/ 의 실제 JSON을 읽어서 그린다.
  시세판·관측치·도둑 주사위·평판은 C#(src/Sim/SignalMath.cs · PriceBook · WeatherCalendar)을
  JS로 그대로 이식해 뽑으므로, 화면의 3년이 테스트가 돌린 3년과 같다.
  대조표는 tests/SignalBoardTests.cs 의 "목업이_맞춰_볼_표본값을_찍는다" 가 찍는다.

  **밭을 그리지 않는다.** 밭은 숫자와 전문으로만 나타난다 — 그게 이 PoC의 규칙과 같은 그림이다.
  색·크기는 palette.json 이 정한다.

  보는 법 (file:// 로 열면 fetch가 막힌다):
    cd games/farm-signal && python -m http.server 8000
    http://localhost:8000/presentation/
-->

  /* ── 등록부 (밭을 그리지 않는다) ───────────────────────────── */

  th,td{border-bottom:1px solid var(--grid); padding:4px 7px; text-align:right; white-space:nowrap}

  .bar{display:inline-block; height:6px; background:var(--phosphorDim); vertical-align:middle}

  /* ── 종이 테이프 ────────────────────────────────────────── */

  .tape .ln{display:block}

  .facts{display:flex; flex-wrap:wrap; gap:4px 26px; font-size:var(--fHint); color:var(--muted); margin:10px 0 0}
  .facts b{color:var(--phosphorGlow); font-weight:400; font-family:'PlexMono',monospace; font-size:14px}
  .twoworld{display:flex; flex-wrap:wrap; gap:18px; margin-top:8px}

  .twoworld .w .n{font-family:'PlexMono',monospace; font-size:22px; color:var(--phosphorGlow)}
  .twoworld .w.d .n{color:var(--amber)}

  footer{margin-top:40px; border-top:1px solid var(--grid); padding-top:14px;
         font-size:var(--fHint); color:var(--muted)}

<body>
<div class="station">
  <h1>SIGNAL EXCHANGE<span class="ko" id="titleKo">&nbsp;</span></h1>
  <p class="slug" id="slug">data/ 를 읽는 중…</p>
  <div id="body"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   C# 이식부. 아래 넷은 src/ 의 같은 이름 파일을 그대로 옮긴 것이다.
   여기에 부동소수나 순회 순서 차이가 들어오면 화면과 테스트가 갈라진다.
     NetRandom     ← .NET System.Random(seed)
     mulDiv        ← Sim/IntMath.cs
     SignalMath    ← Sim/SignalMath.cs
     Board         ← Report/SignalBoard.cs (+ PriceBook · WeatherCalendar)
   ═══════════════════════════════════════════════════════════════════════════ */

function NetRandom(seed){
  const MBIG=2147483647, MSEED=161803398;
  const S=new Array(56).fill(0);
  const sub=(seed===-2147483648)?2147483647:Math.abs(seed);
  let mj=MSEED-sub, mk=1;
  S[55]=mj;
  for(let i=1;i<55;i++){ const ii=(21*i)%55; S[ii]=mk; mk=mj-mk; if(mk<0) mk+=MBIG; mj=S[ii]; }
  for(let k=1;k<5;k++) for(let i=1;i<56;i++){ let n=i+30; if(n>=55) n-=55; S[i]-=S[1+n]; if(S[i]<0) S[i]+=MBIG; }
  let inext=0, inextp=21;
  return { next(max){
    let a=inext,b=inextp;
    if(++a>=56) a=1;
    if(++b>=56) b=1;
    let r=S[a]-S[b];
    if(r===MBIG) r--;
    if(r<0) r+=MBIG;
    S[a]=r; inext=a; inextp=b;
    return Math.floor(r*(1.0/MBIG)*max);
  }};
}

/// IntMath.MulDiv. 나머지를 remArr[i] 에 쌓는다. den>0 이므로 내림 한 방향이다.
function mulDiv(value,num,den,remArr,i){
  const n=value*num+remArr[i];
  const q=Math.floor(n/den);
  remArr[i]=n-q*den;
  return q;
}
const clamp=(v,lo,hi)=> v<lo?lo:(v>hi?hi:v);

/// SignalMath 전체. 인자 순서와 나눗셈 순서를 C#과 똑같이 둔다.
function SignalMath(D,rules){
  const S={
    effExposure(baseExposure, heights){
      let blocked=0;
      for(const h of heights) blocked += Math.floor(h*D.plots.screenEffectPercent/100);
      return clamp(baseExposure-blocked, D.plots.exposureFloor, 100);
    },
    dailyObserved(visibility, effExp, weatherExpPct, roadPct, remArr, i){
      return mulDiv(visibility*effExp, weatherExpPct*roadPct, rules.obsDen, remArr, i);
    },
    nextPriceIndex(cur, observedIndex, copyAppeal){
      // C#: observedIndex * copyAppeal / 100 * dropPerPointPer1000 / 1000  (왼쪽부터 정수 나눗셈)
      const drop=Math.floor(Math.floor(observedIndex*copyAppeal/100)*rules.drop1000/1000);
      let next=cur-drop;
      if(observedIndex<=rules.scarcityThreshold) next+=rules.scarcityRise;
      else if(next<100) next=Math.min(100,next+rules.recover);
      return clamp(next, rules.floorPct, rules.ceilPct);
    },
    theftRisk(observedIndex, renown){
      if(rules.theftDivisor<=0) return 0;
      let raw=0;
      for(let c=0;c<D.crops.crops.length;c++) raw+=observedIndex[c]*D.crops.crops[c].theftAppeal;
      let risk=Math.floor(raw/rules.theftDivisor);
      risk-=Math.floor(renown*rules.watchPer100/100);
      risk=clamp(risk,0,rules.riskCap);
      return risk<rules.minRiskToRoll?0:risk;
    },
    theftHits(risk){
      if(rules.severityStep<=0) return 1;
      return clamp(1+Math.floor(risk/rules.severityStep),1,rules.maxPlotsHit);
    },
    nextRenown(renown, observedIndex){
      let gain=0;
      if(rules.renownDivisor>0){
        let raw=0;
        for(let c=0;c<D.crops.crops.length;c++) raw+=observedIndex[c]*D.crops.crops[c].renownGain;
        gain=Math.floor(raw/rules.renownDivisor);
      }
      return clamp(renown+gain-rules.renownDecay,0,rules.renownCap);
    },
    visitors(renown){ return rules.perVisitor<=0?0:Math.floor(renown/rules.perVisitor); },
    premium(v){ return clamp(v*rules.premiumPer,0,rules.premiumCap); },
    sellUnit(basePrice, idxPct, premiumPct, remArr, i){
      return mulDiv(basePrice, idxPct*(100+premiumPct), 10000, remArr, i);
    }
  };
  return S;
}

/// SignalRules.Full / .Off
function makeRules(D, on){
  const c=D.signal.copycat, t=D.signal.theft, r=D.signal.renown;
  return {
    on,
    drop1000:      on? c.dropPerPointPer1000 : 0,
    recover:       on? c.recoverPerSeason : 0,
    scarcityRise:  on? c.scarcityRisePerSeason : 0,
    scarcityThreshold: c.scarcityThresholdIndex,
    floorPct: c.floorPercent, ceilPct: c.ceilPercent,
    warnPct: c.warnPercent, collapsePct: c.collapsePercent,
    theftDivisor:  on? t.riskDivisor : 0,
    riskCap: t.riskCapPer1000,
    watchPer100:   on? t.watchPer100Renown : 0,
    severityStep: t.severityStepPer1000, maxPlotsHit: t.maxPlotsHit,
    minRiskToRoll: t.minRiskToRollPer1000,
    renownDivisor: on? r.gainDivisor : 0,
    renownDecay: r.decayPerSeason, renownCap: r.cap,
    perVisitor: r.perVisitor, premiumPer: r.premiumPerVisitor, premiumCap: r.premiumCapPercent,
    obsDen: D.signal.observation.denominator
  };
}

/// WeatherCalendar
function weatherCalendar(D, years){
  const rng=NetRandom(D.config.seed+D.config.weatherSeedOffset);
  const dps=D.seasons.daysPerSeason, nS=D.seasons.seasons.length;
  const out=[];
  for(let day=0; day<years*dps*nS; day++){
    const s=D.seasons.seasons[Math.floor((day%(dps*nS))/dps)];
    let total=0; for(const w of s.weatherWeights) total+=w.weight;
    let pick=s.weatherWeights[s.weatherWeights.length-1].weatherId;
    if(total>0){
      let roll=rng.next(total);
      for(const w of s.weatherWeights){ roll-=w.weight; if(roll<0){ pick=w.weatherId; break; } }
    }
    out.push(pick);
  }
  return out;
}

/// PriceBook — 기준가 잡음만. 남의 반응은 여기 없다.
function priceBook(D, years){
  const stepDays=Math.max(1,D.economy.priceStepDays);
  const dpy=D.seasons.daysPerSeason*D.seasons.seasons.length;
  const steps=Math.floor(years*dpy/stepDays)+1;
  const n=D.crops.crops.length;
  const price=[]; for(let c=0;c<n;c++) price.push(new Array(steps).fill(0));
  const rng=NetRandom(D.config.seed+D.config.priceSeedOffset);
  const rem=new Array(n).fill(0);
  const band=D.economy.priceBandPercent;
  for(let step=0; step<steps; step++)
    for(let c=0;c<n;c++){
      const shop=D.shopOf(D.crops.crops[c].id);
      const basePrice=shop?shop.sellUnit:0;
      const percent=100-band+rng.next(band*2+1);
      price[c][step]=mulDiv(basePrice,percent,100,rem,c);
    }
  return (cropId,day)=>{
    const c=D.cropIndex(cropId);
    return c<0?0:price[c][Math.floor(day/stepDays)];
  };
}

/// Report/SignalBoard.Compute — 계획 하나를 계절 단위로 돌려 시세판을 뽑는다.
function computeBoard(D, plan, on, years){
  const rules=makeRules(D,on), M=SignalMath(D,rules);
  const weather=weatherCalendar(D,years), baseUnit=priceBook(D,years);
  const rng=NetRandom(D.config.seed+D.config.signalSeedOffset);

  const nC=D.crops.crops.length, nP=D.plots.plots.length;
  const dps=D.seasons.daysPerSeason, nS=D.seasons.seasons.length;
  const idx=new Array(nC).fill(100);
  const obsRem=new Array(nC).fill(0), sellRem=new Array(nC).fill(0);
  let renown=0, visitors=0, premium=0;

  const order=D.plotsByExposureDesc;
  const rows=[]; let grand=0;

  for(let s=0; s<years*nS; s++){
    const season=D.seasons.seasons[s%nS];
    const startDay=s*dps;
    const row={
      seasonNumber:s+1, year:Math.floor(s/nS)+1, seasonId:season.id, seasonNameKo:season.nameKo,
      plotCrop:new Array(nP).fill(null), plotEff:new Array(nP).fill(0), skippedBySoil:0,
      observedIndex:new Array(nC).fill(0), priceBefore:idx.slice(), priceAfter:null,
      renownBefore:renown, renownAfter:0, visitors, premium,
      theftRisk:0, theftRoll:0, theftStruck:false, theftHits:0, theftTargets:[],
      fogDays:0, revenueByCrop:new Array(nC).fill(0), revenueTotal:0, observedTotal:0
    };

    // 1. 계획을 칸에 펼친다 (노출 내림차순으로 cropOrder[i])
    const cropOrder=(plan.bySeason.find(b=>b.seasonId===season.id)||{}).cropOrder||[];
    const assign={};
    for(let i=0;i<order.length;i++){
      const cid=cropOrder[i]||'';
      if(!cid) continue;
      const crop=D.cropOf(cid); if(!crop) continue;
      if(order[i].soil<crop.minSoil){ row.skippedBySoil++; continue; }
      assign[order[i].id]=cid;
    }
    for(let i=0;i<nP;i++) row.plotCrop[i]=assign[D.plots.plots[i].id]||null;

    // 2. 가림을 셈한 유효 노출
    const depth=Math.max(1,D.plots.screenDepth);
    for(let i=0;i<nP;i++){
      const p=D.plots.plots[i], heights=[];
      for(let k=0;k<depth;k++){
        const front=D.plotAt(p.x,p.y-(k+1));
        heights.push(front&&assign[front.id] ? D.cropOf(assign[front.id]).screenHeight : 0);
      }
      row.plotEff[i]=M.effExposure(p.exposure,heights);
    }

    // 3. 계절 내내 날마다 관측한다. 순회는 날짜 → plots[] 순서
    const obs=new Array(nC).fill(0);
    for(let dd=0; dd<dps; dd++){
      const w=D.weatherOf(weather[startDay+dd]);
      if(w.id==='fog') row.fogDays++;
      for(let i=0;i<nP;i++){
        const cid=row.plotCrop[i]; if(!cid) continue;
        const c=D.cropIndex(cid);
        obs[c]+=M.dailyObserved(D.crops.crops[c].visibility, row.plotEff[i],
                                w.exposurePercent, season.roadTrafficPercent, obsRem, c);
      }
    }

    // 4. 이 계절에 한 번 걷었다고 볼 때의 매출 (시세지수는 마감 전 값)
    for(let c=0;c<nC;c++){
      const crop=D.crops.crops[c];
      let plotsWith=0;
      for(let i=0;i<nP;i++) if(row.plotCrop[i]===crop.id) plotsWith++;
      if(plotsWith===0) continue;
      const unit=M.sellUnit(baseUnit(crop.id,startDay), idx[c], premium, sellRem, c);
      row.revenueByCrop[c]=plotsWith*crop.yieldUnits*unit;
      row.revenueTotal+=row.revenueByCrop[c];
    }
    grand+=row.revenueTotal;

    // 5. 남이 반응한다 (SignalState.CloseSeason)
    for(let c=0;c<nC;c++){ row.observedIndex[c]=Math.floor(obs[c]/dps); row.observedTotal+=row.observedIndex[c]; }

    row.theftRisk=M.theftRisk(row.observedIndex,renown);
    row.theftRoll=rng.next(1000);                       // 위험도와 무관하게 계절마다 꼭 한 번
    if(row.theftRisk>0 && row.theftRoll<row.theftRisk){
      const hits=M.theftHits(row.theftRisk);
      const cand=[];
      for(let i=0;i<nP;i++){
        const cid=row.plotCrop[i]; if(!cid) continue;
        cand.push({id:D.plots.plots[i].id, cropId:cid, eff:row.plotEff[i], appeal:D.cropOf(cid).theftAppeal});
      }
      cand.sort((a,b)=>{
        const d=(b.appeal*b.eff)-(a.appeal*a.eff);
        return d!==0?d:(a.id<b.id?-1:a.id>b.id?1:0);
      });
      const picks=[];
      for(const t of cand){ if(picks.length>=hits) break; if(t.appeal>0) picks.push(t); }
      if(picks.length>0){
        row.theftStruck=true; row.theftHits=picks.length;
        row.theftTargets=picks.map(t=>t.id+':'+t.cropId);
      }
    }

    renown=M.nextRenown(renown,row.observedIndex);
    visitors=M.visitors(renown);
    premium=M.premium(visitors);
    row.renownAfter=renown;

    for(let c=0;c<nC;c++) idx[c]=M.nextPriceIndex(idx[c],row.observedIndex[c],D.crops.crops[c].copyAppeal);
    row.priceAfter=idx.slice();

    rows.push(row);
  }
  return {planId:plan.id, nameKo:plan.nameKo, noteKo:plan.noteKo, on, rows, grand, rules};
}

function applyPalette(pal){

  for(const k in pal.color) if(!k.startsWith('_')) r.setProperty('--'+k,pal.color[k]);
  const set=(n,v)=>r.setProperty(n,v);
  set('--cellW',pal.board.cellWidthPx+'px'); set('--cellH',pal.board.cellHeightPx+'px');
  set('--cellGap',pal.board.cellGapPx+'px'); set('--labelW',pal.board.labelWidthPx+'px');
  set('--glow',pal.board.glowPx+'px'); set('--seamOpacity',pal.board.seamOpacity);
  set('--tapeH',pal.tape.heightPx+'px'); set('--perf',pal.tape.perforationPx+'px');
  set('--perfGap',pal.tape.perforationGapPx+'px'); set('--tapeMargin',pal.tape.marginPx+'px');
  set('--tapeLh',pal.tape.lineHeight);
  set('--scanOpacity',pal.grade.scanlineOpacity); set('--scanPitch',pal.grade.scanlinePitchPx+'px');
  set('--glowOpacity',pal.grade.glowOpacity); set('--vignette',pal.grade.vignette);
  set('--tapeTextureOpacity',pal.grade.tapeTextureOpacity);
  set('--fTitle',pal.type.sizeTitle+'px'); set('--fHead',pal.type.sizeHeading+'px');
  set('--fBody',pal.type.sizeBody+'px'); set('--fHint',pal.type.sizeHint+'px');
  set('--fCell',pal.type.sizeCell+'px'); set('--fTape',pal.type.sizeTape+'px');
  set('--trackTitle',pal.type.trackingTitle+'px'); set('--trackTape',pal.type.trackingTape+'px');
}

function level(idx,rules){
  if(idx>100) return 'lvlUp';
  if(idx===100) return 'lvlFlat';
  if(idx>rules.collapsePct) return 'lvlWarn';
  return 'lvlBad';
}

/// 스플릿플랩 한 칸. 숫자 세 자리를 각자 뒤집는다.
function makeCell(){
  const cell=document.createElement('div');
  cell.className='cell';
  for(let i=0;i<3;i++){ const f=document.createElement('div'); f.className='flap'; f.textContent=' '; cell.appendChild(f); }
  return cell;
}
function setCell(cell,value,cls,pal,animate,onFlap){
  cell.className='cell '+cls;
  const txt=String(value).padStart(3,' ');
  [...cell.children].forEach((f,i)=>{
    const target=txt[i]==='0'&&i===0?' ':txt[i];
    if(f.textContent===target) return;
    if(!animate){ f.textContent=target; return; }
    const steps=1+Math.floor(Math.random()*pal.board.flapStepsMax);
    let n=0;
    f.classList.add('turning');
    const tick=()=>{
      if(n<steps){ f.textContent=String(Math.floor(Math.random()*10)); n++; setTimeout(tick,pal.board.flapStepMs); }
      else { f.textContent=target; f.classList.remove('turning'); if(onFlap) onFlap(); }
    };
    tick();
  });
}

const audio={};
function beep(pal,key,vol){
  try{
    const src=pal.sfx[key]; if(!src) return;
    if(!audio[key]){ audio[key]=new Audio(src); }
    const a=audio[key].cloneNode();
    a.volume=vol==null?0.3:vol;
    a.play().catch(()=>{});
  }catch(e){}
}

/// 전문을 만든다: (반응 틀 x 작물) 격자에서 이 계절에 해당하는 것만 뽑는다.
/// ContentBudget 이 세는 것이 바로 이 격자다 — 틀 8개 x 작물 8종 = 64통.
function telegramsFor(D,row,prev,rules){
  const out=[];
  const tpl=id=>D.events.templates.find(t=>t.id===id);
  const name=c=>D.crops.crops[c].nameKo;
  const push=(id,crop,num)=>{ const t=tpl(id); if(t) out.push({t,crop,num}); };

  // 시세: 가장 크게 내린 작물 · 가장 크게 오른 작물
  let fell=-1,fellBy=0, rose=-1,roseBy=0;
  for(let c=0;c<D.crops.crops.length;c++){
    const d=row.priceAfter[c]-row.priceBefore[c];
    if(d<0 && -d>fellBy){ fellBy=-d; fell=c; }
    if(d>0 && d>roseBy && row.priceAfter[c]>100){ roseBy=d; rose=c; }
  }
  if(fell>=0 && fellBy>=8) push('copyReport',name(fell),Math.max(1,Math.floor(fellBy/8)));
  if(fell>=0) push('priceFall',name(fell),row.priceAfter[fell]);
  if(rose>=0) push('priceRise',name(rose),row.priceAfter[rose]);

  // 도둑
  if(row.theftStruck){
    const cid=row.theftTargets[0].split(':')[1];
    push('thiefHit',D.cropOf(cid).nameKo,row.theftHits);
  } else if(row.theftRisk>=rules.minRiskToRoll){
    let hot=0,hotV=-1;
    for(let c=0;c<D.crops.crops.length;c++){
      const v=row.observedIndex[c]*D.crops.crops[c].theftAppeal;
      if(v>hotV){ hotV=v; hot=c; }
    }
    push('thiefWarn',name(hot),row.theftRisk);
  }

  // 평판
  if(row.visitors>0){
    let best=0,bestV=-1;
    for(let c=0;c<D.crops.crops.length;c++){
      const v=row.observedIndex[c]*D.crops.crops[c].renownGain;
      if(v>bestV){ bestV=v; best=c; }
    }
    push('visitorArrive',name(best),row.visitors);
  }

  // 가림 간파 · 안개
  let screenFront=null;
  for(let i=0;i<D.plots.plots.length;i++){
    const p=D.plots.plots[i], cid=row.plotCrop[i];
    if(p.y===0 && cid && D.cropOf(cid).screenHeight>=40){ screenFront=cid; break; }
  }
  if(screenFront) push('screenNoticed',D.cropOf(screenFront).nameKo,row.observedTotal);
  if(row.fogDays>=6){
    let planted=0;
    for(let c=0;c<D.crops.crops.length;c++) if(row.observedIndex[c]>row.observedIndex[planted]) planted=c;
    push('fogCover',name(planted),row.fogDays);
  }
  return out;
}

      const i=plots.plots.findIndex(q=>q.id===p.id);
      const cid=row.plotCrop[i];
      const crop=cid?D.cropOf(cid):null;
      const eff=row.plotEff[i];
      const screened=eff<p.exposure;
      const front=D.plotAt(p.x,p.y-1);
      const obsC=crop?row.observedIndex[D.cropIndex(cid)]:0;
      const cls=!crop?'dim':(crop.theftAppeal>=30?'hot':(crop.copyAppeal>=60?'warm':'good'));
      reg+=`<tr class="${screened?'screened':''}">`+
        `<td class="id">${p.id}</td><td>${p.exposure}</td><td class="dim">${p.soil}</td>`+
        `<td class="${cls}">${crop?crop.nameKo:'—'}</td>`+
        `<td class="dim">${crop?crop.screenHeight:'—'}</td>`+
        `<td class="${screened?'good':''}">${eff}${screened?' ↓'+(p.exposure-eff):''}</td>`+
        `<td>${obsC}</td>`+
        `<td><span class="bar ${crop&&crop.theftAppeal>=30?'hot':''}" style="width:${Math.round(obsC*90/maxObs)}px"></span></td></tr>`;
      if(screened&&front) reg+=`<tr><td colspan="8" class="dim" style="border:0;padding:0 7px 4px">`+
        `└ 앞 칸 ${front.id} 의 ${row.plotCrop[plots.plots.findIndex(q=>q.id===front.id)]?D.cropOf(row.plotCrop[plots.plots.findIndex(q=>q.id===front.id)]).nameKo:'—'} 가 가린다</td></tr>`;
    });
    reg+=`<tr><th>관측 합계</th><th colspan="7" style="text-align:right">${row.observedTotal}</th></tr>`;
    document.getElementById('register').innerHTML=reg;

    // 전문
    const wires=telegramsFor(D,row,focusSeason>0?on.rows[focusSeason-1]:null,rules);
    const tape=document.getElementById('tape');
    let html='<div class="grain"></div>';
    if(wires.length===0){
      html+=`<p class="wire none">— 이 계절에는 들어온 전문이 없다. 아무도 밭을 보지 않았다 —</p>`;
    } else {
      wires.slice(0,4).forEach((w,n)=>{
        const lines=w.t.linesKo.map(l=>l.replace('{0}',w.crop).replace('{1}',w.num));
        html+=`<div class="wire"><div class="hdr">전문 ${String(focusSeason*4+n+1).padStart(3,'0')} · ${row.year}년 ${row.seasonNameKo} · ${w.t.nameKo}</div>`+
          lines.map((l,k)=>`<span class="ln">${k===lines.length-1?'<em>'+l+'</em>':l}<span class="stop"> 정지</span></span>`).join('')+
          `</div>`;
      });
    }
    tape.innerHTML=html;
    document.getElementById('wireSub').textContent=`${row.year}년 ${row.seasonNameKo} · ${Math.min(4,wires.length)}통`;
    document.getElementById('wireNote').innerHTML=
      `전문은 <b>반응 틀 ${events.templates.length}개 × 작물 ${crops.crops.length}종 = 고유 ${events.templates.length*crops.crops.length}통</b>의 격자에서 나온다. ` +
      `수치는 이 계절의 실제 관측치·시세지수·위험도다. 이 격자가 이 훅의 콘텐츠 예산이고, ` +
      `<code>tests/ContentBudgetTests.cs</code> 가 그 수를 센다. ` +
      `<b>격자에서 뽑은 전문이 사람이 쓴 글로 읽히는지는 기계가 판정하지 못한다.</b>`;

    // 계절 장부
    let led=`<tr><th>계절</th><th>관측</th><th>평판</th><th>방문</th><th>웃돈</th><th>위험</th><th>주사위</th><th>도둑</th><th>매출</th><th>누적</th></tr>`;
    let acc=0;
    on.rows.forEach((r,s)=>{
      acc+=r.revenueTotal;
      const hit=r.theftStruck;
      led+=`<tr style="${s===focusSeason?'background:rgba(78,107,30,.14)':''}">`+
        `<td class="id">${r.year}년 ${r.seasonNameKo}</td><td>${r.observedTotal}</td>`+
        `<td class="${r.renownAfter>0?'good':'dim'}">${r.renownAfter}</td><td class="dim">${r.visitors}</td>`+
        `<td class="${r.premium>0?'good':'dim'}">${r.premium}%</td>`+
        `<td class="${r.theftRisk>=rules.minRiskToRoll?'warm':'dim'}">${r.theftRisk}</td>`+
        `<td class="dim">${r.theftRoll}</td>`+
        `<td class="${hit?'hot':'dim'}">${hit?r.theftHits+'칸':'—'}</td>`+
        `<td>${fmt(r.revenueTotal)}</td><td class="dim">${fmt(acc)}</td></tr>`;
    });
    document.getElementById('ledger').innerHTML=led;

    if(first){ first=false; }
  }

  document.getElementById('foot').innerHTML=
    `<p><b>이 화면은 손으로 그린 그림이 아니다.</b> <code>../data/</code> 의 여덟 JSON을 읽고, ` +
    `<code>src/Sim/SignalMath.cs</code> · <code>PriceBook</code> · <code>WeatherCalendar</code> 를 JS로 이식해 ` +
    `<code>.NET System.Random(${config.seed})</code> 와 같은 수열로 3년을 다시 돌린다. ` +
    `그래서 화면의 3년이 테스트가 돌린 3년과 같다 — 대조표는 ` +
    `<code>tests/SignalBoardTests.cs</code> 의 <code>목업이_맞춰_볼_표본값을_찍는다</code> 가 찍는다.</p>` +
    `<p><b>밭을 그리지 않는 이유.</b> 이 PoC의 규칙은 "내가 심은 것이 남에게 정보로 간다"다. ` +
    `밭을 그리면 플레이어는 자기 눈으로 밭을 보게 되고, 그러면 규칙과 그림이 어긋난다. ` +
    `여기서 밭은 등록부의 숫자와 종이 테이프의 전문으로만 나타난다.</p>` +
    `<p><b>기계가 판정한 것 / 못 한 것.</b> 검사기 아홉이 확인한 것은 고장이다(씨드 재현·참조 무결성·100년 경제· ` +
    `계절 성립성·죽은 작물·페이싱·콘텐츠 예산·신호가 결과를 바꾸는가·단작이 최적이 아닌가). ` +
    `"시세판이 딸깍 바뀔 때 긴장되는가"는 사람만 판정한다. <code>README.md</code> 의 판정 칸 참고.</p>` +
    `<p style="color:var(--phosphorFaint)">글꼴 IBM Plex Mono · Nanum Gothic Coding 부분집합(OFL) · ` +
    `소리 Kenney Interface Sounds(CC0) · 질감 ambientCG(CC0). 전부 <code>CREDITS.md</code>.</p>`;

  render(false);
})();
</script>
</body>
</html>
