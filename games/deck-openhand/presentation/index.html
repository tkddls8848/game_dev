<!DOCTYPE html>
<!--
  deck-openhand 연출 목업 — "목판화 타로"

  이 파일은 손으로 그린 그림이 아니다. 아래 여섯 개를 전부 읽어서 그린다:
    palette.json        색 · 크기 · 필터값 (색을 코드에 박지 않는다)
    ../data/cards.json      카드 (코스트 · 효과 · 희귀도)
    ../data/enemies.json    적 (체력 · 행동 순서)
    ../data/runs/run_01.json  회차 구성 (보이는 창 크기 포함)
    ../data/balance.json    검사기 한계값
    scene.json          실제 시뮬레이션 한 판 (tests/SceneExportTests.cs 가 굽는다)

  예고된 다섯 수를 손으로 적으면 "늘 보인다"는 규칙 자체가 목업에서 거짓말이 된다.
  그래서 예고도 시뮬레이션에서 나온 값이다.

  file:// 로 열면 fetch 가 막힌다. 저장소 뿌리에서:
    python -m http.server 8000 --directory games/deck-openhand
    http://localhost:8000/presentation/
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공개 덱 — 연출 목업</title>
<style>
  /* 색과 크기는 전부 palette.json 에서 온다. 여기 박힌 값이 있으면 그건 버그다. */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--void);
    color: var(--ink);
    font-family: var(--font), Georgia, serif;
    font-size: var(--size-body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* 종이가 바탕이다. deck-rewind 와 정반대 — 그게 두 연출의 첫 차이다. */
  .leaf {
    position: relative; min-height: 100vh; padding: 46px 22px 76px;
    background-color: var(--paper);
  }
  .leaf::before {   /* 종이 질감 — CSS 필터로 크림 톤으로 올린다 (에셋은 원본 그대로) */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: url("assets/img/paper.jpg");
    background-size: 560px;
    opacity: var(--paper-tex-opacity);
    filter: hue-rotate(var(--paper-hue)) saturate(var(--paper-sat)) brightness(var(--paper-bright));
    mix-blend-mode: multiply;
  }
  .leaf::after {    /* 인쇄물의 눌린 가장자리. 정지해 있다 */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 44%, transparent 52%, rgba(23,20,15,var(--vignette)) 100%);
  }
  .wrap { position: relative; max-width: 1140px; margin: 0 auto; }

  /* ---- 머리 ---- */
  header { text-align: center; border-bottom: var(--frame) solid var(--ink); padding-bottom: 22px; }
  .kicker {
    font-variant: small-caps; letter-spacing: 5px; font-size: var(--size-hint);
    color: var(--accent);
  }
  h1 {
    font-size: var(--size-title); font-weight: 600; letter-spacing: var(--ls-title);
    margin: 6px 0 4px; color: var(--ink); font-variant: small-caps;
  }
  .sub { color: var(--muted); font-size: var(--size-hint); margin: 0; font-style: italic; }
  .oneline { margin: 14px auto 0; max-width: 62ch; }

  h2 {
    font-size: var(--size-heading); font-weight: 600; margin: 52px 0 4px;
    font-variant: small-caps; letter-spacing: 2px; color: var(--ink);
    display: flex; align-items: center; gap: 12px;
  }
  h2::after { content: ""; flex: 1 1 auto; height: var(--hairline); background: var(--ink); opacity: 0.45; }
  h2 .n { color: var(--accent); }
  .note { color: var(--highlight); font-size: var(--size-hint); margin: 0 0 20px; max-width: 80ch;
          font-style: italic; }
  .note b { font-style: normal; font-weight: 600; color: var(--ink); }
  .note code { font-family: ui-monospace, monospace; font-size: 0.9em; font-style: normal; }

  /* ---- 해칭. 목판의 명암은 색이 아니라 선의 밀도다 ---- */
  .hatch {
    background-image: repeating-linear-gradient(
      var(--hatch-angle), var(--hatch) 0 var(--hairline),
      transparent var(--hairline) var(--hatch-gap));
  }

  /* ---- 계측 띠 ---- */
  .readout { display: flex; flex-wrap: wrap; border: var(--frame) solid var(--ink); }
  .readout > div {
    flex: 1 1 124px; padding: 9px 12px; border-right: var(--hairline) solid var(--ink);
    text-align: center;
  }
  .readout > div:last-child { border-right: 0; }
  .readout dt { font-size: var(--size-hint); color: var(--muted); font-variant: small-caps;
                letter-spacing: 1px; }
  .readout dd { margin: 1px 0 0; font-size: var(--size-number); font-weight: 600; }
  .readout dd small { font-size: var(--size-hint); color: var(--muted); font-weight: 400; }

  /* ---- 카드 ---- */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
  .card {
    position: relative; border: var(--frame) solid var(--ink); background: var(--surface-raised);
    padding: 0; border-radius: var(--radius); display: flex; flex-direction: column;
    min-height: 208px; box-shadow: 3px 3px 0 rgba(23,20,15,0.22);
  }
  .card-head {
    border-bottom: var(--hairline) solid var(--ink); padding: 9px 11px 7px;
    display: flex; align-items: baseline; gap: 8px;
  }
  .cost {
    flex: 0 0 auto; width: 26px; height: 26px; border: var(--hairline) solid var(--ink);
    border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 14px;
  }
  .cost.free { color: var(--muted); border-style: dotted; }
  .card-name { font-size: 18px; font-weight: 600; font-variant: small-caps; letter-spacing: 1px; }
  .card-id { font-size: 10px; color: var(--muted); font-family: ui-monospace, monospace; }
  .rarity-band { height: 4px; background: var(--card-edge); }
  .card-text { padding: 10px 11px; font-style: italic; color: var(--highlight); flex: 1 1 auto;
               font-size: var(--size-hint); }
  .effects { border-top: var(--hairline) solid var(--ink); }
  .eff {
    display: flex; align-items: center; gap: 7px; padding: 4px 11px; font-size: var(--size-hint);
    border-bottom: var(--hairline) dotted var(--muted);
  }
  .eff:last-child { border-bottom: 0; }
  .eff img { width: 14px; height: 14px; }
  .eff .amt { margin-left: auto; font-weight: 600; }
  .eff.order { color: var(--accent); }
  .eff.order .amt { color: var(--accent); }
  .eff .tgt { color: var(--muted); font-size: 10px; }

  /* ---- 예고: 이 PoC의 얼굴 ---- */
  .fate { border: var(--frame) solid var(--ink); background: var(--surface); }
  .fate-head {
    padding: 9px 13px; border-bottom: var(--hairline) solid var(--ink);
    font-variant: small-caps; letter-spacing: 2px; display: flex; justify-content: space-between;
  }
  .fate-head span:last-child { color: var(--muted); font-variant: normal; letter-spacing: 0;
                               font-size: var(--size-hint); font-style: italic; }
  .queue { display: flex; gap: 0; }
  .slot {
    flex: 1 1 0; border-right: var(--hairline) solid var(--ink); padding: 11px 8px;
    text-align: center; min-width: 0;
  }
  .slot:last-child { border-right: 0; }
  .slot .ord { font-size: 10px; color: var(--muted); font-variant: small-caps; letter-spacing: 1px; }
  .slot .kind { font-variant: small-caps; letter-spacing: 1px; font-size: var(--size-hint); }
  .slot .num { font-size: 24px; font-weight: 600; line-height: 1.1; }
  .slot.attack .num { color: var(--accent); }
  .slot.now { background: var(--ink); color: var(--surface); }
  .slot.now .ord, .slot.now .kind { color: var(--paper); opacity: 0.7; }
  .slot.now.attack .num { color: var(--paper); }
  .slot.biggest { outline: var(--frame) solid var(--accent); outline-offset: -4px; }

  /* ---- 전투 장면 ---- */
  .scene { border: var(--frame) solid var(--ink); }
  .turn { border-bottom: var(--hairline) solid var(--ink); padding: 0; }
  .turn:last-child { border-bottom: 0; }
  .turn-top { display: grid; grid-template-columns: 52px 1fr 216px; }
  .tno { border-right: var(--hairline) solid var(--ink); padding: 12px 6px; text-align: center;
         color: var(--muted); font-size: var(--size-hint); }
  .tno b { display: block; font-size: 20px; color: var(--ink); }
  .tbody { padding: 12px 14px; min-width: 0; }
  .tside { border-left: var(--hairline) solid var(--ink); padding: 12px 14px; font-size: var(--size-hint); }
  .bars { display: grid; gap: 5px; margin-bottom: 9px; }
  .bar { display: grid; grid-template-columns: 46px 1fr 78px; align-items: center; gap: 8px;
         font-size: var(--size-hint); }
  .bar .lbl { color: var(--muted); font-variant: small-caps; }
  .bar .track { height: 10px; border: var(--hairline) solid var(--ink); position: relative;
                overflow: hidden; }
  .bar .fill { position: absolute; inset: 0 auto 0 0; }
  .bar .fill.hp { background-color: var(--highlight); }
  .bar .fill.ehp { background-color: var(--accent); }
  .bar .val { text-align: right; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { border: var(--hairline) solid var(--muted); padding: 1px 7px; font-size: 12px;
          color: var(--highlight); }
  .chip.played { border-color: var(--ink); border-width: var(--frame); color: var(--ink);
                 font-weight: 600; }
  .chip.order { border-color: var(--accent); color: var(--accent); }
  .row-label { font-size: 10px; color: var(--muted); font-variant: small-caps; letter-spacing: 1px;
               margin: 9px 0 4px; }
  .mini-queue { display: flex; gap: 3px; flex-wrap: wrap; }
  .mq { border: var(--hairline) solid var(--muted); padding: 0 5px; font-size: 11px; }
  .mq.attack { border-color: var(--accent); color: var(--accent); }
  .changed { color: var(--accent); font-weight: 600; margin-top: 7px;
             border-top: var(--hairline) solid var(--accent); padding-top: 5px; font-size: 11px; }
  .enemyact { margin-top: 8px; font-size: var(--size-hint); }
  .enemyact .hit { color: var(--accent); font-weight: 600; }

  /* ---- 적: 타로 카드 ---- */
  .enemies { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .enemy { border: var(--frame) solid var(--ink); background: var(--surface-raised);
           box-shadow: 3px 3px 0 rgba(23,20,15,0.22); }
  .enemy-art { border-bottom: var(--hairline) solid var(--ink); text-align: center;
               background-color: var(--surface); }
  .rule-band { height: 9px; border-bottom: var(--frame) solid var(--ink); }
  .enemy-art img {
    max-width: 100%; height: 210px; object-fit: contain; display: block; margin: 0 auto;
    filter: contrast(var(--art-contrast)) saturate(var(--art-sat)) sepia(var(--art-sepia));
  }
  .enemy-body { padding: 12px 14px; }
  .enemy h3 { margin: 0; font-size: 21px; font-variant: small-caps; letter-spacing: 2px; }
  .enemy .meta { color: var(--muted); font-size: 11px; margin-bottom: 9px;
                 font-family: ui-monospace, monospace; }
  .pattern { display: flex; gap: 4px; flex-wrap: wrap; }
  .pat { border: var(--hairline) solid var(--muted); padding: 2px 6px; font-size: 11px; }
  .pat.attack { border-color: var(--accent); color: var(--accent); }
  .pat.visible { border-width: var(--frame); border-color: var(--ink); color: var(--ink); }
  .legend { color: var(--muted); font-size: 11px; margin-top: 8px; font-style: italic; }

  .sfx { display: flex; flex-wrap: wrap; gap: 10px; }
  .sfx button {
    font-family: inherit; font-size: var(--size-hint); color: var(--ink);
    background: var(--surface-raised); border: var(--frame) solid var(--ink);
    padding: 8px 15px; cursor: pointer; font-variant: small-caps; letter-spacing: 1px;
    box-shadow: 2px 2px 0 rgba(23,20,15,0.22);
  }
  .sfx button:hover { color: var(--accent); border-color: var(--accent); }
  .sfx button small { display: block; color: var(--muted); font-variant: normal;
                      letter-spacing: 0; font-family: ui-monospace, monospace; }
  .boss-mark { float: right; width: 22px; height: 22px; }
  .err { border: var(--frame) solid var(--accent); padding: 18px; margin: 30px 0;
         background: var(--surface-raised); }
  .err code { font-family: ui-monospace, monospace; }
  footer { margin-top: 56px; border-top: var(--frame) solid var(--ink); padding-top: 14px;
           color: var(--muted); font-size: 11px; }
  @media (max-width: 880px) {
    .turn-top { grid-template-columns: 42px 1fr; }
    .tside { grid-column: 1 / -1; border-left: 0; border-top: var(--hairline) solid var(--ink); }
    .queue { flex-wrap: wrap; }
    .slot { flex: 1 1 33%; border-bottom: var(--hairline) solid var(--ink); }
  }
</style>
</head>
<body>
<div class="leaf"><div class="wrap" id="root">
  <p class="sub">데이터를 읽는 중…</p>
</div></div>

<script>
// ───────────────────────────────────────────────────────────────
// 전부 데이터에서 온다. 이 파일에 게임 수치를 적지 않는다.
// ───────────────────────────────────────────────────────────────
const ICON = {
  damage: "assets/icons/sword.svg",
  block: "assets/icons/shield.svg",
  brace: "assets/icons/shield.svg",
  heal: "assets/icons/flask_full.svg",
  draw: "assets/icons/hourglass.svg",
  energy: "assets/icons/flask_full.svg",
  strength: "assets/icons/sword.svg",
  weak: "assets/icons/hourglass.svg",
  echo: "assets/icons/card_target.svg",
  skip_intent: "assets/icons/card_target.svg",
  swap_intent: "assets/icons/card_target.svg"
};
const EFFECT_KO = {
  damage: "피해", block: "방어", strength: "힘", draw: "드로우", energy: "기력",
  heal: "회복", weak: "약화",
  brace: "대비 (다음 수만큼 + )", echo: "공격 하나마다",
  skip_intent: "다음 수를 지운다", swap_intent: "다음 두 수를 바꾼다"
};
// 순서를 건드리거나 순서를 읽는 효과. 이 PoC의 규칙에 닿는 것들이다.
const ORDER_EFFECTS = ["brace", "echo", "skip_intent", "swap_intent"];
const INTENT_KO = { attack: "공격", block: "방어", weak: "약화", strengthen: "강화", heal: "회복" };
const TARGET_KO = { self: "자신", enemy: "적", player: "플레이어" };
const SFX_KO = { cardPlace: "카드 놓기", reveal: "예고 넘기기", damage: "피해" };
const ART = {
  enemy_hierophant: "assets/img/tarot-hierophant.jpg",
  enemy_hanged: "assets/img/tarot-hanged.jpg",
  enemy_tower: "assets/img/tarot-tower.jpg"
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

async function getJson(path) {
  const r = await fetch(path, { cache: "no-store" });
  if (!r.ok) throw new Error(path + " → HTTP " + r.status);
  return r.json();
}

function applyPalette(p) {
  const s = document.documentElement.style, c = p.color, t = p.type, l = p.line, g = p.grade;
  s.setProperty("--void", c.void);
  s.setProperty("--ink", c.ink);
  s.setProperty("--surface", c.surface);
  s.setProperty("--surface-raised", c.surfaceRaised);
  s.setProperty("--paper", c.paper);
  s.setProperty("--accent", c.accent);
  s.setProperty("--accent-dim", c.accentDim);
  s.setProperty("--muted", c.muted);
  s.setProperty("--highlight", c.highlight);
  s.setProperty("--hatch", c.hatch);
  s.setProperty("--font", t.family);
  s.setProperty("--size-title", t.sizeTitle + "px");
  s.setProperty("--size-heading", t.sizeHeading + "px");
  s.setProperty("--size-body", t.sizeBody + "px");
  s.setProperty("--size-hint", t.sizeHint + "px");
  s.setProperty("--size-number", t.sizeNumber + "px");
  s.setProperty("--ls-title", t.letterSpacingTitle + "px");
  s.setProperty("--hairline", l.hairline + "px");
  s.setProperty("--frame", l.frame + "px");
  s.setProperty("--radius", l.radius + "px");
  s.setProperty("--hatch-gap", l.hatchSpacingPx + "px");
  s.setProperty("--hatch-angle", l.hatchAngleDeg + "deg");
  s.setProperty("--paper-tex-opacity", g.paperTextureOpacity);
  s.setProperty("--paper-hue", g.paperHueRotateDeg + "deg");
  s.setProperty("--paper-sat", g.paperSaturate);
  s.setProperty("--paper-bright", g.paperBrightness);
  s.setProperty("--art-contrast", g.artContrast);
  s.setProperty("--art-sat", g.artSaturate);
  s.setProperty("--art-sepia", g.artSepia);
  s.setProperty("--vignette", g.vignette);
  // 글꼴도 palette.json 이 가리키는 파일에서 온다 (OFL, assets/fonts 에 라이선스 전문 동봉).
  new FontFace(t.family, 'url("' + t.familyFile + '")')
    .load().then(f => document.fonts.add(f)).catch(() => {});
  if (t.familyItalicFile) {
    new FontFace(t.family, 'url("' + t.familyItalicFile + '")', { style: "italic" })
      .load().then(f => document.fonts.add(f)).catch(() => {});
  }
}

function effRow(e) {
  const isOrder = ORDER_EFFECTS.indexOf(e.type) >= 0;
  return '<div class="eff' + (isOrder ? " order" : "") + '">'
    + (ICON[e.type] ? '<img src="' + ICON[e.type] + '" alt="">' : "")
    + '<span>' + esc(EFFECT_KO[e.type] || e.type) + '</span>'
    + '<span class="tgt">' + esc(TARGET_KO[e.target] || e.target) + '</span>'
    + '<span class="amt">' + e.amount + '</span></div>';
}

function cardEl(c, pal) {
  const edge = pal.rarity[c.rarity] || pal.color.muted;
  return '<article class="card" style="--card-edge:' + edge + '">'
    + '<div class="rarity-band"></div>'
    + '<div class="card-head">'
    +   '<div class="cost' + (c.cost === 0 ? " free" : "") + '">' + c.cost + '</div>'
    +   '<div><div class="card-name">' + esc(c.nameKo) + '</div>'
    +       '<div class="card-id">' + esc(c.id) + ' · ' + esc(c.rarity) + '</div></div>'
    + '</div>'
    + '<p class="card-text">' + esc(c.textKo) + '</p>'
    + '<div class="effects">' + c.effects.map(effRow).join("") + '</div>'
    + '</article>';
}

/** 예고 다섯 칸. 이 PoC의 얼굴이므로 크게 그린다. */
function queueEl(peek, biggestIdx) {
  return '<div class="queue">' + peek.map(function (p, i) {
    const cls = ["slot", p.type, i === 0 ? "now" : "", i === biggestIdx ? "biggest" : ""].join(" ");
    return '<div class="' + cls + '">'
      + '<div class="ord">' + (i === 0 ? "이번" : (i + 1) + "번째") + '</div>'
      + '<div class="num">' + p.amount + '</div>'
      + '<div class="kind">' + esc(INTENT_KO[p.type] || p.type) + '</div></div>';
  }).join("") + '</div>';
}

function biggestAttackIndex(peek) {
  let idx = -1, best = 0;
  peek.forEach(function (p, i) { if (p.type === "attack" && p.amount > best) { best = p.amount; idx = i; } });
  return idx;
}

function bar(label, cls, cur, max) {
  const pct = max > 0 ? Math.max(0, Math.min(100, Math.round(cur * 100 / max))) : 0;
  return '<div class="bar"><span class="lbl">' + esc(label) + '</span>'
    + '<span class="track"><span class="fill ' + cls + '" style="width:' + pct + '%"></span></span>'
    + '<span class="val">' + cur + ' / ' + max + '</span></div>';
}

function miniQueue(peek) {
  return '<div class="mini-queue">' + peek.map(p =>
    '<span class="mq ' + p.type + '">' + esc(INTENT_KO[p.type] || p.type) + ' ' + p.amount + '</span>'
  ).join("") + '</div>';
}

function turnEl(t, cards) {
  const name = id => (cards[id] ? cards[id].nameKo : id);
  const isOrderCard = id => cards[id]
    && cards[id].effects.some(e => ORDER_EFFECTS.indexOf(e.type) >= 0);
  const played = t.played.length
    ? t.played.map(id => '<span class="chip played' + (isOrderCard(id) ? " order" : "") + '">'
        + esc(name(id)) + '</span>').join("")
    : '<span class="chip">내지 않음</span>';
  const hand = t.hand.map(id => '<span class="chip">' + esc(name(id)) + '</span>').join("");
  const sig = q => q.map(p => p.type + p.amount).join(",");
  const orderChanged = sig(t.peek) !== sig(t.peekAfterPlay);
  const act = esc(t.enemyAction)
    .replace(/attack (\d+)/, '<span class="hit">공격 $1</span>')
    .replace(/dealt=(\d+)/, '실피해 $1').replace(/hp=(\d+)/, '체력 $1')
    .replace(/enemy /, '적 ').replace(/block (\d+)/, '방어 $1')
    .replace(/weak (\d+)/, '약화 $1').replace(/strengthen (\d+)/, '강화 $1')
    .replace(/heal (\d+)/, '회복 $1').replace(/ehp=(\d+)/, '적 체력 $1');

  return '<div class="turn">'
    + queueEl(t.peek, biggestAttackIndex(t.peek))
    + '<div class="turn-top">'
    +   '<div class="tno">T<b>' + t.round + '</b></div>'
    +   '<div class="tbody">'
    +     '<div class="bars">'
    +       bar("나", "hp", t.playerHpAfter, t.playerMaxHp)
    +       bar("적", "ehp", t.enemyHpAfter, t.enemyMaxHp)
    +     '</div>'
    +     '<div class="row-label">손패 ' + t.hand.length + '장 · 기력 ' + t.energy
    +       ' · 덱 ' + t.deck + ' · 버림 ' + t.discard + '</div>'
    +     '<div class="chips">' + hand + '</div>'
    +     '<div class="row-label">낸 카드</div><div class="chips">' + played + '</div>'
    +     '<div class="enemyact">' + act + '</div>'
    +   '</div>'
    +   '<div class="tside">'
    +     '<div class="row-label">대비로 막을 값</div><div>' + t.braceValue
    +       ' <span style="color:var(--muted)">(+ 카드의 2)</span></div>'
    +     '<div class="row-label">보이는 공격 수</div><div>' + t.attacksAhead + '</div>'
    +     '<div class="row-label">방어</div><div>' + t.playerBlock + '</div>'
    +     (orderChanged
        ? '<div class="changed">순서를 바꿨다<br>' + miniQueue(t.peekAfterPlay) + '</div>' : "")
    +   '</div>'
    + '</div></div>';
}

function enemyEl(e, run) {
  const pat = e.pattern.map((p, i) =>
    '<span class="pat ' + p.type + (i < run.peekWindow ? " visible" : "") + '">'
    + esc(INTENT_KO[p.type] || p.type) + ' ' + p.amount + '</span>').join("");
  const art = ART[e.id];
  // 누가 보스인지는 data/runs/*.json 이 정한다. 목업이 따로 알고 있으면 데이터와 갈라진다.
  const crown = e.id === run.boss
    ? '<img class="boss-mark" src="assets/icons/crown_a.svg" alt="보스" title="보스">' : "";
  return '<div class="enemy">'
    + (art ? '<div class="enemy-art hatch"><img src="' + art + '" alt=""></div>' : "")
    + '<div class="enemy-body"><h3>' + crown + esc(e.nameKo) + '</h3>'
    + '<div class="meta">' + esc(e.id) + ' · 체력 ' + e.maxHp + ' · 순서 ' + e.pattern.length + '수</div>'
    + '<div class="pattern">' + pat + '</div>'
    + '<div class="legend">굵은 테두리가 처음에 보이는 ' + run.peekWindow + '수다. '
    + '순서가 ' + e.pattern.length + '수라 창보다 길다 — 그래서 끝까지 보이지는 않는다.</div>'
    + '</div></div>';
}

(async function () {
  const root = document.getElementById("root");
  let pal, cards, enemies, run, scene, balance;
  try {
    [pal, cards, enemies, run, scene, balance] = await Promise.all([
      getJson("palette.json"),
      getJson("../data/cards.json"),
      getJson("../data/enemies.json"),
      getJson("../data/runs/run_01.json"),
      getJson("scene.json"),
      getJson("../data/balance.json")
    ]);
  } catch (err) {
    root.innerHTML = '<div class="err"><b>데이터를 읽지 못했다.</b><br>' + esc(err.message)
      + '<br><br>이 목업은 <code>data/</code> 의 실제 JSON을 읽어 그린다. '
      + '<code>file://</code> 로 열면 브라우저가 fetch 를 막는다. 저장소 뿌리에서:<br><br>'
      + '<code>python -m http.server 8000 --directory games/deck-openhand</code><br>'
      + '<code>http://localhost:8000/presentation/</code></div>';
    return;
  }
  applyPalette(pal);

  const byId = {};
  cards.cards.forEach(c => { byId[c.id] = c; });
  const order = { common: 0, uncommon: 1, rare: 2 };
  const sorted = cards.cards.slice().sort((a, b) =>
    (order[a.rarity] - order[b.rarity]) || (a.cost - b.cost));
  const firstTurn = scene.turns[0];

  root.innerHTML =
    '<header>'
    + '<div class="kicker">' + esc(pal.name) + '</div>'
    + '<h1>공개 덱</h1>'
    + '<p class="sub">games/deck-openhand · ' + esc(pal.reference) + '</p>'
    + '<p class="oneline">' + esc(pal.oneLine) + '</p>'
    + '</header>'
    + '<div class="rule-band hatch"></div>'

    + '<h2><span class="n">§1</span> 예고</h2>'
    + '<p class="note">이 PoC의 규칙은 여기 전부 있다. <b>다음 ' + run.peekWindow
    + '수가 늘 보인다.</b> 숨기는 것이 없으므로 문제는 "무엇이 올까"가 아니라 '
    + '<b>"어느 순서로 받을까"</b>다. 아래 칸은 '
    + esc(scene.generatedBy) + ' 가 씨드 ' + scene.seed + ' 로 돌린 판의 1턴 예고 그대로다.</p>'
    + '<div class="fate">'
    +   '<div class="fate-head"><span>' + esc(scene.enemyNameKo) + '의 정해진 수</span>'
    +     '<span>scene.json · T1</span></div>'
    +   queueEl(firstTurn.peek, biggestAttackIndex(firstTurn.peek))
    + '</div>'
    + '<p class="note" style="margin-top:12px">붉게 테두리 친 칸이 창 안에서 가장 큰 공격이다. '
    + '<b>가림막</b>은 그것이 바로 다음일 때만 값이 크고, <b>역순</b>은 그것을 한 칸 뒤로 민다. '
    + '이게 "순서가 퍼즐"의 전부다.</p>'

    + '<h2><span class="n">§2</span> 회차</h2>'
    + '<p class="note">전부 <b>data/runs/' + esc(run.id) + '.json</b> 에서 읽은 값이다. '
    + '적의 행동에는 난수가 없다 — 난수가 닿는 곳은 카드를 뽑는 순서 하나뿐이고, '
    + '그래서 운의 비중이 작다.</p>'
    + '<div class="readout">'
    +   '<div><dt>체력</dt><dd>' + run.playerMaxHp + '</dd></div>'
    +   '<div><dt>손패</dt><dd>' + run.handSize + '</dd></div>'
    +   '<div><dt>기력 / 턴</dt><dd>' + run.energyPerTurn + '</dd></div>'
    +   '<div><dt>보이는 수</dt><dd>' + run.peekWindow + '</dd></div>'
    +   '<div><dt>전투</dt><dd>' + (run.battles.length + 1) + '<small> (보스 포함)</small></dd></div>'
    +   '<div><dt>시작 덱</dt><dd>' + run.startingDeck.length + '<small>장</small></dd></div>'
    +   '<div><dt>씨드</dt><dd><small>' + run.seed + '</small></dd></div>'
    + '</div>'

    + '<h2><span class="n">§3</span> 카드 ' + cards.cards.length + '종</h2>'
    + '<p class="note">코스트 · 효과 · 희귀도는 <b>data/cards.json</b> 그대로다. '
    + '<span style="color:var(--accent);font-style:normal">붉은 효과</span>가 '
    + '순서를 읽거나 건드리는 것들이다 — 대비 · 메아리 · 역순 · 가림막.</p>'
    + '<div class="cards">' + sorted.map(c => cardEl(c, pal)).join("") + '</div>'

    + '<h2><span class="n">§4</span> 전투 한 장면 — ' + esc(scene.enemyNameKo) + '</h2>'
    + '<p class="note"><b>손으로 그린 장면이 아니다.</b> ' + esc(scene.generatedBy)
    + ' 가 씨드 ' + scene.seed + ' 로 실제 한 판을 돌려 <b>scene.json</b> 으로 굽고, '
    + '이 화면이 그걸 읽는다. 결과 ' + esc(scene.outcome === "PlayerWon" ? "승" : "패")
    + ' · ' + scene.turns.length + '턴 · 가림막 ' + scene.intentsSkipped
    + '회 · 역순 ' + scene.intentsSwapped + '회. '
    + '턴마다 맨 위 다섯 칸이 <b>그 턴에 실제로 보였던 예고</b>다.</p>'
    + '<div class="scene">' + scene.turns.map(t => turnEl(t, byId)).join("") + '</div>'

    + '<h2><span class="n">§5</span> 소리</h2>'
    + '<p class="note">경로는 <b>palette.json</b> 의 <code>sfx</code> 에서 온다 — 파일명을 코드에 박지 않는다. '
    + '이 연출은 <b>deck-rewind 보다 전체가 느리다</b>(' + pal.motion.cardPlaceMs + 'ms 대 '
    + '120ms). 정해진 것을 읽는 게임이므로 급할 이유가 없다. 눌러서 들어 볼 것.</p>'
    + '<div class="sfx">'
    +   Object.keys(pal.sfx).map(function (k) {
          return '<button data-sfx="' + esc(pal.sfx[k]) + '">' + esc(SFX_KO[k] || k)
            + '<small>' + esc(pal.sfx[k]) + '</small></button>';
        }).join("")
    + '</div>'

    + '<h2><span class="n">§6</span> 적 ' + enemies.enemies.length + '종</h2>'
    + '<p class="note">초상은 Rider-Waite 타로(1909, Pamela Colman Smith · 퍼블릭 도메인)다. '
    + '원본은 채색화이고, 채도를 걷어 세피아를 얹어 판화 쪽으로 민 것은 '
    + '<b>palette.json</b> 의 <code>grade.art*</code> 값 셋이다 — 파일은 건드리지 않았다.</p>'
    + '<div class="enemies">' + enemies.enemies.map(e => enemyEl(e, run)).join("") + '</div>'

    + '<footer>'
    + '읽은 파일: palette.json · ../data/cards.json · ../data/enemies.json · ../data/runs/'
    + esc(run.id) + '.json · ../data/balance.json · scene.json<br>'
    + '검사기 한계값: 지배 ' + balance.dominanceMaxWinRatePct + '% 이하 · 준최적 승률 '
    + balance.greedyWinRatePctMin + '~' + balance.greedyWinRatePctMax + '% · 사장 카드 판정선 '
    + balance.deadCardMinAdoptionPct + '%<br>'
    + '에셋은 전부 CC0 · 퍼블릭 도메인 · OFL — 출처는 ../CREDITS.md'
    + '</footer>';

  root.querySelectorAll(".sfx button").forEach(function (b) {
    b.addEventListener("click", function () { new Audio(b.dataset.sfx).play().catch(function () {}); });
  });
})();
</script>
</body>
</html>
