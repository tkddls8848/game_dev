<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AssetDownloads · 에셋 라이브러리</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{background:#111b23;color:#e0e9ed;font:15px 'Malgun Gothic',sans-serif;margin:0}main{max-width:1440px;margin:auto;padding:35px 24px}h1{font-size:38px;margin:12px 0}p{line-height:1.8;color:#a9bdc8}a{color:#82ccb9}nav{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}.filters{position:sticky;top:0;padding:14px 0;background:#111b23;display:flex;gap:12px;z-index:1}input,select{background:#1c2c38;color:#e0e9ed;border:1px solid #405864;border-radius:5px;padding:12px;font:inherit;min-width:0}input{flex:1}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#1b2a35;border:1px solid #334956;padding:15px;border-radius:8px}.card img{width:100%;height:165px;object-fit:contain;background:#dce3e4;border-radius:4px}.card h2{font-size:19px}.card p{font-size:12px;line-height:1.7}.card a{display:inline-block;margin:4px 9px 4px 0;font-size:13px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:10px;text-align:left;border-bottom:1px solid #31434e;overflow-wrap:anywhere}td:first-child{width:55%}#files{overflow-x:auto;margin-top:20px}#summary{font-size:18px;color:#92d1bd}button{background:#24443f;color:#e0e9ed;border:1px solid #547e72;padding:10px 20px;cursor:pointer}small{color:#82ccb9}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){main{padding:20px 14px}h1{font-size:29px}.filters{flex-wrap:wrap}input{flex-basis:100%}.cards{grid-template-columns:1fr}td,th{padding:7px;font-size:11px}}</style>
<main><small>LOCAL ASSET LIBRARY</small><h1>장면을 만드는 재료들</h1><p>미니폴리·로우폴리 3D, 배경·소품, 시각 효과와 기존 프로젝트 에셋.<br>기존 경로를 보존하고 종류·팩·라이선스 근거·중복 목록으로 정리했습니다.</p><div id="summary"></div><nav><a href="README.md">폴더 안내</a><a href="_catalog/inventory.csv">전체 CSV</a><a href="_catalog/duplicates.json">중복 목록</a><a href="_catalog/collection-run.json">수집 기록</a></nav>
<div class="filters"><input id="query" type="search" placeholder="이름·파일·종류 검색 (mini, forest, character, .fbx…)" aria-label="에셋 검색"><select id="category" aria-label="종류"><option value="">모든 종류</option></select><select id="view" aria-label="보기"><option value="packs">신규 팩 보기</option><option value="files">전체 파일 보기</option></select></div><p id="count" aria-live="polite"></p><section id="packs" class="cards"></section><div id="files" hidden></div><button id="more" hidden>더 보기</button></main>
<script>const DATA=__ASSET_DATA__;const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),href=s=>s.split('/').map(encodeURIComponent).join('/');let limit=100;
$('summary').textContent=`${DATA.summary.verifiedPacks}개 출처 확인 팩 · ${DATA.summary.files.toLocaleString()}개 파일 · ${(DATA.summary.bytes/1073741824).toFixed(2)} GiB`;
for(const c of Object.keys(DATA.summary.categories))$('category').add(new Option(c,c));
function render(){const q=$('query').value.trim().toLowerCase(),cat=$('category').value,mode=$('view').value;const files=DATA.files.filter(f=>(!cat||f.category===cat)&&(!q||(f.path+' '+f.category+' '+f.collection).toLowerCase().includes(q)));const roots=new Set(files.map(f=>f.path.split('/').slice(0,3).join('/')));const packs=DATA.packs.filter(p=>(!q||(p.title+' '+p.slug).toLowerCase().includes(q)||roots.has(p.folder))&&(!cat||roots.has(p.folder)));$('packs').hidden=mode!=='packs';$('files').hidden=mode!=='files';$('more').hidden=mode!=='files'||files.length<=limit;
if(mode==='packs'){$('count').textContent=`${packs.length}개 팩 · ZIP 원본과 압축 해제 파일을 함께 보관`; $('packs').innerHTML=packs.map(p=>`<article class="card">${p.preview?`<img loading="lazy" src="${href(p.folder+'/'+p.preview)}" alt="${esc(p.title)} 미리보기">`:''}<h2>${esc(p.title)}</h2><p>${esc(p.provider)} · ${esc(p.license)}<br>${p.fileCount.toLocaleString()}개 파일 · 모델 형식 파일 ${p.modelFiles.toLocaleString()}개<br>${esc(Object.keys(p.extensions).filter(x=>['.glb','.gltf','.fbx','.obj','.blend','.png','.jpg','.wav','.ogg'].includes(x)).join(' / '))}</p><a href="${href(p.folder+'/'+p.archive)}">원본 ZIP</a><a href="${href(p.folder+'/contents')}/">파일 폴더</a><a href="${esc(p.source)}" target="_blank" rel="noopener">공식 출처</a><a href="${href(p.folder+'/provenance.json')}">라이선스·SHA</a></article>`).join('')||'<p>일치하는 팩이 없습니다. 전체 파일 보기에서도 검색해 보세요.</p>';}
else{$('count').textContent=`${files.length.toLocaleString()}개 중 ${Math.min(limit,files.length).toLocaleString()}개 표시`; $('files').innerHTML='<table><thead><tr><th>파일</th><th>종류</th><th>크기</th><th>라이선스 상태</th></tr></thead><tbody>'+files.slice(0,limit).map(f=>`<tr><td><a href="${href(f.path)}">${esc(f.path)}</a></td><td>${esc(f.category)}</td><td>${(f.bytes/1024).toFixed(1)} KB</td><td>${esc(f.licenseStatus)}</td></tr>`).join('')+'</tbody></table>';}}
for(const id of ['query','category','view'])$(id).addEventListener('input',()=>{limit=100;render();});$('more').onclick=()=>{limit+=200;render();};render();</script></html>
