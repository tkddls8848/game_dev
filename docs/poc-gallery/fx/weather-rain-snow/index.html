<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>비·눈·날씨 — 이펙트 샘플</title>
<style>
:root{--bg:#0d0e10;--panel:#15171a;--panel2:#1b1e22;--line:#2a2e34;--tx:#d9d9d6;--mut:#8b9098;--acc:#e3a857}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.5 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:1fr 372px;grid-template-rows:46px 1fr;width:100vw;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.ttl b{font-size:16px;margin-right:12px;letter-spacing:.02em}.ttl span{color:var(--mut)}
.hdr-r{display:flex;gap:12px;align-items:center;color:var(--mut)}
.keys{font-size:12px}
button{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:3px 9px;font:inherit;font-size:12px;cursor:pointer}
button:hover{border-color:var(--acc)}
#snd.on{color:var(--acc);border-color:#6b5230}
#fps{font:12px ui-monospace,Consolas,monospace;min-width:56px;text-align:right}
#grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;padding:8px;min-height:0;min-width:0}
.cell{position:relative;background:#000;border:1px solid var(--line);border-radius:6px;overflow:hidden;min-height:0;min-width:0;cursor:crosshair}
.cell.sel{border-color:var(--acc);box-shadow:0 0 0 1px #6b5230 inset}
.cell canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.cell .lbl{position:absolute;left:8px;top:7px;pointer-events:none;background:rgba(10,11,13,.62);padding:3px 8px;border-radius:4px;backdrop-filter:blur(2px)}
.cell .lbl b{font-weight:600}.cell .lbl i{font-style:normal;color:var(--acc);margin-left:6px;font-size:12px}
.cell .hint{position:absolute;left:8px;bottom:7px;pointer-events:none;color:#c9c9c4;font-size:12px;background:rgba(10,11,13,.55);padding:2px 7px;border-radius:4px}
.cell .stat{position:absolute;right:8px;top:7px;pointer-events:none;font:12px ui-monospace,Consolas,monospace;color:#e8dcc4;background:rgba(10,11,13,.55);padding:2px 7px;border-radius:4px;white-space:pre}
.cell .num{position:absolute;right:8px;bottom:7px;pointer-events:none;color:var(--mut);font-size:11px}
aside{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:4px 14px 14px}
aside section{border-bottom:1px solid var(--line);padding:9px 0}
aside h3{margin:0;font-size:15px}aside h4{margin:0 0 6px;font-size:12px;color:var(--mut);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.con{color:var(--acc);font-size:12px}.hint2{color:var(--mut);font-size:12px;margin-top:3px}
.prm{display:grid;grid-template-columns:104px 1fr 54px;gap:6px;align-items:center;margin:3px 0}
.prm label{font-size:12px;color:#c4c6c9}.prm input[type=range]{width:100%;accent-color:var(--acc)}
.prm output{font:12px ui-monospace,Consolas,monospace;text-align:right;color:#f0d9b0}
.prm select{background:var(--panel2);color:var(--tx);border:1px solid var(--line);font:inherit;font-size:12px;grid-column:2/4}
pre{margin:0;font:11px/1.45 ui-monospace,Consolas,monospace;color:#b9d4b0;background:#101214;border:1px solid var(--line);border-radius:4px;padding:6px 8px;white-space:pre-wrap;max-height:120px;overflow:auto}
.memo{font-size:12px;color:#c3c5c8;border-bottom:0}
.memo p{margin:0 0 6px}.memo b{color:#e9d7b8}.memo code{font:11px ui-monospace,Consolas,monospace;color:#b9d4b0}
.memo ul{margin:0 0 6px;padding-left:16px}.memo li{margin:1px 0}

</style>
</head>
<body>
<div id="app">
  <header>
    <div class="ttl"><b>비·눈·날씨</b><span>유리창 빗방울 흐름, 쌓이는 눈, 번개 섬광, 우산 위 빗소리</span></div>
    <div class="hdr-r">
      <span class="keys">1–4 변형 선택 · Space 발동 · R 초기화 · M 소리 · S 성능 모드</span>
      <button id="solo" title="S">전체 재생</button>
      <button id="snd" title="M">소리: 꺼짐 (클릭하면 켜짐)</button>
      <span id="fps">-- fps</span>
    </div>
  </header>
  <main id="grid"></main>
  <aside id="side">
    <section><h3 id="vname">-</h3><div id="vcon" class="con"></div><div id="vhint" class="hint2"></div></section>
    <section><h4>파라미터</h4><div id="params"></div></section>
    <section><h4>게임 이식용 값 <button id="copy">복사</button></h4><pre id="json"></pre></section>
    <section class="memo"><h4>구현 메모</h4><div id="memo"></div></section>
  </aside>
</div>
<script>
'use strict';
/* ===== 공용: 난수·노이즈·수학 ===== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const TAU=Math.PI*2;
function makeNoise(seed){
  const r=mulberry32(seed),p=new Uint8Array(512),g=new Float32Array(256);
  for(let i=0;i<256;i++){p[i]=i;g[i]=r()}
  for(let i=255;i>0;i--){const j=(r()*(i+1))|0,k=p[i];p[i]=p[j];p[j]=k}
  for(let i=0;i<256;i++)p[i+256]=p[i];
  function n2(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,X=xi&255,Y=yi&255;
    const a=g[p[p[X]+Y]],b=g[p[p[X+1]+Y]],c=g[p[p[X]+Y+1]],d=g[p[p[X+1]+Y+1]];
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
  n2.fbm=(x,y,o=4)=>{let s=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){s+=a*n2(x*f+i*17.3,y*f-i*9.1);n+=a;f*=2.03;a*=.5}return s/n};
  /* 컬 노이즈: 스칼라장 psi의 회전 → 발산 없는 흐름(연기가 뭉치지 않고 말려 올라감) */
  n2.curl=(x,y,o=2)=>{const e=.35,a=n2.fbm(x,y+e,o),b=n2.fbm(x,y-e,o),c=n2.fbm(x+e,y,o),d=n2.fbm(x-e,y,o);return[(a-b)/(2*e),-(c-d)/(2*e)]};
  return n2;
}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return[c,c.getContext('2d')]}
function hexRgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
/* 부드러운 연기 퍼프 스프라이트: 방사 감쇠 × fbm, 위쪽이 밝게 (위에서 오는 빛) */
function puffSprite(size,seed,rgb,opt={}){
  const [c,x]=mk(size,size),img=x.createImageData(size,size),n=makeNoise(seed),d=img.data;
  const lit=opt.lit??.35, dens=opt.dens??1, freq=opt.freq??3.2, rim=opt.rim??0, lx=opt.lx??-.2, ly=opt.ly??-.9, sh0=opt.shadow;
  for(let j=0;j<size;j++)for(let i=0;i<size;i++){
    const dx=(i/size)*2-1,dy=(j/size)*2-1,r=Math.hypot(dx,dy);
    const nn=n.fbm(i/size*freq,j/size*freq,5);
    const edge=1-sstep(.35+.3*nn,1,r+.25*(nn-.5));
    let a=clamp(edge*(.55+1.1*(nn-.35))*dens,0,1);
    const sh=clamp(1+lit*(dy*ly+dx*lx)+(nn-.5)*.5+rim*sstep(.5,.95,r),.2,1.6);
    const k=(j*size+i)*4;
    if(sh0){const q=clamp(sh-.35,0,1.25);d[k]=clamp(sh0[0]+(rgb[0]-sh0[0])*q,0,255);d[k+1]=clamp(sh0[1]+(rgb[1]-sh0[1])*q,0,255);d[k+2]=clamp(sh0[2]+(rgb[2]-sh0[2])*q,0,255)}
    else{d[k]=clamp(rgb[0]*sh,0,255);d[k+1]=clamp(rgb[1]*sh,0,255);d[k+2]=clamp(rgb[2]*sh,0,255)}
    d[k+3]=a*255;
  }
  x.putImageData(img,0,0);return c;
}
/* 가산 광원 스프라이트 */
function glowSprite(size,rgb,falloff=2){const[c,x]=mk(size,size),g=x.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  for(let i=0;i<=8;i++){const t=i/8,a=Math.pow(1-t,falloff);g.addColorStop(t,`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`)}
  x.fillStyle=g;x.fillRect(0,0,size,size);return c}

/* ===== 공용: 연기/불 입자계 ===== */
/* ---------- 연기 입자계  ---------- */
class Smoke{
  constructor(max,seed){this.p=[];this.max=max;this.ri=0;this.n=makeNoise(seed)}
  emit(o){o.age=0;o.rot=o.rot??0;o.vr=o.vr??0;if(this.p.length<this.max)this.p.push(o);else{this.p[this.ri]=o;this.ri=(this.ri+1)%this.max}}
  /* wind(x,y)->[vx,vy] 목표 속도, turb: 컬 노이즈 세기(px/s), nscale: 노이즈 격자(px), follow: 속도 추종률(1/s) */
  update(dt,t,wind,turb,nscale,follow=1.4){
    const n=this.n,k=Math.min(1,dt*follow);
    for(let i=this.p.length-1;i>=0;i--){const q=this.p[i];q.age+=dt;
      if(q.age>=q.life){this.p[i]=this.p[this.p.length-1];this.p.pop();if(this.ri>=this.p.length)this.ri=0;continue}
      const w=wind(q.x,q.y,q),c=n.curl(q.x/nscale,q.y/nscale-t*.08,2),up=(q.buoy||0)*Math.exp(-q.age*(q.cool||.4));
      const tb=turb*(q.tm??1)*Math.min(1,q.age*.8+.15);
      q.vx+=(w[0]+c[0]*tb-q.vx)*k;q.vy+=(w[1]-up+c[1]*tb-q.vy)*k;
      q.x+=q.vx*dt;q.y+=q.vy*dt;q.rot+=q.vr*dt;}
  }
  draw(g,sortOld){
    const L=this.p;
    for(let i=0;i<L.length;i++){const q=L[i],u=q.age/q.life;
      const a=q.a*sstep(0,q.fin||.08,u)*(1-sstep(q.fout||.45,1,u));if(a<.004)continue;
      const e=1-(1-u)*(1-u),s=q.s0+(q.s1-q.s0)*(q.grow?Math.pow(u,q.grow):e),c=Math.cos(q.rot)*s,sn=Math.sin(q.rot)*s;
      g.globalAlpha=a;g.setTransform(c*(q.sx||1),sn*(q.sx||1),-sn,c,q.x,q.y);g.drawImage(q.spr,-.5,-.5,1,1)}
    g.setTransform(1,0,0,1,0,0);g.globalAlpha=1}
}
function ridge(g,w,h,base,amp,freq,seed,fill,oct=5){const n=makeNoise(seed);g.beginPath();g.moveTo(0,h);
  for(let x=0;x<=w;x+=3){const y=base-amp*(n.fbm(x*freq,seed*.1,oct)-.3)*1.8;g.lineTo(x,y)}g.lineTo(w,h);g.closePath();g.fillStyle=fill;g.fill()}
function ridgeY(n,x,base,amp,freq,seed,oct=5){return base-amp*(n.fbm(x*freq,seed*.1,oct)-.3)*1.8}


/* ===== 공용: 사운드 (WebAudio 합성, 첫 입력 후에만) ===== */
const AU={ctx:null,on:false,muted:false,r:mulberry32(4242),
  init(){
    if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return true}
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;
    const c=this.ctx=new C();
    const comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=10;comp.ratio.value=4;comp.attack.value=.004;comp.release.value=.25;
    this.bus=c.createGain();this.bus.gain.value=.85;this.bus.connect(comp);comp.connect(c.destination);
    this.nb={};for(const t of['white','pink','brown'])this.nb[t]=this.noise(t,4);
    this.rev=this.verb(2.8,2.6,11,.82);   // 넓은 공간(산·밤하늘)
    this.room=this.verb(.7,3.2,13,.55);   // 방·책상
    this.on=true;this.setMuted(false);return true;
  },
  setMuted(m){this.muted=m;if(this.bus)this.bus.gain.setTargetAtTime(m?0:.85,this.ctx.currentTime,.03)},
  noise(type,sec){const c=this.ctx,n=c.sampleRate*sec|0,b=c.createBuffer(2,n,c.sampleRate),r=mulberry32(type.length*977);
    for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,br=0;
      for(let i=0;i<n;i++){const w=r()*2-1;
        if(type==='white')d[i]=w*.5;
        else if(type==='pink'){b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926}
        else{br=(br+.02*w)/1.02;d[i]=br*3.2}}}
    return b},
  /* 생성형 잔향: 필터링된 노이즈 × 지수 감쇠 (시드 고정) */
  verb(sec,decay,seed,damp){const c=this.ctx,n=c.sampleRate*sec|0,b=c.createBuffer(2,n,c.sampleRate),r=mulberry32(seed);
    for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let lp=0;for(let i=0;i<n;i++){const t=i/n;lp+=((r()*2-1)-lp)*(1-damp*t);
      d[i]=lp*Math.pow(1-t,decay)*Math.min(1,i/(c.sampleRate*.006))}}
    const cv=c.createConvolver();cv.buffer=b;const g=c.createGain();g.connect(cv);cv.connect(this.bus);return g},
  /* src → filters → env → pan → bus (+ 잔향 send) */
  route(src,o){const c=this.ctx;let node=src;
    for(const f of(o.filters||[])){const bf=c.createBiquadFilter();bf.type=f.t;bf.frequency.value=f.f;if(f.q!=null)bf.Q.value=f.q;if(f.g!=null)bf.gain.value=f.g;
      if(f.f2!=null)bf.frequency.exponentialRampToValueAtTime(Math.max(20,f.f2),o.t0+(f.ft??(o.a+o.d)));node.connect(bf);node=bf}
    const env=c.createGain();env.gain.value=0;node.connect(env);
    const p=c.createStereoPanner?c.createStereoPanner():null;let out=env;if(p){p.pan.value=clamp(o.pan||0,-1,1);env.connect(p);out=p}
    out.connect(this.bus);if(o.rev){const s=c.createGain();s.gain.value=o.rev;out.connect(s);s.connect(o.bus==='room'?this.room:this.rev)}
    return env},
  env(g,t0,a,hold,d,peak){g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(peak,t0+a);if(hold)g.gain.setValueAtTime(peak,t0+a+hold);g.gain.exponentialRampToValueAtTime(.0001,t0+a+hold+d);g.gain.linearRampToValueAtTime(0,t0+a+hold+d+.02)},
  /* 노이즈 한 방 */
  burst(o){if(!this.on)return;const c=this.ctx,t0=c.currentTime+(o.t||0),a=o.a??.005,d=o.d??.2,h=o.hold||0;
    const s=c.createBufferSource();s.buffer=this.nb[o.type||'white'];s.loop=true;s.playbackRate.value=o.rate||1;
    const env=this.route(s,{...o,t0,a,d});this.env(env,t0,a,h,d,o.g??.4);
    s.start(t0,(o.off??AU.r()*3));s.stop(t0+a+h+d+.05)},
  /* 음정 한 방 (주파수 스윕 가능) */
  tone(o){if(!this.on)return;const c=this.ctx,t0=c.currentTime+(o.t||0),a=o.a??.005,d=o.d??.3,h=o.hold||0;
    const s=c.createOscillator();s.type=o.w||'sine';s.frequency.setValueAtTime(o.f,t0);if(o.f2)s.frequency.exponentialRampToValueAtTime(o.f2,t0+(o.ft??(a+d)));if(o.det)s.detune.value=o.det;
    const env=this.route(s,{...o,t0,a,d});this.env(env,t0,a,h,d,o.g??.3);s.start(t0);s.stop(t0+a+h+d+.05)},
  /* 지속음(바닥 소리): 노이즈 루프 + 필터, 이후 set으로 조절 */
  bed(o){if(!this.on)return null;const c=this.ctx,s=c.createBufferSource();s.buffer=this.nb[o.type||'pink'];s.loop=true;
    const f=c.createBiquadFilter();f.type=o.ft||'lowpass';f.frequency.value=o.f||800;f.Q.value=o.q??.7;s.connect(f);
    const g=c.createGain();g.gain.value=0;f.connect(g);g.connect(this.bus);
    if(o.rev){const sg=c.createGain();sg.gain.value=o.rev;g.connect(sg);sg.connect(o.bus==='room'?this.room:this.rev)}
    s.start(0,AU.r()*3);g.gain.setTargetAtTime(o.g??.2,c.currentTime,o.fade??.3);
    return{s,f,g,set(gain,freq,tc=.15){const t=c.currentTime;if(gain!=null)g.gain.setTargetAtTime(gain,t,tc);if(freq!=null)f.frequency.setTargetAtTime(freq,t,tc)},
      stop(tc=.25){const t=c.currentTime;g.gain.setTargetAtTime(0,t,tc);s.stop(t+tc*8)}}},
};

/* ===== 공용: 변형 틀 ===== */
const FX={vs:[],sel:0,solo:/[?&]solo/.test(location.search),ts:1,clock:0};
function variant(v){v.P={};for(const p of v.params)v.P[p.k]=p.v;FX.vs.push(v);return v}
function boot(){
  const grid=document.getElementById('grid');
  FX.vs.forEach((v,i)=>{
    const cell=document.createElement('div');cell.className='cell';cell.innerHTML=`<canvas></canvas><div class="lbl"><b>${i+1}. ${v.name}</b><i>${v.concept}</i></div><div class="hint">${v.hint}</div><div class="stat" style="display:none"></div>`;
    grid.appendChild(cell);v.cell=cell;v.cv=cell.querySelector('canvas');v.statEl=cell.querySelector('.stat');
  });
  requestAnimationFrame(()=>{
    FX.vs.forEach((v,i)=>{const w=v.cell.clientWidth,h=v.cell.clientHeight;v.cv.width=v.w=w;v.cv.height=v.h=h;v.init(v.cv,w,h);bindPtr(v,i)});
    select(0);requestAnimationFrame(loop);
  });
  const snd=document.getElementById('snd');
  const upd=()=>{snd.textContent=!AU.on?'소리: 꺼짐 (클릭하면 켜짐)':AU.muted?'소리: 음소거':'소리: 켜짐';snd.classList.toggle('on',AU.on&&!AU.muted)};FX.updSnd=upd;
  snd.onclick=()=>{if(!AU.on){if(AU.init())FX.vs[FX.sel].ambient?.(true)}else AU.setMuted(!AU.muted);upd()};
  document.getElementById('solo').textContent=FX.solo?'선택만 재생':'전체 재생';document.getElementById('solo').onclick=()=>dispatchEvent(new KeyboardEvent('keydown',{key:'s'}));
  document.getElementById('copy').onclick=()=>{navigator.clipboard?.writeText(document.getElementById('json').textContent)};
  addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
    const n=parseInt(e.key);if(n>=1&&n<=FX.vs.length){select(n-1);return}
    const v=FX.vs[FX.sel];
    if(e.code==='Space'){e.preventDefault();wake();(v.trigger||defTrigger).call(v)}
    else if(e.key==='r'||e.key==='R')v.reset?.();
    else if(e.key==='m'||e.key==='M')snd.onclick();
    else if(e.key==='s'||e.key==='S'){FX.solo=!FX.solo;document.getElementById('solo').textContent=FX.solo?'선택만 재생':'전체 재생'}
    else v.key?.(e);
  });
  addEventListener('resize',()=>FX.vs.forEach(v=>{const w=v.cell.clientWidth,h=v.cell.clientHeight;if(w!==v.w||h!==v.h){v.cv.width=v.w=w;v.cv.height=v.h=h;v.resize?v.resize(w,h):v.init(v.cv,w,h)}}));
}

  memo:`<p><b>기법</b> CPU가 물방울을 <b>법선맵</b>(R,G=법선 x,y · A=마스크)으로 오프스크린에 그리고, 셰이더가 그 법선으로 선명한 배경을 <b>뒤집어</b> 샘플(렌즈는 상을 뒤집는다) + 가장자리 어둡게 + 반사광. 방울 밖은 흐린 배경 + 김. 큰 방울이 임계 반경을 넘으면 <b>불규칙하게 멈칫거리며</b> 미끄러지고, 지나간 길의 잔방울·김을 지우며 뒤에 작은 방울을 남긴다.</p>

      segs.push({pts,wd});if(depth<2)for(let i=4;i<pts.length-4;i+=3)if(r()<P.branch*(depth?.5:1)){const a=pts[i],ang=Math.atan2(by-ay,bx-ax)+(r()-.5)*1.4,len=Math.hypot(bx-ax,by-ay)*(.15+r()*.25);
        mk2(a[0],a[1],a[0]+Math.cos(ang)*len,a[1]+Math.sin(ang)*len,depth+1,wd*.5)}};
    mk2(x0,y0,x1,y1,0,1);return segs},
  flashAt(a){if(a<0)return 0;const K=[[0,1],[.06,.15],[.11,.85],[.19,.1],[.26,.5],[.34,.25]];if(a>=.34)return .25*Math.exp(-(a-.34)*5);
    for(let i=1;i<K.length;i++)if(a<K[i][0]){const u=(a-K[i-1][0])/(K[i][0]-K[i-1][0]);return lerp(K[i-1][1],K[i][1],u)}return 0},
  down(x,y){const t=this.t||0,r=this.r;this.seed++;this.bolts=[{segs:this.bolt(x+(r()-.5)*120,-10,x,y,this.seed),t0:t}];this.flashT=t;
    const P=this.P,delay=P.dist/343,pan=(x/this.w)*2-1,near=clamp(1-P.dist/1500,0,1),far=clamp(700/P.dist,.25,1.2);
    if(P.dist<250)AU.burst({type:'white',filters:[{t:'highpass',f:2500}],a:.001,d:.3,g:.18,pan});
    if(near>0){AU.burst({type:'white',t:delay,filters:[{t:'highpass',f:600},{t:'lowpass',f:9000,f2:1500,ft:.4}],a:.002,d:.45,g:.6*near,pan,rev:.3});AU.burst({type:'brown',t:delay,filters:[{t:'lowpass',f:120}],a:.01,d:1.4,g:.9*near,pan})}
    for(let i=0;i<7;i++)AU.burst({type:'brown',t:delay+.08+i*(.25+r()*.35)+(1-near)*.3,filters:[{t:'lowpass',f:90+r()*160}],a:.15+r()*.3,d:.8+r()*1.2,g:(.35+r()*.4)*far,pan:pan*.5+(r()-.5)*.8,rev:.4});
    this.pend.push(t+delay)},
  up(){},
  frame(dt,t){this.t=t;const g=this.g,P=this.P,w=this.w,h=this.h,r=this.r;
    const a=t-this.flashT,f=clamp(this.flashAt(a)*P.bright,0,1.4);
    this.pend=this.pend.filter(tt=>{if(t>=tt){this.vend=0;this.buzz();return false}return true});this.vend=Math.min(1,this.vend+dt*(this.vend<.2?.8:3));
    g.drawImage(this.dark,0,0);if(f>0){g.globalAlpha=clamp(f,0,1);g.drawImage(this.lit,0,0);g.globalAlpha=1}
    /* 자판기 불빛 */
    const[mx,my,mw,mh]=this.vm,vl=this.vend*(this.vend<1?(r()<.5?.3:1):1)*(1-f*.5);
    g.globalCompositeOperation='lighter';const vg=g.createRadialGradient(mx+mw/2,my+mh*.3,10,mx+mw/2,my+mh*.5,mw*2.2);vg.addColorStop(0,`rgba(180,220,255,${.55*vl})`);vg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=vg;g.fillRect(0,0,w,h);
    g.fillStyle=`rgba(200,230,255,${.35*vl})`;g.fillRect(mx+8,my+10,mw-16,mh*.55);
    g.fillStyle=`rgba(150,200,255,${.12*vl})`;g.beginPath();g.moveTo(mx,my+mh);g.lineTo(mx+mw,my+mh);g.lineTo(mx+mw*2.2,h);g.lineTo(mx-mw*.6,h);g.fill();
    /* 번개 */
    for(const B of this.bolts){const ba=t-B.t0;const al=ba<.34?Math.max(.15,this.flashAt(ba)):Math.max(0,.3-(ba-.34)*1.2);if(al<=0)continue;
      for(const[lw,col,aa]of[[10,'120,150,255',.18],[4,'180,200,255',.5],[1.6,'255,255,255',1]])for(const s of B.segs){g.strokeStyle=`rgba(${col},${aa*al})`;g.lineWidth=lw*s.wd;g.beginPath();s.pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke()}}
    g.globalCompositeOperation='source-over';
    /* 비 */
    g.strokeStyle=`rgba(${f>.1?'230,235,255':'150,170,200'},${.25+f*.4})`;g.lineWidth=1;g.beginPath();
    for(let i=0;i<P.rain;i++){const d=this.rain[i];d.y+=d.v*dt;d.x+=d.v*dt*.08;if(d.y>h){d.y=-d.l;d.x=r()*w}if(d.x>w)d.x-=w;g.moveTo(d.x,d.y);g.lineTo(d.x-d.l*.08,d.y-d.l)}g.stroke();
    if(f>.02){g.fillStyle=`rgba(210,220,255,${f*.12})`;g.fillRect(0,0,w,h)}
    this._f=f},
  buzz(){if(!AU.on)return;AU.tone({w:'sawtooth',f:100,d:.5,g:.05,filters:[{t:'bandpass',f:800,q:2}],bus:'room'});AU.tone({w:'square',f:50,t:.5,a:.05,d:.3,g:.02,filters:[{t:'lowpass',f:300}]})},
  stat(){const d=this.P.dist;return `섬광→천둥 ${(d/343).toFixed(2)}s · ${d}m`},
  ambient(on){if(on){this.b1=AU.bed({type:'pink',ft:'highpass',f:700,g:.07,rev:.2});this.b2=AU.bed({type:'brown',f:250,g:.06});this.hm=AU.bed({type:'white',ft:'bandpass',f:120,q:8,g:.01})}else{[this.b1,this.b2,this.hm].forEach(b=>b?.stop());this.b1=this.b2=this.hm=null}},
  trigger(){this.down(this.w*.5,this.h*.35)},
  extraJson(){return{flashKeysMs:[[0,100],[60,15],[110,85],[190,10],[260,50],[340,25]],thunderDelayMs:Math.round(this.P.dist*1000/343)}}
});

window.MEMO_COMMON=`<p style="margin-top:8px;color:#8b9098"><b>공통</b> 날씨는 "보이는 밀도 = 들리는 밀도"가 원칙: 빗줄기 수와 빗소리 음량, 우산 충돌 수와 타닥 수, 눈 덩어리 착지 수와 쿵 소리를 같은 변수에서 뽑는다. 소리: 빗소리=핑크노이즈 고역통과 + 브라운 저역, 유리 톡=420/1310/2710Hz 비조화, 손가락 끽=Q7 대역 노이즈 음량을 속도로, 천둥=브라운 저역 7겹 무작위 시각.</p>`;
