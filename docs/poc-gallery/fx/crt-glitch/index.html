<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX</title>
<!-- 자체 완결 효과 샘플: 네트워크·외부 파일 없음. file:// 로 바로 연다. 공통 틀(common)은 fx 샘플들이 같은 코드를 인라인으로 공유한다. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#0a0b0d;overflow:hidden;color:#d6d5d0;font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#app{position:absolute;left:50%;top:50%;width:1600px;height:1000px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:50% 50%}
header{position:absolute;left:16px;right:16px;top:10px;height:46px;display:flex;align-items:center;gap:14px;white-space:nowrap}
header h1{font-size:21px;font-weight:700;letter-spacing:-.02em;color:#ecebe6}
header .slug{font:12px ui-monospace,Menlo,Consolas,monospace;color:#6f727a;padding-top:4px}
header .desc{font-size:13px;color:#8f929a;padding-top:3px;overflow:hidden;text-overflow:ellipsis}
header .meta{margin-left:auto;display:flex;gap:8px;font:12px ui-monospace,Menlo,Consolas,monospace}
.pill{padding:5px 9px;border:1px solid #262930;border-radius:4px;background:#111317;color:#a8abb2}
.pill.snd{cursor:pointer}
.pill.snd.on{color:#e6cf8a;border-color:#5a4c28}
#tabs{position:absolute;left:16px;top:62px;width:1150px;height:44px;display:flex;gap:6px}
#tabs button{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 12px;text-align:left;border-radius:5px;border:1px solid #23262c;background:#111317;color:#a4a7ae;cursor:pointer;font-family:inherit}
#tabs button b{font-size:13px;font-weight:700;color:#cfd0d3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tabs button span{font-size:11px;color:#7b7e86;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tabs button.on{background:#1b1a15;border-color:#8a7336;box-shadow:inset 0 -2px 0 #d4b35a}
#tabs button.on b{color:#f1dd9f}
#tabs button .k{font:10px ui-monospace,monospace;color:#5d6068;margin-right:6px}
#stageWrap{position:absolute;left:16px;top:112px;width:1150px;height:872px;border-radius:6px;overflow:hidden;background:#000;box-shadow:0 0 0 1px #202329,0 10px 40px rgba(0,0,0,.5);cursor:crosshair;touch-action:none}
#stageWrap canvas{position:absolute;left:0;top:0;width:1150px;height:872px}
#hint{position:absolute;left:12px;bottom:12px;z-index:5;pointer-events:none;font-size:12px;color:#e8e6df;background:rgba(0,0,0,.52);border:1px solid rgba(255,255,255,.12);padding:6px 10px;border-radius:4px;backdrop-filter:blur(2px)}
#hint kbd{font:11px ui-monospace,monospace;padding:1px 5px;border:1px solid rgba(255,255,255,.3);border-radius:3px;margin:0 2px}
#unlock{position:absolute;right:12px;bottom:12px;z-index:5;pointer-events:none;font-size:11px;color:#f0d98f;background:rgba(0,0,0,.55);padding:5px 9px;border-radius:4px;border:1px solid rgba(240,217,143,.3)}
#side{position:absolute;left:1182px;top:62px;width:402px;height:922px;display:flex;flex-direction:column;gap:8px}
.card{background:#111317;border:1px solid #22252b;border-radius:6px;padding:10px 13px}
.card h2{font-size:12px;font-weight:700;color:#e0c77e;letter-spacing:.02em;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.card h2 .r{margin-left:auto;display:flex;gap:6px}
.card h2 button{font:600 11px/1 inherit;font-family:inherit;padding:4px 7px;border-radius:3px;border:1px solid #33363d;background:#181a1f;color:#b9bbc1;cursor:pointer}
.card h2 button:hover{border-color:#8a7336;color:#f1dd9f}
.row{display:grid;grid-template-columns:104px 1fr 58px;align-items:center;gap:8px;height:24px;font-size:12px;color:#b8bac0}
.row input[type=range]{width:100%;accent-color:#c9a85a;height:14px}
.row .val{font:12px ui-monospace,Menlo,Consolas,monospace;text-align:right;color:#efdca3}
#json{font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#9ec59a;white-space:pre-wrap;word-break:break-all;overflow:hidden;background:#0b0c0f;border:1px solid #1d2025;border-radius:4px;padding:7px 9px;max-height:128px}
#memo{flex:1;min-height:0;overflow:auto;font-size:12px;line-height:1.55;color:#aeb0b6}
#memo h3{font-size:12px;color:#e0c77e;margin:8px 0 2px}
#memo h3:first-child{margin-top:0}
#memo code{font:11px ui-monospace,Menlo,Consolas,monospace;color:#d9c89a;background:#1a1b1f;padding:0 3px;border-radius:2px}
#memo ul{padding-left:16px}
#memo li{margin:1px 0}
#memo::-webkit-scrollbar{width:6px}#memo::-webkit-scrollbar-thumb{background:#2a2d33;border-radius:3px}


</style>
</head>
<body>
<div id="app">
  <header><h1></h1><span class="slug"></span><span class="desc"></span>
    <div class="meta"><span class="pill" id="fps">-- fps</span><span class="pill snd" id="snd">소리</span></div></header>
  <nav id="tabs"></nav>
  <div id="stageWrap">
    <canvas id="gl" width="1150" height="872"></canvas>
    <canvas id="ov" width="1150" height="872"></canvas>

    <div id="hint"></div><div id="unlock">클릭하면 소리가 켜진다</div>
  </div>
  <aside id="side">
    <div class="card"><h2>파라미터<span class="r"><button id="reset">초기화</button><button id="copy">복사</button></span></h2><div id="params"></div></div>
    <div class="card"><h2>게임으로 옮길 값</h2><div id="json"></div></div>
    <div class="card" style="flex:1;min-height:0;display:flex;flex-direction:column"><h2>구현 메모</h2><div id="memo"></div></div>
  </aside>
</div>
<script>
'use strict';
/* ---------- 공통 틀 (각 fx 페이지에 그대로 인라인) ---------- */
const W = 1150, H = 872;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t, smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

/* ---------- 오디오: 첫 입력 후에만 생성 ---------- */
const AU = {
  ctx:null, on:true,
  init(){
    if(this.ctx){ if(this.ctx.state!=='running') this.ctx.resume(); return !!this.ctx; }
    const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return false;
    const c = this.ctx = new AC();
    this.comp = c.createDynamicsCompressor();
    this.comp.threshold.value=-16; this.comp.knee.value=10; this.comp.ratio.value=4; this.comp.attack.value=.003; this.comp.release.value=.18;
    this.master = c.createGain(); this.master.gain.value = this.on ? .85 : 0;
    this.master.connect(this.comp); this.comp.connect(c.destination);
    this.verb = c.createConvolver(); this.verbOut = c.createGain(); this.verbOut.gain.value=1;
    this.verb.connect(this.verbOut); this.verbOut.connect(this.master);
    const r = mulberry32(99), n = c.sampleRate*2, b = c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=r()*2-1;
    this.nbuf = b;
    this.setRoom(this._room||[1.8,3,.5]);
    if(this.onInit) this.onInit();
    return true;
  },
  /* 생성 임펄스 리버브: 길이(초), 감쇠 지수, 밝기(0..1, 꼬리가 어두워지는 정도) */
  setRoom(sec,decay,bright){
    if(Array.isArray(sec)) [sec,decay,bright]=sec;
    this._room=[sec,decay,bright]; if(!this.ctx) return;
    const c=this.ctx, n=Math.floor(c.sampleRate*sec), b=c.createBuffer(2,n,c.sampleRate), r=mulberry32(7);
    for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch); let lp=0;
      for(let i=0;i<n;i++){const t=i/n, k=lerp(bright,.04,t); lp+= (r()*2-1-lp)*k; d[i]=lp*Math.pow(1-t,decay)*(i<c.sampleRate*.004?i/(c.sampleRate*.004):1);} }
    this.verb.buffer=b;
  },
  get t(){return this.ctx?this.ctx.currentTime:0;},
  noise(rate){const s=this.ctx.createBufferSource(); s.buffer=this.nbuf; s.loop=true; if(rate) s.playbackRate.value=rate; return s;},
  /* 노드 → 팬 → 마스터 (+리버브 센드) */
  out(node,pan=0,wet=.25){const c=this.ctx,p=c.createStereoPanner(); p.pan.value=clamp(pan,-1,1); node.connect(p); p.connect(this.master);
    if(wet>0){const g=c.createGain(); g.gain.value=wet; p.connect(g); g.connect(this.verb);} return p;},
  /* AD 엔벨로프 게인 */
  envGain(t,a,peak,d,curve=4){const g=this.ctx.createGain(); g.gain.value=0; g.gain.setValueAtTime(0,t); /* 미래 시작이면 그 전엔 기본값 1이 샌다 → 먼저 0 */ g.gain.linearRampToValueAtTime(peak,t+a);
    g.gain.setTargetAtTime(0,t+a,d/curve); return g;},
  tone(type,f,t){const o=this.ctx.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,t); return o;},
  filt(type,f,q=1){const b=this.ctx.createBiquadFilter(); b.type=type; b.frequency.value=f; b.Q.value=q; return b;},
  setOn(v){this.on=v; if(this.master) this.master.gain.setTargetAtTime(v?.85:0,this.t,.03);}
};

/* ---------- UI 틀 ---------- */
const UI = {vi:0, P:null, store:[], fps:60, ms:0, pointerDown:false};
function boot(FX){
  const app=document.getElementById('app');
  const fit=()=>{app.style.setProperty('--s',Math.min(innerWidth/1600,innerHeight/1000));};
  addEventListener('resize',fit); fit();
  document.title = FX.title+' · FX';
  document.querySelector('header h1').textContent = 'FX · '+FX.title;
  document.querySelector('header .slug').textContent = FX.slug;
  document.querySelector('header .desc').textContent = FX.desc;
  const tabs=document.getElementById('tabs');
  FX.variants.forEach((v,i)=>{
    UI.store[i]=Object.fromEntries(v.params.map(p=>[p[0],p[5]]));
    const b=document.createElement('button');
    b.innerHTML='<b><span class="k">'+(i+1)+'</span>'+v.concept+'</b><span>'+v.sub+'</span>';
    b.onclick=()=>{location.hash='v='+i;};
    tabs.appendChild(b);
  });
  const sndBtn=document.getElementById('snd');
  const updSnd=()=>{sndBtn.textContent = !AU.ctx ? '소리: 입력 대기' : (AU.on?'소리: 켬':'소리: 끔'); sndBtn.classList.toggle('on',!!AU.ctx&&AU.on);
    document.getElementById('unlock').style.display = AU.ctx?'none':'block';};
  sndBtn.onclick=(e)=>{e.stopPropagation(); if(!AU.ctx){AU.init();} else AU.setOn(!AU.on); updSnd();};
  const unlock=()=>{ if(AU.init()) updSnd(); };
  addEventListener('pointerdown',unlock,true); addEventListener('keydown',unlock,true);

  function select(i){
    i=clamp(i|0,0,FX.variants.length-1); UI.vi=i; UI.P=UI.store[i];
    [...tabs.children].forEach((b,j)=>b.classList.toggle('on',j===i));
    const v=FX.variants[i];
    document.getElementById('hint').innerHTML=v.hint;
    document.getElementById('memo').innerHTML=v.memo;
    buildPanel(v);
    if(FX.select) FX.select(i,v,UI.P);
  }
  function buildPanel(v){
    const box=document.getElementById('params'); box.innerHTML='';
    v.params.forEach(p=>{
      const [k,label,mn,mx,st]=p;
      const row=document.createElement('div'); row.className='row';
      row.innerHTML='<label>'+label+'</label><input type=range min='+mn+' max='+mx+' step='+st+'><span class=val></span>';
      const inp=row.querySelector('input'), val=row.querySelector('.val');
      const dec = (String(st).split('.')[1]||'').length;
      const show=()=>{val.textContent=(+UI.P[k]).toFixed(dec); };
      inp.value=UI.P[k]; show();
      inp.oninput=()=>{UI.P[k]=+inp.value; show(); showJson(); if(FX.param) FX.param(k,UI.P[k],UI.P);};
      box.appendChild(row);
    });
    showJson();
  }
  function showJson(){
    const v=FX.variants[UI.vi];
    document.getElementById('json').textContent = '// '+v.concept+'\n'+JSON.stringify(UI.P,null,0).replace(/,"/g,', "').replace(/^\{/,'{ ').replace(/\}$/,' }');
  }
  document.getElementById('copy').onclick=(e)=>{e.stopPropagation(); const t=JSON.stringify(UI.P); try{navigator.clipboard.writeText(t);}catch(_){} e.target.textContent='복사됨'; setTimeout(()=>e.target.textContent='복사',900);};
  document.getElementById('reset').onclick=(e)=>{e.stopPropagation(); const v=FX.variants[UI.vi]; UI.store[UI.vi]=Object.fromEntries(v.params.map(p=>[p[0],p[5]])); select(UI.vi);};
  const fromHash=()=>{const m=/v=(\d)/.exec(location.hash); select(m?+m[1]:0);};
  addEventListener('hashchange',fromHash);

  /* 포인터: 스테이지 좌표로 환산 */
  const wrap=document.getElementById('stageWrap');
  const pos=e=>{const r=wrap.getBoundingClientRect(); return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];};
  wrap.addEventListener('pointerdown',e=>{UI.pointerDown=true; wrap.setPointerCapture(e.pointerId); const [x,y]=pos(e); FX.down&&FX.down(x,y,e);});
  wrap.addEventListener('pointermove',e=>{const [x,y]=pos(e); FX.move&&FX.move(x,y,e,UI.pointerDown);});
  const up=e=>{if(!UI.pointerDown)return; UI.pointerDown=false; const [x,y]=pos(e); FX.up&&FX.up(x,y,e);};
  wrap.addEventListener('pointerup',up); wrap.addEventListener('pointercancel',up);
  wrap.addEventListener('contextmenu',e=>e.preventDefault());
  addEventListener('keydown',e=>{ if(FX.key&&FX.key(e)) e.preventDefault(); });

  FX.init && FX.init();
  fromHash(); updSnd();
  const fpsEl=document.getElementById('fps');
  let last=performance.now(), acc=0, n=0;
  function loop(now){
    let dt=(now-last)/1000; last=now; if(dt>.1) dt=.1;
    acc+=dt; n++; if(acc>=.5){UI.fps=n/acc; fpsEl.textContent=UI.fps.toFixed(0)+' fps · '+UI.ms.toFixed(1)+'ms'; acc=0; n=0;}
    const t0=performance.now(); FX.frame(dt,now/1000,UI.P); UI.ms=lerp(UI.ms,performance.now()-t0,.1);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

</script>
<script>
/* =========================================================================
   CRT·글리치 — 2D 캔버스로 그린 화면 내용을 WebGL2 두 패스로 CRT에 태운다.
   패스 A (신호·형광체, 960×720, 부동소수 FBO 핑퐁)
     · 신호 결함: 찢김(행 블록 x오프셋), 수평 동기 이탈, 수직 롤, 스노, VHS 트래킹 띠·헤드 스위칭·색 번짐
     · 형광체 잔상: out = max(신호, 이전 × decay)  ← 초당 감쇠를 프레임 dt로 환산
   패스 B (표시, 스테이지 해상도)
     · 곡면(배럴) 왜곡 · 수렴 오차(가장자리일수록 RGB 분리) · 글로우 · 밝기 의존 스캔라인 · 애퍼처 그릴 · 비네트
     · 전원 차단: 세로 → 가로로 접히며 빛 에너지가 한 점에 모인다
   ========================================================================= */
const glc=document.getElementById('gl'), ovc=document.getElementById('ov'), ov=ovc.getContext('2d');
const SW=960, SH=720;
const srcC=document.createElement('canvas'); srcC.width=SW; srcC.height=SH; const sx=srcC.getContext('2d');
const SCR={x:145,y:58,w:860,h:645}; // 4:3 화면(스테이지 좌표)
const gl=glc.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:false});
const hasF=gl&&!!gl.getExtension('EXT_color_buffer_float');
const VS=`#version 300 es
in vec2 p; out vec2 v; void main(){ v=p*.5+.5; gl_Position=vec4(p,0,1); }`;
const FS_A=`#version 300 es
precision highp float; in vec2 v; out vec4 o;
uniform sampler2D uSrc,uPrev; uniform float uDecay,uTear,uSeed,uSnow,uHold,uRoll,uChroma,uVhs,uTrack,uJit,uBright;
float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
void main(){
  vec2 uv=vec2(v.x,1.-v.y);                      // uv.y=0 이 화면 위
  uv.y=fract(uv.y+uRoll); uv.x+=uHold;
  float row=floor(uv.y*36.), sd=floor(uSeed);
  float r=h(vec2(row,sd));
  if(r<uTear*.55) uv.x+=(h(vec2(row,sd+1.))-.5)*uTear*.22;           // 블록 찢김
  if(h(vec2(row*1.7,sd+3.))<uTear*.18) uv.y+= (h(vec2(row,sd+5.))-.5)*.04; // 행 뒤섞임
  uv.x+=(h(vec2(floor(uv.y*SH_),sd))-.5)*uJit;                     // 수평 떨림
  float band=0.;
  if(uVhs>0.){ band=smoothstep(.07,0.,abs(uv.y-uTrack))*uVhs;
    uv.x+=band*(h(vec2(floor(uv.y*240.),sd))-.5)*.08;
    uv.x+=pow(smoothstep(.93,1.,uv.y),2.)*.05*uVhs; }                // 헤드 스위칭(아래 끝 휨)
  vec3 c;
  c.r=texture(uSrc,uv+vec2(uChroma,0)).r; c.g=texture(uSrc,uv).g; c.b=texture(uSrc,uv-vec2(uChroma,0)).b;
  if(uVhs>0.){ // 색 번짐: 휘도는 선명, 색차는 가로로 뭉갬
    vec3 a=vec3(0); for(int i=1;i<=5;i++) a+=texture(uSrc,uv-vec2(float(i)*.0035,0)).rgb; a/=5.;
    float l=dot(c,vec3(.3,.59,.11)), la=dot(a,vec3(.3,.59,.11));
    c=mix(c, vec3(l)+(a-vec3(la)), .75*uVhs); }
  c*=uBright;
  float n=h(v*vec2(SW_,SH_)+fract(uSeed*.013)*91.);
  float sn=clamp(uSnow,0.,1.); c=c*(1.-sn*.55)+vec3(n*n*1.3)*sn*.8;
  c=mix(c,vec3(h(vec2(v.x*300.+uSeed,floor(uv.y*400.)))),band*.7);
  if(r<uTear*.12) c=c.gbr*1.4;                                      // 블록 색 깨짐
  vec3 prev=texture(uPrev,v).rgb*uDecay;
  o=vec4(max(c,prev),1.);
}`.replace(/SH_/g,SH+'.').replace(/SW_/g,SW+'.');
const FS_B=`#version 300 es
precision highp float; in vec2 v; out vec4 o;
uniform sampler2D uPh; uniform vec4 uRect; uniform float uCurve,uScan,uMask,uBloom,uConv,uVig,uTime,uFlick,uCX,uCY,uWob,uDot,uMono,uLines,uGain; uniform vec3 uTint;
void main(){
  vec2 fc=gl_FragCoord.xy; vec2 p=(fc-uRect.xy)/uRect.zw; vec2 q=p*2.-1.;
  q*=1.+uCurve*(q.yx*q.yx);                                  // 배럴
  vec2 qs=q;
  q+=uWob*vec2(sin(q.y*7.+uTime*23.),sin(q.x*6.+uTime*19.))*.035;
  q=vec2(q.x/max(uCX,.002),q.y/max(uCY,.002));               // 전원 차단 접힘
  vec2 uv=vec2(q.x*.5+.5,.5-q.y*.5);
  float inside=step(0.,uv.x)*step(uv.x,1.)*step(0.,uv.y)*step(uv.y,1.);
  vec2 edge=smoothstep(0.,.006,uv)*smoothstep(0.,.006,1.-uv);
  vec2 cv=q*uConv*.004;                                      // 수렴 오차
  vec3 c=vec3(texture(uPh,vec2(uv.x,1.-uv.y)+cv).r, texture(uPh,vec2(uv.x,1.-uv.y)).g, texture(uPh,vec2(uv.x,1.-uv.y)-cv).b);
  vec3 bl=vec3(0); float R=.0045;
  for(int i=0;i<12;i++){ float a=float(i)*2.3998, rr=R*(1.+float(i)*.55); bl+=texture(uPh,vec2(uv.x,1.-uv.y)+vec2(cos(a),sin(a))*rr*vec2(.75,1.)).rgb; }
  bl/=12.;
  float lum=dot(c,vec3(.3,.59,.11));
  if(uMono>.5){ c=uTint*lum*1.6; bl=uTint*dot(bl,vec3(.3,.59,.11))*1.6; }
  float ly=uv.y*uLines; float s=abs(fract(ly)-.5)*2.;        // 빔 프로파일: 밝을수록 굵다
  float w=mix(.55,1.35,clamp(lum,0.,1.));
  float scan=mix(1.,clamp(1.-pow(s,2.*w)*1.1+.12,0.,1.)*1.25,uScan);
  float m=mod(fc.x,3.); vec3 mask=vec3(m<1.?1.:.25,(m>=1.&&m<2.)?1.:.25,m>=2.?1.:.25);

     memo:'<h3>무엇을 보여 주나</h3>정보를 얻으려면 신호를 붙잡아야 한다. 다이얼이 어긋난 정도(detune)가 스노·수직 롤·수평 동기 흔들림·찢김을 한꺼번에 구동하고, 정확히 맞으면 "탁" 하고 고정된다. 정전기 소리 크기와 헤테로다인 휘파람 음높이가 detune에 따라 움직인다.'+MEMO_C+
      '<h3>Unity로 옮길 것</h3><ul><li>입력 하나(detune) → 셰이더 값 여러 개로의 매핑을 순수 C#에 둔다: <code>bad = smoothstep(0.015, 0.2, detune)</code>, snow=bad×스노, roll 속도=bad×1.6</li><li>수신 이벤트는 detune에 +0.22 버스트를 더하고 0.9초 동안 감쇠 → 같은 경로로 연출</li><li>고정 판정 히스테리시스를 둬서 경계에서 "탁" 소리가 연타되지 않게</li></ul><h3>함정</h3><ul><li>롤을 fract로 감으면 이음매가 보인다 — 실제 CRT의 검은 수직 귀선 띠를 흉내 내려면 롤 위치에 어두운 띠를 추가</li></ul>'},
    {concept:'#54 되감는 전투',sub:'VHS 되감기 · 트래킹 띠 · 색 번짐',hint:'<kbd>누르고 있기</kbd> 되감기(전투가 거꾸로 흐른다) &nbsp; <kbd>놓기</kbd> 재생 — 회차당 3번, 초과하면 거부',
     params:[['vhs','VHS 결함',0,1.5,.01,1],['rwSpeed','되감기 배속',1,8,.1,4],['persist','형광체 잔상',.5,.95,.005,.7],['curve','곡면',0,.3,.005,.08],['scan','스캔라인',0,1,.01,.5],['mask','애퍼처 그릴',0,1,.01,.25],['bloom','글로우',0,2,.01,.7],['conv','수렴 오차',0,3,.05,1]],
     memo:'<h3>무엇을 보여 주나</h3>되감기가 게임 규칙이라 결함이 곧 상태 표시다. 누르는 동안 테이프 시간이 거꾸로 흘러 날아간 카드가 손으로 돌아오고, 트래킹 노이즈 띠가 위아래로 훑고, 아래 끝이 헤드 스위칭으로 휜다. 모터 톱니음이 올라가며 수다스러운 채터가 붙고, 놓으면 쿵 + 모터 감속. 남은 횟수 0이면 붉은 거부.'+MEMO_C+
      '<h3>Unity로 옮길 것</h3><ul><li>되감기 연출은 게임 상태를 거꾸로 재생(순수 C# 스냅샷)하고 셰이더는 <code>vhs</code> 하나로 구동: 트래킹 띠 위치 = (t×1.7) mod 1.2</li><li>색 번짐: 휘도는 원본, 색차만 가로 5탭 평균 — 해상도 무관하게 "VHS"로 읽힌다</li><li>재생 복귀 후 0.8초 잔여 결함(post)로 끊김 없이 이어지게</li></ul><h3>함정</h3><ul><li>결함을 화면 전체에 균일하게 주면 그냥 흐린 화면이다 — 띠·아래 끝처럼 <b>국소</b>가 VHS다</li></ul>'}
  ],
  init(){ try{ glInit(); }catch(e){ console.error(e); } },
  select(i){ VARS[i].init(); housing(HOUS[i]); AU.setRoom([.7,4,.6]); startAmb(); if(gl){ for(let k=0;k<2;k++){gl.bindFramebuffer(gl.FRAMEBUFFER,fb[k]); gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);} } },
  frame(dt,t,P){ const V=VARS[UI.vi]; V.frame(dt,t,P);
    if(UI.vi===2) knob(S.tune); led(t,UI.vi===1?'rgb(255,170,60)':UI.vi===3?'rgb(255,60,60)':'rgb(80,255,120)',!(UI.vi===1&&(S.phase==='off'||S.phase==='collapse')) && !(UI.vi===3&&!S.rw&&Math.floor(t*2)%2));
    if(!gl) return;
    gl.bindTexture(gl.TEXTURE_2D,texSrc); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,srcC);
    const seed=Math.floor(t*24)+(S.seed||0);
    // A
    const a=PA.u; gl.useProgram(PA.p); gl.bindFramebuffer(gl.FRAMEBUFFER,fb[ping]); gl.viewport(0,0,SW,SH);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,texSrc); gl.uniform1i(a.uSrc,0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,tx[1-ping]); gl.uniform1i(a.uPrev,1);
    gl.uniform1f(a.uDecay,U.decay); gl.uniform1f(a.uTear,U.tear); gl.uniform1f(a.uSeed,seed); gl.uniform1f(a.uSnow,U.snow); gl.uniform1f(a.uHold,U.hold); gl.uniform1f(a.uRoll,U.roll);
    gl.uniform1f(a.uChroma,U.chroma); gl.uniform1f(a.uVhs,U.vhs); gl.uniform1f(a.uTrack,U.track); gl.uniform1f(a.uJit,U.jit); gl.uniform1f(a.uBright,U.bright);
    gl.drawArrays(gl.TRIANGLES,0,3);
    // B
    const b=PB.u; gl.useProgram(PB.p); gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,W,H);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tx[ping]); gl.uniform1i(b.uPh,0);
    gl.uniform4f(b.uRect,SCR.x,H-SCR.y-SCR.h,SCR.w,SCR.h); gl.uniform1f(b.uCurve,U.curve); gl.uniform1f(b.uScan,U.scan); gl.uniform1f(b.uMask,U.mask); gl.uniform1f(b.uBloom,U.bloom); gl.uniform1f(b.uConv,U.conv);
    gl.uniform1f(b.uVig,U.vig); gl.uniform1f(b.uTime,t); gl.uniform1f(b.uFlick,U.flick); gl.uniform1f(b.uCX,U.cx); gl.uniform1f(b.uCY,U.cy); gl.uniform1f(b.uWob,U.wob); gl.uniform1f(b.uDot,U.dot);
    gl.uniform1f(b.uMono,U.mono); gl.uniform3f(b.uTint,...U.tint); gl.uniform1f(b.uLines,U.lines); gl.uniform1f(b.uGain,U.gain);
    gl.drawArrays(gl.TRIANGLES,0,3);
    ping=1-ping; },
  down(x,y,e){ const V=VARS[UI.vi]; V.down&&V.down(x,y,e); },

  const w=AU.tone('sine',800,AU.t),wg=c.createGain(); wg.gain.value=0; w.connect(wg); wg.connect(g); w.start(); a.src.push(w);
