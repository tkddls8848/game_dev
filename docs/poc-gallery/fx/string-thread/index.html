<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실·끈·연결선 · 이펙트 샘플</title>
<style>
:root{--bg:#0e0f11;--panel:#16171a;--panel2:#1c1d21;--line:#2b2d32;--tx:#dcdcd8;--dim:#8b8d92;--acc:#e3b34f;--ok:#8fd48f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;color:var(--tx);font:13px/1.45 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:1000px;transform-origin:50% 50%;transform:translate(-50%,-50%)}
header{position:absolute;left:12px;right:12px;top:8px;height:44px;display:flex;align-items:center;gap:14px}
header h1{font-size:20px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
header h1 small{font-size:12px;font-weight:500;color:var(--dim);margin-left:8px;letter-spacing:0}
header .desc{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sp{flex:1}
.pill{font:12px/1 ui-monospace,Consolas,"D2Coding",monospace;padding:6px 9px;border:1px solid var(--line);border-radius:3px;background:var(--panel);white-space:nowrap}
#fps{color:var(--ok);min-width:74px;text-align:center}
#snd{cursor:pointer;color:var(--tx);font-family:inherit}
#snd.off{color:#c77}
#grid{position:absolute;left:12px;top:60px;width:1168px;height:928px;display:grid;grid-template-columns:580px 580px;grid-template-rows:460px 460px;gap:8px}
.cell{position:relative;background:#000;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.cell.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.cell .lab{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#121316;font-size:12px;z-index:2;border-bottom:1px solid var(--line);white-space:nowrap}
.cell .lab b{color:var(--acc);font-weight:700}
.cell .lab .h{margin-left:auto;color:var(--dim);overflow:hidden;text-overflow:ellipsis}
.cell canvas{position:absolute;left:0;top:26px;width:578px;height:432px;display:block;cursor:crosshair;touch-action:none;outline:none}
#panel{position:absolute;left:1192px;top:60px;width:396px;height:928px;background:var(--panel);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;overflow:hidden}
#panel .sec{padding:10px 12px;border-bottom:1px solid var(--line)}
#panel h2{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:6px;display:flex;align-items:center;gap:6px}
#panel h2 span{color:var(--dim);font-weight:400;font-size:11px;margin-left:auto}
#vt{font-size:14px;font-weight:700;margin-bottom:2px}
#vh{color:var(--dim);font-size:12px}
.row{display:grid;grid-template-columns:118px 1fr 64px;align-items:center;gap:8px;height:25px}
.row label{font-size:12px;color:#c9c9c4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row input{width:100%;accent-color:var(--acc)}
.row output{font:12px ui-monospace,Consolas,monospace;text-align:right;color:#f1d58d}
#json{font:11px/1.4 ui-monospace,Consolas,monospace;color:#b9c9b4;background:#101113;border:1px solid var(--line);border-radius:3px;padding:6px 8px;white-space:pre-wrap;word-break:break-all;max-height:92px;overflow:hidden}
#copy{float:right;font:11px inherit;background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:3px;padding:2px 8px;cursor:pointer}
#memo{flex:1;overflow:auto;padding:10px 12px 14px;font-size:12px;line-height:1.55;color:#c8c8c3}
#memo h3{font-size:12px;color:var(--acc);margin:10px 0 3px}
#memo h3:first-child{margin-top:0}
#memo ul{padding-left:16px}
#memo li{margin:2px 0}
#memo code{font:11px ui-monospace,Consolas,monospace;background:#0f1012;border:1px solid #26282c;border-radius:2px;padding:0 3px;color:#e6cf97}
#memo::-webkit-scrollbar{width:8px}#memo::-webkit-scrollbar-thumb{background:#2e3035;border-radius:4px}
kbd{font:11px ui-monospace,Consolas,monospace;border:1px solid #3a3c42;border-bottom-width:2px;border-radius:3px;padding:0 4px;background:#1d1e22}
</style>
</head>
<body>
<div id="stage">
<header>
  <h1>실·끈·연결선<small>이펙트 구현 샘플 · string-thread</small></h1>
  <div class="desc">단서를 잇는 붉은 실(늘어짐·장력), 패치 코드, 수놓은 선</div>
  <div class="sp"></div>
  <button class="pill" id="snd">소리 켜짐</button>
  <div class="pill" id="fps">-- fps</div>
</header>
<div id="grid"></div>
<aside id="panel">
  <div class="sec"><div id="vt">-</div><div id="vh">-</div></div>
  <div class="sec"><h2>파라미터 <span>선택한 변형 · 숫자는 그대로 게임에 옮긴다</span></h2><div id="params"></div></div>
  <div class="sec"><h2>현재 값 <span><button id="copy">복사</button></span></h2><div id="json"></div></div>
  <div id="memo"></div>
</aside>
</div>
<script>
'use strict';
/* ---------- 공용: 씨드 난수 ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var clamp=function(v,a,b){return v<a?a:v>b?b:v;};
var lerp=function(a,b,t){return a+(b-a)*t;};
var smooth=function(t){t=clamp(t,0,1);return t*t*(3-2*t);};
var DPR=Math.min(window.devicePixelRatio||1,2);
/* 정적 레이어 캐시용 캔버스: 논리 크기 w x h, 실제 해상도 DPR배. drawImage(c,x,y,c.w,c.h)로 그린다 */
function mkCanvas(w,h){var c=document.createElement('canvas');c.width=Math.ceil(w*DPR);c.height=Math.ceil(h*DPR);var g=c.getContext('2d');g.scale(DPR,DPR);c.g=g;c.w=w;c.h=h;return c;}
function blit(g,c,x,y){g.drawImage(c,x,y,c.w,c.h);}
/* 부드러운 원형 빛 스프라이트(색 하나). 매 프레임 그라디언트를 만들지 않고 이걸 늘려 그린다 */
var GLOWS={};
function glow(rgb){if(GLOWS[rgb])return GLOWS[rgb];var c=mkCanvas(64,64),g=c.g,r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba('+rgb+',1)');r.addColorStop(0.35,'rgba('+rgb+',.45)');r.addColorStop(1,'rgba('+rgb+',0)');g.fillStyle=r;g.fillRect(0,0,64,64);GLOWS[rgb]=c;return c;}
function drawGlow(g,rgb,x,y,rad,a){if(a<=0.003)return;var ga=g.globalAlpha;g.globalAlpha=ga*Math.min(1,a);g.drawImage(glow(rgb),x-rad,y-rad,rad*2,rad*2);g.globalAlpha=ga;}

/* ---------- 공용: WebAudio (첫 입력 뒤에만 생성) ---------- */
var A={ctx:null,on:true};
A.init=function(){
  if(A.ctx){if(A.ctx.state==='suspended')A.ctx.resume();return;}
  var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  var c;try{c=new C();}catch(e){return;}
  A.ctx=c;
  A.out=c.createGain();A.out.gain.value=A.on?0.9:0;
  var comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=8;comp.ratio.value=4;comp.attack.value=0.003;comp.release.value=0.18;
  A.out.connect(comp);comp.connect(c.destination);
  A.rev=c.createConvolver();A.rev.buffer=A.ir(2.2,2.8,7);
  A.revIn=c.createGain();A.revIn.gain.value=1;A.revIn.connect(A.rev);A.rev.connect(A.out);
  var r=mulberry32(99),n=c.sampleRate*2,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=r()*2-1;A.nb=b;
  for(var k=0;k<V.length;k++)if(V[k].audioInit)V[k].audioInit(c);
  if(focus&&focus.focusAudio)focus.focusAudio();
};
/* 합성 잔향: 씨드 노이즈 x 지수 감쇠, 초반 조기반사 몇 개 */
A.ir=function(sec,decay,seed){
  var c=A.ctx,len=Math.floor(c.sampleRate*sec),b=c.createBuffer(2,len,c.sampleRate),r=mulberry32(seed||1);
  for(var ch=0;ch<2;ch++){var d=b.getChannelData(ch);
    for(var i=0;i<len;i++){var t=i/len;d[i]=(r()*2-1)*Math.pow(1-t,decay)*(i<c.sampleRate*0.006?i/(c.sampleRate*0.006):1);}
    for(var e=0;e<6;e++){var p=Math.floor(c.sampleRate*(0.011+e*0.017+r()*0.01));if(p<len)d[p]+=(r()<.5?-1:1)*0.5*(1-e/7);}}
  return b;};
A.t=function(){return A.ctx?A.ctx.currentTime:0;};
/* 버스: dry(out)+wet(reverb) 두 갈래로 보내는 게인 노드 */
A.bus=function(dry,wet){var c=A.ctx,g=c.createGain();g.gain.value=1;var d=c.createGain();d.gain.value=dry;g.connect(d);d.connect(A.out);if(wet>0){var w=c.createGain();w.gain.value=wet;g.connect(w);w.connect(A.revIn);}return g;};
A.noise=function(){var s=A.ctx.createBufferSource();s.buffer=A.nb;s.loop=true;return s;};
/* 노이즈 한 발: 필터 + 엔벌로프. o={t,type,f,f2,q,a,d,g,dest} */
A.burst=function(o){if(!A.ctx)return;var c=A.ctx,t=o.t||c.currentTime,s=A.noise(),f=c.createBiquadFilter(),g=c.createGain();
  f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f||1000,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+(o.a||0.002)+(o.d||0.1));f.Q.value=o.q==null?1:o.q;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(o.g||0.3,t+(o.a||0.002));g.gain.exponentialRampToValueAtTime(0.0001,t+(o.a||0.002)+(o.d||0.1));
  s.connect(f);f.connect(g);g.connect(o.dest||A.out);s.start(t,(o.off||0)%1.5);s.stop(t+(o.a||0.002)+(o.d||0.1)+0.05);};
/* 오실레이터 한 발. o={t,type,f,f2,a,d,g,dest,detune} */
A.tone=function(o){if(!A.ctx)return;var c=A.ctx,t=o.t||c.currentTime,s=c.createOscillator(),g=c.createGain();
  s.type=o.type||'sine';s.frequency.setValueAtTime(o.f,t);if(o.f2)s.frequency.exponentialRampToValueAtTime(o.f2,t+(o.fd||((o.a||0.003)+(o.d||0.2))));if(o.detune)s.detune.value=o.detune;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(o.g||0.2,t+(o.a||0.003));g.gain.exponentialRampToValueAtTime(0.0001,t+(o.a||0.003)+(o.d||0.2));
  s.connect(g);g.connect(o.dest||A.out);s.start(t);s.stop(t+(o.a||0.003)+(o.d||0.2)+0.05);return s;};
/* Karplus-Strong 현 뜯기 버퍼 (씨드 고정) */
A.ksCache={};
A.pluck=function(freq,sec,damp,seed){var key=Math.round(freq)+':'+sec+':'+damp;if(A.ksCache[key])return A.ksCache[key];
  var c=A.ctx,sr=c.sampleRate,n=Math.floor(sr*sec),b=c.createBuffer(1,n,sr),d=b.getChannelData(0),P=Math.max(2,Math.round(sr/freq)),buf=new Float32Array(P),r=mulberry32(seed||7);
  for(var i=0;i<P;i++)buf[i]=r()*2-1;var idx=0,prev=0;
  for(i=0;i<n;i++){var cur=buf[idx];var nx=buf[(idx+1)%P];var v=(cur+nx)*0.5*damp;buf[idx]=v;d[i]=cur;idx=(idx+1)%P;}
  for(i=0;i<256&&i<n;i++)d[n-1-i]*=i/256;
  A.ksCache[key]=b;return b;};
A.play=function(buf,o){if(!A.ctx)return;var c=A.ctx,t=o.t||c.currentTime,s=c.createBufferSource(),g=c.createGain();s.buffer=buf;if(o.rate)s.playbackRate.value=o.rate;g.gain.value=o.g||0.3;s.connect(g);g.connect(o.dest||A.out);s.start(t);return s;};

/* ---------- 변형 등록 ---------- */
var V=[],focus=null;
function variant(o){V.push(o);return o;}

/* ===================== 실·끈·연결선 ===================== */
var COMMON_MEMO='<ul>'+
'<li><b>줄은 전부 같은 Verlet 로프</b>(점 N개 + 거리 제약 반복). 고정 120Hz 부분 스텝이라 프레임률이 흔들려도 늘어짐이 같다. 변형마다 다른 것은 <code>길이·중력·반복 횟수·감쇠</code> 네 숫자뿐.</li>'+
'<li>줄이 "당겨졌다"는 정보는 세 채널로 동시에: <b>모양</b>(처짐→직선), <b>색·굵기</b>(장력↑ = 밝고 가늘게), <b>소리</b>(길이에 반비례하는 음높이의 현 뜯기, Karplus-Strong).</li>'+
'<li>Unity로 옮길 때: 로프 계산은 순수 C#(float는 연출 전용이라 허용 — 판정은 "어느 핀과 어느 핀이 연결됐나" 정수 ID만). 그리기는 LineRenderer(점 N개) + 그림자용 두 번째 LineRenderer.</li>'+
'<li>함정: 제약 반복이 적으면 고무줄처럼 늘어나고, 너무 많으면 비싸다. 20~30점 x 8~16회가 적정. 끝점을 매 반복 다시 고정해야 핀에서 미끄러지지 않는다.</li></ul>';

/* ---------- Verlet 로프 ---------- */
function Rope(n,ax,ay,bx,by,len,sag){this.n=n;this.x=new Float32Array(n);this.y=new Float32Array(n);this.px=new Float32Array(n);this.py=new Float32Array(n);this.len=len;this.a=true;this.b=true;this.ax=ax;this.ay=ay;this.bx=bx;this.by=by;
  for(var i=0;i<n;i++){var t=i/(n-1);this.x[i]=this.px[i]=lerp(ax,bx,t);this.y[i]=this.py[i]=lerp(ay,by,t)+Math.sin(t*Math.PI)*(sag||0);}}
Rope.prototype.sim=function(h,grav,damp,iters,floor){
  var n=this.n,X=this.x,Y=this.y,PX=this.px,PY=this.py,i,k;
  for(i=0;i<n;i++){var vx=(X[i]-PX[i])*damp,vy=(Y[i]-PY[i])*damp;PX[i]=X[i];PY[i]=Y[i];X[i]+=vx;Y[i]+=vy+grav*h*h;if(floor!=null&&Y[i]>floor){Y[i]=floor;PX[i]=X[i]-vx*0.4;}}
  var seg=this.len/(n-1);
  for(k=0;k<iters;k++){
    if(this.a){X[0]=this.ax;Y[0]=this.ay;}if(this.b){X[n-1]=this.bx;Y[n-1]=this.by;}
    for(i=0;i<n-1;i++){var dx=X[i+1]-X[i],dy=Y[i+1]-Y[i],d=Math.sqrt(dx*dx+dy*dy)||1e-6,df=(d-seg)/d,wa=(i===0&&this.a)?0:1,wb=(i===n-2&&this.b)?0:1,s=wa+wb;if(!s)continue;
      X[i]+=dx*df*wa/s;Y[i]+=dy*df*wa/s;X[i+1]-=dx*df*wb/s;Y[i+1]-=dy*df*wb/s;}}
  if(this.a){X[0]=this.ax;Y[0]=this.ay;}if(this.b){X[n-1]=this.bx;Y[n-1]=this.by;}};
Rope.prototype.cur=function(){var L=0;for(var i=0;i<this.n-1;i++)L+=Math.hypot(this.x[i+1]-this.x[i],this.y[i+1]-this.y[i]);return L;};
Rope.prototype.path=function(g,ox,oy){var X=this.x,Y=this.y,n=this.n;ox=ox||0;oy=oy||0;g.beginPath();g.moveTo(X[0]+ox,Y[0]+oy);
  for(var i=1;i<n-1;i++)g.quadraticCurveTo(X[i]+ox,Y[i]+oy,(X[i]+X[i+1])/2+ox,(Y[i]+Y[i+1])/2+oy);g.lineTo(X[n-1]+ox,Y[n-1]+oy);};
Rope.prototype.kick=function(vx,vy,from,to){for(var i=from;i<to;i++){this.px[i]-=vx;this.py[i]-=vy;}};
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function speckle(g,w,h,n,seed,a){var r=mulberry32(seed);for(var i=0;i<n;i++){g.fillStyle=(r()<0.5?'rgba(0,0,0,':'rgba(255,240,210,')+(r()*a)+')';var s=0.6+r()*1.8;g.fillRect(r()*w,r()*h,s,s);}}
/* 현 뜯기: 길이(px)에 반비례하는 음높이 */
function pluckLen(len,g,dest,bright){if(!A.ctx)return;var f=clamp(52000/Math.max(40,len),70,900);A.play(A.pluck(f,1.2,bright||0.996,11),{g:g,dest:dest});}

/* ---------------- A. #25 분실물 창고 — 단서 보드 붉은 실 ---------------- */
variant({tag:'A',name:'#25 분실물 창고 — 단서 보드 붉은 실',hint:'핀에서 핀으로 드래그 · 멀리 당기면 끊어짐 · R 초기화',seed:2525,
hintLong:'왼쪽 물건 사진의 <b>핀에서 드래그</b>해 오른쪽 주인 카드 핀에 놓는다. 놓는 순간 실이 팽팽해지며 튕기고 길이에 맞는 음이 난다. 맞으면 금빛으로 빛나고, 틀리면 핀이 빠져 실이 흘러내린다. <b>최대 길이</b>보다 멀리 당기면 실이 끊어진다. <kbd>R</kbd> 초기화.',
params:[{k:'slack',l:'여유 길이',min:0,max:40,v:14,u:'%'},{k:'grav',l:'중력',min:200,max:3000,v:1500,u:'px/s²'},{k:'iters',l:'장력 반복',min:2,max:30,v:14,u:'회'},{k:'maxLen',l:'최대 길이',min:150,max:600,v:400,u:'px'},{k:'damp',l:'감쇠',min:90,max:100,step:0.5,v:98.5,u:'%'},{k:'thick',l:'실 굵기',min:1,max:5,step:0.2,v:2.4,u:'px'}],
memo:'<h3>기법</h3><ul><li>드래그 중엔 실이 핀에서 <b>풀려 나온다</b>: 로프 길이 = min(거리 x (1+여유), 최대 길이). 최대를 넘으면 늘어날 곳이 없어 장력이 오르고(색이 밝아지고 가늘어지며 떨림), 1.15배에서 끊어진다.</li><li>연결 순간 길이를 거리 x 1.03으로 120ms에 줄인다. Verlet이 그 차이를 파동으로 풀어내 "팅" 하고 떤다. 같은 순간 길이 반비례 음높이로 현을 뜯는다.</li><li>판정은 350ms 뒤: 맞음 = 금빛 맥동 + 두 음 화음, 틀림 = 끝 핀이 튀어나가며 실이 흘러내리고 둔탁한 소리.</li><li>끊김: 가운데서 로프를 둘로 나누고 양쪽을 핀 쪽으로 튕긴다(반동 속도 = 이전 위치 조작).</li></ul><h3>Unity 이식</h3><ul><li>순수 C#: <code>ClueBoard.Connect(fromPin, toPin) → Match|Mismatch</code>. 판정·점수는 정수 ID만.</li><li>연출 C#: <code>VerletRope(24점)</code>, FixedUpdate 120Hz. LineRenderer 2개(그림자 오프셋 3,5px, α .35) + 하이라이트 1개.</li><li>음: 실제 녹음한 "현 튕김" 한 개를 pitch = 기준길이/길이 로 재생해도 충분.</li></ul><h3>함정</h3><ul><li>여유 0%면 연결 순간 떨림이 없다 — 8~15%가 "실"로 읽힌다.</li><li>실 그림자를 빼면 보드 위에 그린 선처럼 보인다. 핀 머리는 실 위에 다시 그린다.</li></ul>',

params:[{k:'grav',l:'코드 무게(중력)',min:400,max:4000,v:2200,u:'px/s²'},{k:'damp',l:'감쇠',min:90,max:100,step:0.5,v:98,u:'%'},{k:'snap',l:'흡착 반경',min:6,max:50,v:24,u:'px'},{k:'insertMs',l:'삽입 시간',min:20,max:300,v:70,u:'ms'},{k:'ringMs',l:'호출 간격',min:800,max:6000,v:2600,u:'ms'},{k:'cordLen',l:'코드 길이',min:300,max:800,v:520,u:'px'}],
memo:'<h3>기법</h3><ul><li>코드는 무거운 로프(28점, 중력 2200). 한쪽 끝은 책상 구멍에 고정, 다른 끝은 플러그. 책상 앞판을 코드 위에 다시 그려 "책상 속에서 나온다"를 만든다.</li><li>흡착: 놓은 위치가 반경 안이면 플러그를 잭 중심으로 <code>insertMs</code> 동안 이징(마지막 6px은 "쑥" 들어가는 느낌으로 스케일 0.92).</li><li>꽂힘 소리 3겹: 고역 노이즈 딸깍(4kHz, 8ms) + 저역 몸체 쿵(180Hz, 60ms) + 금속 울림(대역 3.2kHz Q8). 뽑을 때는 역순·짧게 "뽁".</li><li>호출 램프는 2Hz 점멸 + 425Hz 신호음(25Hz 진폭변조) 짧게. 연결되면 따뜻한 백열 글로우로 고정.</li></ul><h3>Unity 이식</h3><ul><li>순수 C#: <code>Switchboard.Plug(cordId, jackId, ms)</code> → Connected / WrongJack / Unplugged. 호출 발생은 씨드 시각표(ms 정수).</li><li>연출: 코드 = VerletRope + LineRenderer(굵기 5, 텍스처 꼬임 무늬 타일). 램프 = 발광 머티리얼 + 작은 포인트 라이트.</li></ul><h3>함정</h3><ul><li>코드가 너무 가벼우면(중력&lt;800) 실처럼 떠서 교환대의 "손이 꼬이는" 무게감이 사라진다.</li><li>흡착 반경이 잭 간격의 절반을 넘으면 옆 잭에 잘못 붙는다. 여기선 잭 간격 65px → 최대 30px.</li></ul>',

  function frame(now){
    var dt=clamp((now-last)/1000,0,0.05);last=Math.max(last,now);
    for(var i=0;i<V.length;i++){var v=V[i];v.update(dt,now/1000);v.g.setTransform(v.S,0,0,v.S,0,0);v.draw(now/1000);}
    fc++;if(now-ft>500){fpsEl.textContent=Math.round(fc*1000/(now-ft))+' fps';fc=0;ft=now;}
    if(now-jt>150&&focus){jt=now;var s=jsonOf(focus);if(s!==lastJ){lastJ=s;jEl.textContent=JSON.stringify(JSON.parse(s),null,0).replace(/,"/g,', "');}}
    requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
})();
</script>
