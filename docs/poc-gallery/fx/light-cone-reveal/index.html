<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>빛줄기·손전등 노출 — 이펙트 샘플</title>
<style>
:root{--bg:#0f1114;--panel:#171a1f;--panel2:#1d2127;--line:#2a2f37;--tx:#d9dde3;--mut:#8b939e;--acc:#e8b86a;--acc2:#6ec3d6;--bad:#e0705f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.45 "Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:1fr 360px;grid-template-rows:54px 1fr;height:100vh;gap:0}
header{grid-column:1/3;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);background:#12151a}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
header h1 small{font-weight:400;color:var(--mut);font-size:12px;margin-left:10px}
header .desc{color:var(--mut);font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font:12px/1 ui-monospace,Menlo,Consolas,monospace;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--mut);white-space:nowrap}
.pill.on{color:#9fe0a8;border-color:#35523a}
#stagecol{display:flex;flex-direction:column;min-width:0;min-height:0;padding:10px 12px 10px 14px;gap:8px}
#tabs{display:flex;gap:6px}
#tabs button{flex:1;min-width:0;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 11px;cursor:pointer;font:inherit}
#tabs button b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tabs button span{display:block;color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tabs button kbd{float:right;font:11px ui-monospace,monospace;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px}
#tabs button.act{border-color:var(--acc);background:#221f19}
#tabs button.act span{color:#c9a978}
#stagewrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:#08090b;border:1px solid var(--line);border-radius:10px;overflow:hidden}
#stage{display:block;max-width:100%;max-height:100%;cursor:crosshair;touch-action:none}
#hint{display:flex;gap:14px;color:var(--mut);font-size:12px;align-items:center}
#hint b{color:var(--tx);font-weight:600}
#hint .k{font:11px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--tx);background:var(--panel)}
#side{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;overflow:hidden}
#side section{padding:12px 14px;border-bottom:1px solid var(--line)}
#side h2{font-size:12px;margin:0 0 8px;color:var(--mut);font-weight:600;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
.row{display:grid;grid-template-columns:96px 1fr 58px;align-items:center;gap:8px;margin:5px 0}
.row label{color:var(--tx);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row input[type=range]{width:100%;accent-color:var(--acc)}
.row input[type=color]{width:100%;height:20px;border:0;background:none;padding:0}
.row output{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--acc);text-align:right}
#readout{font:11.5px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#0e1013;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:8px 0 0;color:#b9d7a8;white-space:pre-wrap;max-height:150px;overflow:auto}
button.sm{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:5px;padding:3px 8px;font:11px inherit;cursor:pointer}
button.sm:hover{border-color:var(--acc)}
#memo{flex:1;min-height:0;overflow:auto;padding:12px 14px}
#memo h3{font-size:12.5px;margin:12px 0 4px;color:var(--acc)}
#memo h3:first-child{margin-top:0}
#memo p,#memo li{color:#b8bec7;font-size:12px;margin:3px 0}
#memo ul{margin:0;padding-left:16px}
#memo code{font:11.5px ui-monospace,monospace;color:#9fd0dc;background:#0e1013;padding:0 3px;border-radius:3px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
#ov{position:absolute;left:14px;top:12px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#e9e3d6;background:rgba(10,12,15,.62);border:1px solid rgba(255,255,255,.08);border-radius:7px;padding:6px 10px;pointer-events:none;white-space:pre;backdrop-filter:blur(2px)}
#ov:empty{display:none}
</style></head>
<body><div id="app">
<header><h1 id="ttl"></h1><div class="desc" id="desc"></div><span class="pill" id="snd">소리 꺼짐 — 캔버스를 누르면 켜짐</span><span class="pill" id="fps">-- fps</span></header>
<div id="stagecol"><div id="tabs"></div><div id="stagewrap"><canvas id="stage"></canvas><div id="ov"></div></div><div id="hint"></div></div>
<aside id="side">
<section><h2><span id="ptitle">파라미터</span><span class="btns"><button class="sm" id="reset">기본값</button><button class="sm" id="copy">복사</button></span></h2><div id="params"></div><pre id="readout"></pre></section>
<section><h2>동작</h2><div class="btns" id="actions"></div></section>
<div id="memo"></div>
</aside></div>
<script>
"use strict";
// ---- 공통: 씨드 난수 · 오디오 · 페이지 틀 (fx 샘플 공용, 파일마다 인라인 복사됨) ----
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function hexRgb(h){const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]}

const AU=(()=>{
  let ctx=null,master,comp,rev,revIn,ready=[],rng=mulberry32(9001);const cache={};
  function impulse(sec,decay,dark){
    const sr=ctx.sampleRate,n=Math.floor(sr*sec),b=ctx.createBuffer(2,n,sr);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);let lp=0;
      for(let i=0;i<n;i++){const t=i/n;const k=0.9-0.85*Math.pow(t,0.6)*dark; // 꼬리로 갈수록 어두워짐
        lp+= (rng()*2-1-lp)*k; d[i]=lp*Math.pow(1-t,decay)*(i<sr*0.004?i/(sr*0.004):1);}}
    return b;}
  function ensure(){
    if(ctx){if(ctx.state==='suspended')ctx.resume();return ctx;}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
    ctx=new AC();comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3.5;comp.attack.value=0.004;comp.release.value=0.2;
    master=ctx.createGain();master.gain.value=0.8;master.connect(comp);comp.connect(ctx.destination);
    rev=ctx.createConvolver();rev.buffer=impulse(2.6,2.6,1);revIn=ctx.createGain();revIn.gain.value=1;revIn.connect(rev);rev.connect(master);
    ready.forEach(f=>f(ctx));ready=[];return ctx;}
  function noise(kind,sec){
    const key=kind+sec;if(cache[key])return cache[key];
    const sr=ctx.sampleRate,n=Math.floor(sr*sec),b=ctx.createBuffer(1,n,sr),d=b.getChannelData(0),r=mulberry32(77+kind.length);
    let b0=0,b1=0,b2=0,br=0;
    for(let i=0;i<n;i++){const w=r()*2-1;
      if(kind==='white')d[i]=w;
      else if(kind==='pink'){b0=0.99765*b0+w*0.099;b1=0.963*b1+w*0.2965;b2=0.57*b2+w*1.0527;d[i]=(b0+b1+b2+w*0.1848)*0.2;}
      else{br=(br+0.02*w)/1.02;d[i]=br*3.5;}}
    // 루프 이음매 제거: 앞뒤 20ms 크로스페이드
    const f=Math.floor(sr*0.02);for(let i=0;i<f;i++){const t=i/f;d[i]=d[i]*t+d[n-f+i]*(1-t);}
    return cache[key]=b;}
  function out(pan,wet,dest){
    const g=ctx.createGain();let node=g;
    if(pan&&ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=clamp(pan,-1,1);g.connect(p);node=p;}
    node.connect(dest||master);
    if(wet){const s=ctx.createGain();s.gain.value=wet;node.connect(s);s.connect(revIn);}
    return g;}
  function env(g,t,peak,a,d,hold){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);if(hold)g.gain.setValueAtTime(peak,t+a+hold);g.gain.exponentialRampToValueAtTime(0.0001,t+a+(hold||0)+d);}
  function chain(src,filters,t,dur){let n=src;(filters||[]).forEach(f=>{const bq=ctx.createBiquadFilter();bq.type=f.type||'lowpass';bq.Q.value=f.Q==null?0.7:f.Q;
      bq.frequency.setValueAtTime(f.f,t);if(f.f1)bq.frequency.exponentialRampToValueAtTime(f.f1,t+(f.ft||dur));if(f.g!=null)bq.gain.value=f.g;n.connect(bq);n=bq;});return n;}
  // 필터 걸린 노이즈 한 방
  function burst(o){if(!ctx)return;const t=ctx.currentTime+(o.t0||0),a=o.a||0.003,d=o.d||0.2,hold=o.hold||0;
    const s=ctx.createBufferSource();s.buffer=noise(o.kind||'white',o.len||2);s.playbackRate.value=o.rate||1;
    const off=(o.off!=null?o.off:rng())*(s.buffer.duration-a-d-hold-0.05);
    const n=chain(s,o.filter,t,a+d+hold);const g=out(o.pan,o.wet,o.dest);n.connect(g);env(g,t,o.gain||0.5,a,d,hold);
    s.start(t,Math.max(0,off));s.stop(t+a+hold+d+0.05);return g;}
  // 음정 있는 톤 (주파수 스윕)
  function tone(o){if(!ctx)return;const t=ctx.currentTime+(o.t0||0),a=o.a||0.002,d=o.d||0.2,hold=o.hold||0;
    const s=ctx.createOscillator();s.type=o.type||'sine';s.frequency.setValueAtTime(o.f,t);
    if(o.f1)s.frequency.exponentialRampToValueAtTime(o.f1,t+(o.ft||a+d));
    const n=chain(s,o.filter,t,a+d+hold);const g=out(o.pan,o.wet,o.dest);n.connect(g);env(g,t,o.gain||0.3,a,d,hold);
    s.start(t);s.stop(t+a+hold+d+0.05);return g;}
  // 반복 앰비언스: 노이즈 루프 + 필터, 핸들 반환
  function loop(o){if(!ctx)return null;const s=ctx.createBufferSource();s.buffer=noise(o.kind||'brown',o.len||6);s.loop=true;s.playbackRate.value=o.rate||1;
    const fs=(o.filter||[]).map(f=>{const bq=ctx.createBiquadFilter();bq.type=f.type||'lowpass';bq.frequency.value=f.f;bq.Q.value=f.Q==null?0.7:f.Q;return bq;});
    let n=s;fs.forEach(b=>{n.connect(b);n=b;});const g=out(o.pan,o.wet,o.dest);g.gain.value=0;n.connect(g);s.start();
    return{src:s,gain:g,filters:fs,set(v,tc){g.gain.setTargetAtTime(v,ctx.currentTime,tc||0.1)},stop(){try{g.gain.setTargetAtTime(0,ctx.currentTime,0.08);s.stop(ctx.currentTime+0.5)}catch(e){}}};}
  return{ensure,burst,tone,loop,noise,out,impulse,get ctx(){return ctx},get master(){return master},get revIn(){return revIn},onReady(f){ctx?f(ctx):ready.push(f)},now(){return ctx?ctx.currentTime:0}};
})();

const FX={p:{},vi:0};
FX.run=function(E){
  FX.E=E;const W=E.W||1200,H=E.H||780;
  document.getElementById('ttl').innerHTML=E.title+'<small>이펙트 샘플 · fx/'+E.slug+'</small>';
  document.getElementById('desc').textContent=E.desc;
  const cv=document.getElementById('stage');cv.width=W;cv.height=H;FX.cv=cv;
  const tabs=document.getElementById('tabs');
  const store=E.variants.map(v=>{const o={};v.params.forEach(q=>o[q.k]=q.v);return o;});
  E.variants.forEach((v,i)=>{const b=document.createElement('button');b.innerHTML='<kbd>'+(i+1)+'</kbd><b>'+v.name+'</b><span>'+v.concept+'</span>';b.onclick=()=>setV(i);tabs.appendChild(b);});
  const act=document.getElementById('actions');
  (E.actions||[]).forEach(a=>{const b=document.createElement('button');b.className='sm';b.textContent=a.label;b.onclick=()=>{AU.ensure();a.fn();};act.appendChild(b);});
  const rows=document.getElementById('params'),ro=document.getElementById('readout');
  function fmt(q,v){if(q.type==='color')return v;const s=q.step||0.01;const dec=s>=1?0:s>=0.1?1:s>=0.01?2:3;return (+v).toFixed(dec);}
  function readout(){const v=E.variants[FX.vi];const o={variant:v.id};v.params.forEach(q=>o[q.k]=q.type==='color'?FX.p[q.k]:+fmt(q,FX.p[q.k]));ro.textContent=JSON.stringify(o,null,1).replace(/\n /g,'\n  ');}
  function buildRows(){const v=E.variants[FX.vi];rows.innerHTML='';document.getElementById('ptitle').textContent='파라미터 — '+v.name;
    v.params.forEach(q=>{const r=document.createElement('div');r.className='row';
      const inp=q.type==='color'?'<input type="color" value="'+FX.p[q.k]+'">':'<input type="range" min="'+q.min+'" max="'+q.max+'" step="'+(q.step||0.01)+'" value="'+FX.p[q.k]+'">';
      r.innerHTML='<label title="'+q.k+'">'+q.label+'</label>'+inp+'<output>'+fmt(q,FX.p[q.k])+'</output>';
      const i=r.querySelector('input'),o=r.querySelector('output');
      i.oninput=()=>{FX.p[q.k]=q.type==='color'?i.value:+i.value;o.textContent=fmt(q,FX.p[q.k]);readout();E.onParam&&E.onParam(q.k,FX.p[q.k]);};
      rows.appendChild(r);});readout();}
  document.getElementById('reset').onclick=()=>{const v=E.variants[FX.vi];v.params.forEach(q=>FX.p[q.k]=q.v);buildRows();E.onParam&&E.onParam('*');};
  document.getElementById('copy').onclick=()=>{try{navigator.clipboard.writeText(ro.textContent)}catch(e){}};
  function setV(i){FX.vi=i;FX.p=store[i];FX.v=E.variants[i];[...tabs.children].forEach((b,j)=>b.classList.toggle('act',j===i));
    document.getElementById('hint').innerHTML=FX.v.hint;
    document.getElementById('memo').innerHTML=E.memoCommon+'<h3>이 변형: '+FX.v.name+' ('+FX.v.concept+')</h3>'+FX.v.memo;
    buildRows();try{history.replaceState(null,'','#v='+(i+1))}catch(e){}E.setVariant(i,FX.v);}
  FX.setV=setV;
  const sp=document.getElementById('snd');
  function unlock(){if(AU.ensure()){sp.textContent='소리 켜짐';sp.classList.add('on');if(!FX.audioOn){FX.audioOn=true;E.audioStart&&E.audioStart();}}}
  function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];}
  cv.addEventListener('pointerdown',e=>{unlock();cv.setPointerCapture(e.pointerId);FX.down=true;const[x,y]=pos(e);FX.mx=x;FX.my=y;E.down&&E.down(x,y,e);});
  cv.addEventListener('pointermove',e=>{const[x,y]=pos(e);FX.mx=x;FX.my=y;E.move&&E.move(x,y,e,FX.down);});
  cv.addEventListener('pointerup',e=>{FX.down=false;const[x,y]=pos(e);E.up&&E.up(x,y,e);});
  cv.addEventListener('pointercancel',()=>{FX.down=false;});
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;unlock();const n=+e.key;if(n>=1&&n<=E.variants.length){setV(n-1);return;}
    if(e.key===' ')e.preventDefault();E.key&&E.key(e.key.toLowerCase(),e);});
  window.addEventListener('keyup',e=>{E.keyup&&E.keyup(e.key.toLowerCase(),e);});
  E.init(cv);
  const m=/v=(\d)/.exec(location.hash);setV(m?clamp(+m[1]-1,0,E.variants.length-1):0);
  const fp=document.getElementById('fps');let last=performance.now(),acc=0,fr=0;FX.t=0;
  function frame(now){if(FX.paused){last=now;requestAnimationFrame(frame);return;}let dt=now-last;last=now;if(dt>50)dt=50;if(dt<0)dt=0;FX.t+=dt;acc+=dt;fr++;
    if(acc>=500){fp.textContent=(fr*1000/acc).toFixed(0)+' fps';acc=0;fr=0;}
    E.update(dt,FX.t);E.render(FX.t);requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
  window.FXDEMO={setV,E,AU,pause(v){FX.paused=v},advance(ms){for(let t=0;t<ms;t+=16){FX.t+=16;E.update(16,FX.t);}E.render(FX.t);}};
};

</script>
<script>
// 빛줄기·손전등 노출 — 이펙트 샘플
// Canvas2D: 미리 구운 원뿔광 스프라이트 + 2D 그림자 볼륨 + 어둠 마스크(destination-out) + 빛 속 먼지/빗줄기 + 가산 헤이즈
const W=1200,H=780;
const VARIANTS=[
 {id:'battery-flashlight',name:'손전등 · 배터리',concept:'#5 배터리 서바이벌',
  hint:'<b>마우스</b> 조준 · <b>클릭</b> 켜기/끄기 · <span class="k">W A S D</span> 이동 · <span class="k">Space</span> 흔들어 충전 · 빛에 닿은 열쇠가 반짝인다',
  params:[
   {k:'battery',label:'배터리 %',min:0,max:100,step:1,v:70},
   {k:'angle',label:'원뿔 반각 °',min:8,max:45,step:0.5,v:22},
   {k:'range',label:'도달 거리 px',min:200,max:1000,step:10,v:620},
   {k:'dark',label:'어둠 농도',min:0.5,max:1,step:0.005,v:0.93},
   {k:'dust',label:'먼지',min:0,max:2,step:0.05,v:1},
   {k:'warm',label:'빛 색',type:'color',v:'#ffd9a0'}],
  memo:`<ul><li>배터리는 밝기만 줄이는 게 아니라 <b>색온도(노랗게)·깜빡임·순간 꺼짐</b>을 함께 바꾼다. 20% 아래에서 0.05~0.15s 드롭아웃 → 플레이어가 먼저 불안해진다.</li>
<li>그림자는 가구 다각형의 모서리마다 빛에서 멀어지는 사각형을 destination-out으로 지운 뒤, 가구 윗면만 다시 밝힌다. 그림자가 있어야 “뭔가 숨어 있을 공간”이 생긴다.</li>
<li>먼지는 빛 안에서만 보인다(알파 = 그 지점의 빛 세기). 빛의 부피감이 여기서 나온다.</li>
<li>Unity: Spot Light + Light Cookie(원뿔 스프라이트와 같은 모양) + 2D라면 URP 2D Light의 Shadow Caster. 배터리 곡선·드롭아웃 타이밍은 순수 C#.</li></ul>`},
 {id:'lives-in-dark',name:'빛이 닿으면 사라지는 사람',concept:'#6 빛이 닿지 않는 것',
  hint:'<b>마우스</b> 비추기 · 어둠 속에만 서 있는 사람이 있다 — 비추면 재가 되어 흩어지고 숨소리가 끊긴다 · 잠시 뒤 다른 어둠에 나타난다',
  params:[
   {k:'angle',label:'원뿔 반각 °',min:6,max:40,step:0.5,v:15},
   {k:'range',label:'도달 거리 px',min:300,max:1400,step:10,v:1100},
   {k:'figure',label:'실루엣 세기',min:0,max:1,step:0.01,v:0.55},
   {k:'dissolve',label:'흩어지는 속도',min:0.2,max:4,step:0.05,v:1.2},
   {k:'breath',label:'숨소리',min:0,max:2,step:0.05,v:1},

<li><b>어둠</b>: 검은 판을 채운 뒤 빛 마스크로 destination-out → 장면 위에 덮는다. 빛 색은 multiply(색 입힘) + lighter(헤이즈) 두 번.</li>
<li><b>빛 안의 입자</b>: 먼지·빗줄기 알파 = 해석적으로 계산한 그 지점의 빛 세기. 마스크를 읽지 않으므로 GPU 왕복이 없다.</li>
<li><b>소리</b>: 스위치 클릭(누름·뗌 두 번), 필라멘트 험, 깜빡임 지직, 숨소리 루프의 게인을 빛 세기와 연동.</li></ul>
