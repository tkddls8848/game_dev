<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>반사·굴절</title>
<style>
:root{
  --bg:#0f1012; --panel:#17181b; --panel2:#1d1f23; --line:#2a2d33; --text:#d9dade; --dim:#8b8f98; --accent:#6fd6c8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font:13px/1.45 "Noto Sans CJK KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
#app{display:grid;grid-template-columns:1fr 380px;grid-template-rows:52px 1fr;height:100vh;min-height:0}
header{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);background:#121316}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.2px}
header h1 small{font-weight:400;color:var(--dim);font-size:12px;margin-left:8px}
header .sp{flex:1}
header .pill{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:3px 9px}
header .pill b{color:var(--text);font-weight:600}
#snd.on{color:var(--accent);border-color:var(--accent)}
#grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;padding:10px;min-height:0;min-width:0}
.cell{position:relative;background:#000;border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:0;min-width:0;cursor:crosshair}
.cell.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.cell canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.cell .lab{position:absolute;left:0;top:0;right:0;display:flex;gap:8px;align-items:center;padding:6px 10px;
  background:linear-gradient(#000c,#0000);pointer-events:none;font-size:12px;z-index:2}
.cell .lab .k{font-weight:700;color:#fff}
.cell .lab .c{color:var(--accent);font-size:11px;border:1px solid color-mix(in srgb,var(--accent) 60%,transparent);border-radius:4px;padding:0 5px}
.cell .hint{position:absolute;left:10px;bottom:7px;font-size:11px;color:#fffa;pointer-events:none;z-index:2;text-shadow:0 1px 2px #000}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0;padding:12px 14px 20px}
aside h2{font-size:14px;margin:4px 0 2px}
aside h3{font-size:12px;margin:16px 0 6px;color:var(--dim);font-weight:600;letter-spacing:.3px}
aside .cons{color:var(--accent);font-size:11px}
.row{display:grid;grid-template-columns:96px 1fr 58px;gap:8px;align-items:center;margin:5px 0}
.row label{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row input{width:100%;accent-color:var(--accent)}
.row output{font:12px ui-monospace,Consolas,monospace;text-align:right;color:var(--text)}
pre.json{background:#0c0d0f;border:1px solid var(--line);border-radius:6px;padding:8px;font:11px/1.4 ui-monospace,Consolas,monospace;color:#b9c0ca;white-space:pre-wrap;margin:6px 0 0;user-select:all}
.memo{font-size:12px;color:#c3c6cc}
.memo p{margin:4px 0 8px}
.memo b{color:#fff}
.memo ul{margin:4px 0 8px;padding-left:18px}
.memo li{margin:2px 0}
.memo code{font:11px ui-monospace,Consolas,monospace;background:#0c0d0f;border:1px solid var(--line);border-radius:3px;padding:0 3px;color:#e6c98f}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.btns button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:4px 9px;font:inherit;font-size:12px;cursor:pointer}
.btns button:hover{border-color:var(--accent)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>반사·굴절 <small>창문 반사 속 다른 얼굴 · 수면 아래 스넬 창 · 수면 경계의 굴절 · 김 서린 유리 닦기</small></h1>
    <div class="sp"></div>
    <span class="pill">셀을 클릭하면 선택 · 키 <b>1–4</b> 전환 · <b>R</b> 리셋</span>
    <span class="pill" id="snd">소리: 첫 클릭 후 켜짐</span>
    <span class="pill">FPS <b id="fps">–</b></span>
  </header>
  <main id="grid"></main>
  <aside id="panel"></aside>
</div>
<script>
"use strict";
/* ============================== 공용 코어 (모든 fx 샘플 동일) ============================== */
// ---- 결정적 난수 ----
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function hash2(x,y,s){let h=(x*374761393+y*668265263+(s|0)*1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,s,o=4){let f=0,a=.5;for(let i=0;i<o;i++){f+=a*vnoise(x,y,s+i*17);x*=2.03;y*=2.03;a*=.5;}return f/(1-Math.pow(.5,o));}
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, smooth=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
const easeOutBack=(t,s=1.7)=>{t-=1;return 1+t*t*((s+1)*t+s)}, easeOutCubic=t=>1-Math.pow(1-t,3);

// ---- 오디오 (첫 사용자 입력 이후에만 생성) ----
const AU={ctx:null,master:null,wet:null,noise:null,brown:null};
function audio(){
  if(AU.ctx) {if(AU.ctx.state==='suspended')AU.ctx.resume();return AU.ctx;}
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
  const ctx=AU.ctx=new C();
  const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4; comp.attack.value=.003; comp.release.value=.2;
  AU.master=ctx.createGain(); AU.master.gain.value=.8; AU.master.connect(comp); comp.connect(ctx.destination);
  AU.wet=ctx.createConvolver(); AU.wet.buffer=makeImpulse(ctx,2.4,2.6,11); const wg=ctx.createGain(); wg.gain.value=.55; AU.wet.connect(wg); wg.connect(AU.master);
  const r=mulberry32(7), n=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate), d=n.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=r()*2-1; AU.noise=n;
  const b=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate), e=b.getChannelData(0); let last=0; for(let i=0;i<e.length;i++){last=(last+.02*(r()*2-1))/1.02;e[i]=last*3.5;} AU.brown=b;
  const s=document.getElementById('snd'); s.textContent='소리: 켜짐'; s.classList.add('on');
  return ctx;
}
// 생성형 임펄스 응답: 지수 감쇠 노이즈(스테레오). 방 크기 = dur, 감쇠 곡선 = decay
function makeImpulse(ctx,dur,decay,seed){const r=mulberry32(seed),len=Math.floor(ctx.sampleRate*dur),b=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++){d[i]=(r()*2-1)*Math.pow(1-i/len,decay);}}return b;}
// 공용 합성 도우미. o: {t, dur, gain, a(attack), f,f2(주파수 스윕), q, type, wet(리버브 송신), pan, buf}
function out(node,o){const ctx=AU.ctx;let n=node;if(o.pan){const p=ctx.createStereoPanner();p.pan.value=o.pan;n.connect(p);n=p;}
  n.connect(o.dest||AU.master); if(o.wet){const g=ctx.createGain();g.gain.value=o.wet;n.connect(g);g.connect(AU.wet);} }
function envGain(t,a,peak,dur,curve){const g=AU.ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(a+.005,dur));return g;}
function sNoise(o){const ctx=audio();if(!ctx)return;const t=(o.t??ctx.currentTime),dur=o.dur||.2;
  const s=ctx.createBufferSource();s.buffer=o.brown?AU.brown:AU.noise;s.loop=true;s.playbackRate.value=o.rate||1;
  const f=ctx.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f||1000,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+dur);f.Q.value=o.q??1;
  const g=envGain(t,o.a??.004,o.gain??.3,dur);s.connect(f);f.connect(g);out(g,o);s.start(t,(o.off??0)%1.9);s.stop(t+dur+.05);return {src:s,f,g};}
function sTone(o){const ctx=audio();if(!ctx)return;const t=(o.t??ctx.currentTime),dur=o.dur||.2;
  const s=ctx.createOscillator();s.type=o.type||'sine';s.frequency.setValueAtTime(o.f||440,t);if(o.f2)s.frequency.exponentialRampToValueAtTime(o.f2,t+(o.sweep||dur));
  if(o.detune)s.detune.value=o.detune;let n=s;if(o.lp){const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;f.Q.value=o.lq||.7;s.connect(f);n=f;}
  const g=envGain(t,o.a??.004,o.gain??.2,dur);n.connect(g);out(g,o);s.start(t);s.stop(t+dur+.05);return s;}
// 지속음(루프) — 게인을 외부에서 조절
function sLoop(o){const ctx=audio();if(!ctx)return null;const s=ctx.createBufferSource();s.buffer=o.brown?AU.brown:AU.noise;s.loop=true;
  const f=ctx.createBiquadFilter();f.type=o.type||'lowpass';f.frequency.value=o.f||400;f.Q.value=o.q??.7;const g=ctx.createGain();g.gain.value=0;
  s.connect(f);f.connect(g);out(g,o);s.start();return {src:s,f,g,set(v,tc=.08){g.gain.setTargetAtTime(v,ctx.currentTime,tc);}};}

// ---- WebGL 미니 도우미 ----
const QUAD_VS=`attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const GLSL_NOISE=`
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*vn(p);p=p*2.03+17.1;a*=.5;}return s/.96875;}
`;
function glCtx(canvas,opt){const gl=canvas.getContext('webgl',Object.assign({antialias:false,premultipliedAlpha:false,preserveDrawingBuffer:false,alpha:false},opt||{}));
  if(!gl)throw new Error('WebGL 사용 불가');gl.getExtension('OES_standard_derivatives');const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl._quad=b;return gl;}
function glProg(gl,vs,fs){const mk=(t,s)=>{const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh)+'\n'+s.split('\n').map((l,i)=>(i+1)+': '+l).join('\n'));return sh;};
  const p=gl.createProgram();gl.attachShader(p,mk(gl.VERTEX_SHADER,vs));gl.attachShader(p,mk(gl.FRAGMENT_SHADER,'precision highp float;\n'+fs));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));p._u={};p._a={};return p;}
function glU(gl,p,name,v){let l=p._u[name];if(l===undefined)l=p._u[name]=gl.getUniformLocation(p,name);if(l===null)return;
  if(typeof v==='number')gl.uniform1f(l,v);else if(v.tex){gl.activeTexture(gl.TEXTURE0+v.unit);gl.bindTexture(gl.TEXTURE_2D,v.tex);gl.uniform1i(l,v.unit);}
  else if(v.length===2)gl.uniform2fv(l,v);else if(v.length===3)gl.uniform3fv(l,v);else if(v.length===4)gl.uniform4fv(l,v);}
function glQuad(gl,p,uniforms){gl.useProgram(p);gl.bindBuffer(gl.ARRAY_BUFFER,gl._quad);let a=p._a.p;if(a===undefined)a=p._a.p=gl.getAttribLocation(p,'p');
  gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);for(const k in uniforms)glU(gl,p,k,uniforms[k]);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
function glTex(gl,src,o={}){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);const f=o.nearest?gl.NEAREST:gl.LINEAR;
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,f);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,f);
  const w=o.repeat?gl.REPEAT:gl.CLAMP_TO_EDGE;gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,w);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,w);return t;}
function glTexUpdate(gl,t,src){gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}

// ---- 변형(variant) 등록과 화면 ----
const V=[];let SEL=0;const SOLO=+(new URLSearchParams(location.search).get('solo')??-1); // ?solo=N: 한 변형만 갱신(저사양·검증용)
function variant(def){V.push(def);}
function params(v){const o={};for(const p of v.params)o[p.k]=p.v;return o;}
function buildUI(){
  const grid=document.getElementById('grid');
  V.forEach((v,i)=>{
    const cell=document.createElement('div');cell.className='cell';
    cell.innerHTML=`<div class="lab"><span class="k">${i+1}. ${v.name}</span><span class="c">${v.concept}</span></div><div class="hint">${v.hint}</div>`;
    const cv=document.createElement('canvas');cell.appendChild(cv);grid.appendChild(cell);v.cell=cell;v.canvas=cv;v.P=params(v);v.t=0;v.freeze=0;v.id=i;
  });
  // 크기 확정 후 setup
  for(const v of V){const r=v.cell.getBoundingClientRect(),s=Math.min(window.devicePixelRatio||1,1.25);
    v.canvas.width=Math.round(r.width*s);v.canvas.height=Math.round(r.height*s);v.W=v.canvas.width;v.H=v.canvas.height;v.scale=s;
    try{v.setup(v);}catch(e){console.error(e);v.err=e;}
    const pos=e=>{const b=v.canvas.getBoundingClientRect();return[(e.clientX-b.left)*v.W/b.width,(e.clientY-b.top)*v.H/b.height];};
    v.canvas.addEventListener('pointerdown',e=>{audio();select(v.id);v.canvas.setPointerCapture(e.pointerId);v.drag=true;const[x,y]=pos(e);v.mx=x;v.my=y;v.down&&v.down(v,x,y,e);});
    v.canvas.addEventListener('pointermove',e=>{const[x,y]=pos(e);v.mx=x;v.my=y;v.move&&v.move(v,x,y,e,v.drag);});
    v.canvas.addEventListener('pointerup',e=>{v.drag=false;const[x,y]=pos(e);v.up&&v.up(v,x,y,e);});
    v.canvas.addEventListener('pointerleave',e=>{v.leave&&v.leave(v);});
    v.canvas.addEventListener('contextmenu',e=>e.preventDefault());
  }
  window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const n=+e.key;if(n>=1&&n<=V.length){select(n-1);return;}
    audio();const v=V[SEL];if((e.key==='r'||e.key==='R')&&v.reset){v.reset(v);return;}v.key&&v.key(v,e);});
  select(0);
}
function select(i){SEL=i;V.forEach((v,k)=>v.cell.classList.toggle('sel',k===i));renderPanel();}
function renderPanel(){
  const v=V[SEL],el=document.getElementById('panel');
  el.innerHTML=`<h2>${SEL+1}. ${v.name}</h2><div class="cons">${v.concept}</div><div class="memo"><p>${v.about||''}</p></div>
  <h3>파라미터</h3><div id="rows"></div>
  <div class="btns">${(v.buttons||[]).map((b,i)=>`<button data-b="${i}">${b[0]}</button>`).join('')}<button id="rst">기본값</button></div>
  <pre class="json" id="json"></pre>
  <h3>구현 메모 — 이 변형</h3><div class="memo">${v.memo||''}</div>
  <h3>구현 메모 — 공통</h3><div class="memo">${COMMON_MEMO}</div>`;
  const rows=el.querySelector('#rows');
  v.params.forEach(p=>{const r=document.createElement('div');r.className='row';
    r.innerHTML=`<label title="${p.label}">${p.label}</label><input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${v.P[p.k]}"><output></output>`;
    const inp=r.querySelector('input'),o=r.querySelector('output');const show=()=>{o.textContent=fmt(v.P[p.k],p.step)+(p.unit||'');};show();
    inp.addEventListener('input',()=>{v.P[p.k]=+inp.value;show();dumpJson();v.onParam&&v.onParam(p.k);});rows.appendChild(r);});
  el.querySelectorAll('[data-b]').forEach(b=>b.addEventListener('click',()=>{audio();v.buttons[+b.dataset.b][1](v);}));
  el.querySelector('#rst').addEventListener('click',()=>{v.P=params(v);renderPanel();v.onParam&&v.onParam('*');});
  dumpJson();
}
function fmt(x,step){const d=String(step).includes('.')?String(step).split('.')[1].length:0;return(+x).toFixed(d);}
function dumpJson(){const v=V[SEL];document.getElementById('json').textContent='// '+v.name+'\n'+JSON.stringify(v.P,null,0).replace(/,/g,', ');}
// 히트스톱: v.freeze(ms) 동안 시뮬레이션 dt=0 (렌더는 계속)
let lastT=performance.now(),fpsAcc=0,fpsN=0;
function loop(now){
  const dtReal=Math.min(50,now-lastT);lastT=now;fpsAcc+=dtReal;fpsN++;
  if(fpsAcc>500){document.getElementById('fps').textContent=Math.round(1000*fpsN/fpsAcc);fpsAcc=0;fpsN=0;}
  for(const v of V){if(v.err||(SOLO>=0&&v.id!==SOLO))continue;let dt=dtReal;if(v.freeze>0){v.freeze-=dtReal;dt=0;}v.t+=dt;try{v.frame(v,dt,dtReal);}catch(e){console.error(e);v.err=e;}}
  requestAnimationFrame(loop);
}
window.addEventListener('load',()=>{buildUI();if(SOLO>=0)select(SOLO);requestAnimationFrame(loop);});
/* ============================== 효과 본체 ============================== */
//@TITLE 반사·굴절
//@DESC 창문 반사 속 다른 얼굴 · 수면 아래 스넬 창 · 수면 경계의 굴절 · 김 서린 유리 닦기
//@ACCENT #6fd6c8
const COMMON_MEMO=`
<p><b>반사는 “밝기 차이”로 결정된다.</b> 유리 반사율은 수직 입사에서 약 4–8%뿐이라, 반사가 보이는 건 <b>반대편이 어두울 때</b>다. 그래서 반사 연출은 반사 텍스처보다 <b>바깥 밝기·실내 밝기 두 값</b>이 먼저다 — 둘의 비율만 바꿔도 반사가 나타났다 사라진다(게임 규칙으로 쓸 수 있다).</p>
<ul>
<li><b>굴절은 방향을 꺾어 다른 곳을 샘플링하는 것</b>: 평면 수면이면 <code>refract(I, N, 1/1.333)</code> 한 번. 물속에서 올려다보면 임계각 48.6° 밖은 전반사(TIR) → 스넬 창(시야각 97°의 원) 밖은 물속 거울이 된다.</li>

<li><b>흐림</b>: 8탭 원형 블러(반경 = 성에×9px) + 밝은 산란(바깥 등빛이 번짐) + 고주파 노이즈 물방울 법선으로 굴절 오프셋. Unity: 블러는 저해상 RT 한 번으로 충분.</li>
<li><b>흘러내림</b>: 마스크 경계(기울기 큰 곳)에 물방울 하이라이트, 무작위 열에서 세로 줄무늬가 아래로 이동. C#: 줄마다 시작 ms·속도 정수.</li>
<li><b>소리</b>: 뽀드득 = 속도에 비례한 공명 밴드패스(Q 12) 노이즈 + 900–1600Hz 사인 “끽” 게이트. 드래그를 멈추면 50ms 안에 끊어야 손에 붙는다.</li></ul>`,
  setup(v){const gl=v.gl=glCtx(v.canvas),W=v.W,H=v.H;v.rT=glTex(gl,drawSeatReflection(512,320));
    v.fog=mkCanvas(256,160);v.fg=v.fog.getContext('2d');v.fT=glTex(gl,v.fog);
    v.sh=glProg(gl,QUAD_VS,GLSL_NOISE+TUNNEL+`
uniform vec2 R;uniform float T,S,refl,fogAmt,drops;uniform sampler2D rf,fm;varying vec2 uv;
float sdb(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
vec3 clear(vec2 q){vec3 o=tunnel(q,S);float wash=lampWash(S);vec3 r=texture2D(rf,vec2(q.x,q.y)).rgb;return o+r*refl*(1.-.75*wash);}
void main(){vec2 p=gl_FragCoord.xy;vec3 wall=vec3(.42,.3,.22)*(.5+.5*uv.y);vec3 col=wall;
  vec2 wc=R*vec2(.5,.54),wh=R*vec2(.43,.36);float d=sdb(p-wc,wh,30.);
  if(d<0.){vec2 q=(p-(wc-wh))/(2.*wh);
    float f=texture2D(fm,q).a*fogAmt;
    // 물방울 법선(고주파)
    vec2 dn=vec2(vn(q*vec2(160.,100.))-.5,vn(q*vec2(160.,100.)+9.)-.5);
    vec3 cl=clear(q+dn*.004*f);
    vec3 bl=vec3(0.);for(int i=0;i<8;i++){float a=float(i)*.785;bl+=clear(q+vec2(cos(a),sin(a))*.02*f+dn*.02);}bl/=8.;
    vec3 fogc=bl*.8+vec3(.22,.22,.24)*f+vec3(.25,.2,.15)*lampWash(S)*f;              // 산란
    col=mix(cl,fogc,smoothstep(.05,.6,f));
    // 경계 물방울 + 흘러내림
    float g=length(vec2(texture2D(fm,q+vec2(.004,0.)).a-texture2D(fm,q-vec2(.004,0.)).a,texture2D(fm,q+vec2(0.,.006)).a-texture2D(fm,q-vec2(0.,.006)).a));
    float bead=step(.86,h21(floor(q*vec2(220.,140.))))*smoothstep(.05,.3,g);col+=vec3(.5)*bead*drops;
    float xw=q.x*90.+sin(q.y*30.)*.25;float colx=floor(xw);float run=step(.9,h21(vec2(colx,3.)));float head=fract(-T*.05*(.4+h21(vec2(colx,5.)))+h21(vec2(colx,8.)));float yy=q.y-head;
    float trail=step(0.,yy)*smoothstep(.35,.0,yy);col=mix(col,cl*1.05+.03,run*drops*smoothstep(.2,.05,abs(fract(xw)-.5))*trail*step(.3,f)*.85);col+=vec3(.6)*run*drops*smoothstep(.012,.0,abs(yy))*smoothstep(.25,.1,abs(fract(xw)-.5))*step(.3,f);
    col*=1.-.2*smoothstep(-40.,0.,d);}
  col=mix(col,vec3(.12,.1,.08),smoothstep(12.,9.,d)*smoothstep(0.,2.,d));
  col*=1.-.35*pow(length(uv-.5)*1.3,2.);
  gl_FragColor=vec4(col,1.);}`);
    v.reset(v);},
  reset(v){v.fg.globalCompositeOperation='source-over';v.fg.fillStyle='#fff';v.fg.fillRect(0,0,256,160);v.S=0;v.last=null;v.wipeSp=0;},
  toFog(v,x,y){const W=v.W,H=v.H,wx=W*.07,wy=H*.1,ww=W*.86,wh=H*.72;return[(x-wx)/ww*256,(y-wy)/wh*160];},
  down(v,x,y){v.last=this.toFog(v,x,y);},
  move(v,x,y,e,drag){if(!drag||!v.last)return;const [fx,fy]=this.toFog(v,x,y),g=v.fg,r=v.P.brush*v.scale/v.W*0.86*256*0+v.P.brush*256/(v.W*.86)*v.scale;
    const dx=fx-v.last[0],dy=fy-v.last[1],n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/(r*.3)));g.globalCompositeOperation='destination-out';
    for(let i=1;i<=n;i++){const px=v.last[0]+dx*i/n,py=v.last[1]+dy*i/n,gr=g.createRadialGradient(px,py,0,px,py,r);gr.addColorStop(0,'rgba(0,0,0,.9)');gr.addColorStop(.6,'rgba(0,0,0,.6)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(px-r,py-r,r*2,r*2);}
    g.globalCompositeOperation='source-over';v.wipeSp=Math.min(1,Math.hypot(dx,dy)/8);v.wipeT=performance.now();v.last=[fx,fy];},
  up(v){v.last=null;},
  frame(v,dt){const gl=v.gl,W=v.W,H=v.H,P=v.P,s=dt/1000;v.S+=s*1.4;
    const g=v.fg;g.globalCompositeOperation='source-over';g.fillStyle=`rgba(255,255,255,${Math.min(1,P.regrow/100*s*.5)})`;g.fillRect(0,0,256,160);glTexUpdate(gl,v.fT,v.fog);
    if(performance.now()-(v.wipeT||0)>50)v.wipeSp*=Math.pow(.001,s);
    if(AU.ctx){if(!v.sq){v.sq=sLoop({type:'bandpass',f:1200,q:12});v.rum=sLoop({brown:true,type:'lowpass',f:120});
        const o=AU.ctx.createOscillator();o.frequency.value=1100;const og=AU.ctx.createGain();og.gain.value=0;o.connect(og);out(og,{});o.start();v.sqo={o,og};}
      const w=v.wipeSp*(SEL===v.id?1:0),t=AU.ctx.currentTime;v.sq&&v.sq.set(w*.5,.02);v.sq&&v.sq.f.frequency.setTargetAtTime(900+w*1400,t,.03);
      v.sqo.og.gain.setTargetAtTime(w>.3?.035*w:0,t,.015);v.sqo.o.frequency.setTargetAtTime(1000+500*Math.sin(v.t*.03)+w*300,t,.02);v.rum&&v.rum.set(SEL===v.id?.25:0,.3);}
    gl.viewport(0,0,W,H);glQuad(gl,v.sh,{R:[W,H],T:v.t/1000,S:v.S,refl:P.refl/100*1.4,fogAmt:P.fogAmt/100,drops:P.drops/100,rf:{tex:v.rT,unit:0},fm:{tex:v.fT,unit:1}});
  }
});
