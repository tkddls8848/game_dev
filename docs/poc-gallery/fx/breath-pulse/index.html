<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>호흡·심박 펄스 · FX 샘플</title>
<style>
:root{--bg:#0d0e10;--panel:#15171a;--panel2:#1b1e22;--line:#2a2e34;--text:#d9dce1;--mute:#868c96;--acc:#ff7a6b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#08090a;overflow:hidden;color:var(--text)}
body{font:13px/1.5 "Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#app{position:absolute;left:50%;top:50%;width:1600px;height:1000px;transform:translate(-50%,-50%);transform-origin:50% 50%;background:var(--bg);overflow:hidden}
header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line)}
header .ttl{display:flex;align-items:baseline;gap:12px;min-width:0}
header .tag{font-size:11px;letter-spacing:.08em;color:#0d0e10;background:var(--acc);padding:2px 7px;border-radius:3px;font-weight:700}
header h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
header .desc{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .stat{display:flex;gap:10px;font:12px/1 ui-monospace,"DejaVu Sans Mono",Consolas,monospace;color:var(--mute)}
header .stat span{padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
#aud.on{color:var(--acc);border-color:var(--acc)}
main{display:flex;gap:16px;padding:14px 16px 0}
.left{width:1122px;flex:none}
#stageWrap{position:relative;width:1122px;height:702px;border:1px solid var(--line);background:#000;border-radius:4px;overflow:hidden}
#view{display:block;width:1120px;height:700px;cursor:crosshair;touch-action:none}
#hud{position:absolute;right:10px;top:10px;font:11.5px/1.5 ui-monospace,"DejaVu Sans Mono",Consolas,monospace;color:#dfe6ee;background:rgba(0,0,0,.55);padding:5px 9px;border-radius:3px;white-space:pre;pointer-events:none;display:none}
#flash{position:absolute;left:12px;top:10px;font:12px/1.4 "Noto Sans KR","Noto Sans CJK KR",sans-serif;color:#fff;background:rgba(0,0,0,.45);padding:5px 9px;border-radius:3px;pointer-events:none;opacity:0;transition:opacity .4s}
#vars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
#vars button{all:unset;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:9px 12px;height:84px;display:flex;flex-direction:column;gap:3px;transition:border-color .15s,background .15s}
#vars button:hover{border-color:#3d434b}
#vars button.on{border-color:var(--acc);background:var(--panel2);box-shadow:inset 3px 0 0 var(--acc)}
#vars b{font-size:14px;font-weight:700}
#vars b i{font-style:normal;color:var(--mute);font-weight:500;margin-right:6px;font-family:ui-monospace,"DejaVu Sans Mono",monospace}
#vars .cpt{font-size:11.5px;color:var(--acc)}
#vars .sub{font-size:11.5px;color:var(--mute);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#hint{margin-top:10px;padding:9px 12px;background:var(--panel);border:1px solid var(--line);border-radius:4px;color:#c8ccd2;font-size:13px;display:flex;gap:10px;align-items:center}
#hint kbd{font:11px/1 ui-monospace,monospace;border:1px solid #454b54;border-bottom-width:2px;border-radius:3px;padding:2px 5px;color:#e6e8ec;background:#1f2226}
#hint .k{color:var(--acc);font-weight:700;flex:none}
aside{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;height:926px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.panel h2{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.panel h2 small{font-weight:500;color:var(--mute);font-size:11.5px}
.prm{display:grid;grid-template-columns:118px 1fr 64px;align-items:center;gap:8px;margin:5px 0}
.prm label{font-size:12px;color:#c3c7cd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prm output{font:12px/1 ui-monospace,"DejaVu Sans Mono",monospace;text-align:right;color:var(--acc)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:#30343a;border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--acc);border:2px solid #111;cursor:pointer}
.row{display:flex;gap:6px;margin-top:8px}
.row button{all:unset;cursor:pointer;font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:3px;background:var(--panel2);color:#cfd3d8}
.row button:hover{border-color:var(--acc)}
#readout{margin-top:8px;font:11.5px/1.45 ui-monospace,"DejaVu Sans Mono",Consolas,monospace;color:#aeb4bc;background:#0f1113;border:1px solid var(--line);border-radius:3px;padding:8px 10px;white-space:pre;overflow:hidden;user-select:all}
.memo{flex:1;min-height:0;overflow:auto}
.memo::-webkit-scrollbar{width:8px}.memo::-webkit-scrollbar-thumb{background:#2c3036;border-radius:4px}
#memo{font-size:12.5px;line-height:1.6;color:#c4c8ce}
#memo h3{font-size:12px;color:var(--acc);margin:10px 0 3px;font-weight:700}
#memo h3:first-child{margin-top:0}
#memo ul{padding-left:16px}
#memo li{margin:2px 0}
#memo code{font:11.5px ui-monospace,"DejaVu Sans Mono",monospace;color:#e2c98f;background:#0f1113;padding:0 3px;border-radius:2px}
#memo .vnote{background:var(--panel2);border-left:3px solid var(--acc);padding:7px 10px;margin-bottom:8px;border-radius:0 3px 3px 0}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="ttl"><span class="tag">FX 샘플</span><h1>호흡·심박 펄스</h1><p class="desc">숨 리듬 비네트 · 화면 수축 · 심박 파형 · 숨 참기 게이지</p></div>
 <div class="stat"><span id="fps">-- fps</span><span id="aud">소리: 첫 입력 후 켜짐</span></div>
</header>
<main>
 <section class="left">
  <div id="stageWrap"><canvas id="view" width="1120" height="700"></canvas><div id="flash"></div><div id="hud"></div></div>
  <nav id="vars"></nav>
  <div id="hint"></div>
 </section>
 <aside>
  <div class="panel"><h2>파라미터 <small id="pvName"></small></h2><div id="params"></div>
   <div class="row"><button id="reset">기본값</button><button id="copy">값 복사</button><button id="mute">소리 끄기</button></div>
   <pre id="readout"></pre></div>
  <div class="panel memo"><h2>구현 메모</h2><div id="memo"></div></div>
 </aside>
</main>
</div>
<script>
'use strict';
/* ===== 공통: 난수 · 노이즈 ===== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash1(i,s){let t=(Math.imul(i|0,374761393)+Math.imul(s|0,668265263))|0;t=Math.imul(t^(t>>>13),1274126177);return((t^(t>>>16))>>>0)/4294967296}
function vnoise(x,s){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return hash1(i,s)*(1-u)+hash1(i+1,s)*u}
function snoise(x,s){return vnoise(x,s)*2-1}
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t, sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3), easeInOut=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
const FONT_SANS='"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const FONT_SERIF='"Noto Serif KR","Noto Serif CJK KR","Batang","AppleMyungjo",serif';
const FONT_MONO='"D2Coding","DejaVu Sans Mono",Consolas,"Noto Sans Mono CJK KR",monospace';

/* ===== 공통: WebAudio ===== */
const AU={C:null,muted:false};
function makeIR(C,sec,pow,seed,pre){const r=mulberry32(seed),n=Math.floor(sec*C.sampleRate),b=C.createBuffer(2,n,C.sampleRate),p=Math.floor((pre||0.012)*C.sampleRate);
 for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let lp=0;for(let i=p;i<n;i++){const k=(i-p)/(n-p);lp=lp*0.35+(r()*2-1)*0.65;d[i]=lp*Math.pow(1-k,pow)}}return b}
function audioInit(){
 if(AU.C){if(AU.C.state!=='running')AU.C.resume();return}
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 const C=new AC();AU.C=C;
 const comp=C.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=8;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.25;
 const master=C.createGain();master.gain.value=.85;master.connect(comp);comp.connect(C.destination);
 const conv=C.createConvolver();conv.buffer=makeIR(C,2.6,2.4,9001);const wet=C.createGain();wet.gain.value=.8;conv.connect(wet);wet.connect(master);
 AU.master=master;AU.rev=conv;
 const r=mulberry32(4242),nb=C.createBuffer(1,C.sampleRate*3,C.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=r()*2-1;AU.nb=nb;
 const pb=C.createBuffer(1,C.sampleRate*3,C.sampleRate),pd=pb.getChannelData(0);let b0=0,b1=0,b2=0;for(let i=0;i<pd.length;i++){const w=r()*2-1;b0=.99765*b0+w*.099046;b1=.963*b1+w*.2965164;b2=.57*b2+w*1.0526913;pd[i]=(b0+b1+b2+w*.1848)*.2}AU.pb=pb;
 AU.rng=mulberry32(77);
 const el=document.getElementById('aud');el.textContent='소리: 켜짐';el.classList.add('on');
 if(FXCUR&&FXCUR.audioStart)FXCUR.audioStart(S);
}
function auOut(node,rev,pan){const C=AU.C;let n=node;if(pan){const p=C.createStereoPanner();p.pan.value=clamp(pan,-1,1);n.connect(p);n=p}n.connect(AU.master);if(rev){const s=C.createGain();s.gain.value=rev;n.connect(s);s.connect(AU.rev)}return n}
function env(param,t,a,d,peak,hold){param.cancelScheduledValues(t);param.setValueAtTime(.0001,t);param.linearRampToValueAtTime(peak,t+a);if(hold)param.setValueAtTime(peak,t+a+hold);param.exponentialRampToValueAtTime(.0001,t+a+(hold||0)+d)}
/* 잡음 한 방: {at,dur,type,f,f2,q,g,a,rev,pan,pink,rate} */
function sNoise(o){const C=AU.C;if(!C||AU.muted)return;const t=C.currentTime+(o.at||0),dur=o.dur||.2;
 const s=C.createBufferSource();s.buffer=o.pink?AU.pb:AU.nb;s.loop=true;s.playbackRate.value=o.rate||1;
 const f=C.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f||1000,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+(o.a||.005)+dur);f.Q.value=o.q||1;
 const g=C.createGain();env(g.gain,t,o.a||.004,dur,o.g||.3,o.hold);s.connect(f);f.connect(g);auOut(g,o.rev,o.pan);
 s.start(t,AU.rng()*2);s.stop(t+(o.a||.004)+(o.hold||0)+dur+.1);return g}
/* 음 한 방: {at,dur,type,f,f2,g,a,rev,pan,lp,detune} */
function sTone(o){const C=AU.C;if(!C||AU.muted)return;const t=C.currentTime+(o.at||0),dur=o.dur||.3;
 const s=C.createOscillator();s.type=o.type||'sine';s.frequency.setValueAtTime(o.f||440,t);if(o.f2)s.frequency.exponentialRampToValueAtTime(o.f2,t+(o.glide||dur));if(o.detune)s.detune.value=o.detune;
 const g=C.createGain();env(g.gain,t,o.a||.004,dur,o.g||.2,o.hold);let n=s;
 if(o.lp){const f=C.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;f.Q.value=o.q||.7;s.connect(f);n=f}
 n.connect(g);auOut(g,o.rev,o.pan);s.start(t);s.stop(t+(o.a||.004)+(o.hold||0)+dur+.1);return g}
/* 지속음 루프: 변형이 떠나면 정리된다 */
function loopNoise(o){const C=AU.C;const s=C.createBufferSource();s.buffer=o.pink?AU.pb:AU.nb;s.loop=true;s.playbackRate.value=o.rate||1;
 const f=C.createBiquadFilter();f.type=o.type||'lowpass';f.frequency.value=o.f||800;f.Q.value=o.q||.7;const g=C.createGain();g.gain.value=0;s.connect(f);f.connect(g);auOut(g,o.rev,o.pan);s.start(0,AU.rng()*2);
 return{g,f,src:s,stop(){try{g.gain.setTargetAtTime(0,C.currentTime,.05);s.stop(C.currentTime+.4)}catch(e){}}}}
function loopOsc(o){const C=AU.C;const s=C.createOscillator();s.type=o.type||'sine';s.frequency.value=o.f||60;let n=s;let f=null;
 if(o.lp){f=C.createBiquadFilter();f.type=o.ftype||'lowpass';f.frequency.value=o.lp;f.Q.value=o.q||.7;s.connect(f);n=f}
 const g=C.createGain();g.gain.value=0;n.connect(g);auOut(g,o.rev,o.pan);s.start();
 return{g,f,osc:s,stop(){try{g.gain.setTargetAtTime(0,C.currentTime,.05);s.stop(C.currentTime+.4)}catch(e){}}}}
function setG(loop,v,tc){if(!loop||!AU.C)return;loop.g.gain.setTargetAtTime(AU.muted?0:v,AU.C.currentTime,tc||.03)}

/* ===== 공통: WebGL 후처리 ===== */
function GLX(cv){
 const gl=cv.getContext('webgl',{antialias:false,premultipliedAlpha:false,preserveDrawingBuffer:true,alpha:false});
 if(!gl)throw new Error('WebGL을 쓸 수 없다');
 const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
 const VS='attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
 function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o}
 const X={gl};
 X.prog=fs=>{const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,'precision highp float;varying vec2 uv;\n'+fs));gl.bindAttribLocation(p,0,'p');gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));p.u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i);p.u[a.name]={loc:gl.getUniformLocation(p,a.name),type:a.type}}return p};
 X.tex=(w,h)=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  if(w)gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);t.w=w;t.h=h;return t};
 X.upload=(t,src)=>{gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);t.w=src.width;t.h=src.height};
 X.fbo=(w,h)=>{const t=X.tex(w,h);const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);gl.bindFramebuffer(gl.FRAMEBUFFER,null);return{f,t,w,h}};
 X.run=(p,U,target)=>{gl.bindFramebuffer(gl.FRAMEBUFFER,target?target.f:null);gl.viewport(0,0,target?target.w:cv.width,target?target.h:cv.height);gl.useProgram(p);let unit=0;
  for(const k in U){const u=p.u[k];if(!u)continue;const v=U[k];
   if(u.type===gl.SAMPLER_2D){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,v.t||v);gl.uniform1i(u.loc,unit);unit++}
   else if(typeof v==='number')gl.uniform1f(u.loc,v);else if(v.length===2)gl.uniform2fv(u.loc,v);else if(v.length===3)gl.uniform3fv(u.loc,v);else gl.uniform4fv(u.loc,v)}
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.drawArrays(gl.TRIANGLES,0,3)};
 return X;
}

/* ===== 공통: 틀 ===== */
const S={W:1120,H:700,t:0,dt:0,mx:560,my:350,down:false,keys:{}};
let FXCUR=null;
function boot(FX){
 FXCUR=FX;
 const view=document.getElementById('view');S.view=view;S.X=GLX(view);
 const app=document.getElementById('app');
 function fit(){const s=Math.min(innerWidth/1600,innerHeight/1000);app.style.transform='translate(-50%,-50%) scale('+s+')'}
 addEventListener('resize',fit);fit();
 FX.setup(S);
 const nav=document.getElementById('vars');
 FX.variants.forEach((v,i)=>{v.P={};v.params.forEach(p=>v.P[p.k]=p.v);
  const b=document.createElement('button');b.innerHTML='<b><i>'+(i+1)+'</i>'+v.name+'</b><span class="cpt">'+v.concept+'</span><span class="sub">'+v.sub+'</span>';
  b.onclick=()=>select(i);v.btn=b;nav.appendChild(b)});
 let cur=null;
 function select(i){
  if(cur&&cur.leave)cur.leave(S);
  if(cur&&cur.loops){cur.loops.forEach(l=>l.stop());}
  cur=FX.variants[i];cur.loops=[];S.v=cur;S.P=cur.P;S.rng=mulberry32(1234+i);
  FX.variants.forEach(v=>v.btn.classList.toggle('on',v===cur));
  document.getElementById('hint').innerHTML='<span class="k">조작</span><span>'+cur.hint+'</span>';
  document.getElementById('memo').innerHTML='<div class="vnote"><b>이 변형 — '+cur.name+'</b><br>'+cur.note+'</div>'+FX.memo;
  buildParams();cur.enter(S);if(AU.C&&cur.audio)cur.audio(S);
  try{history.replaceState(null,'','#'+(i+1))}catch(e){}
 }
 S.select=select;
 S.loop=l=>{if(l)cur.loops.push(l);return l};
 function buildParams(){const box=document.getElementById('params');box.innerHTML='';document.getElementById('pvName').textContent=cur.concept;
  cur.params.forEach(p=>{const d=document.createElement('div');d.className='prm';
   const dec=(String(p.step).split('.')[1]||'').length;
   d.innerHTML='<label title="'+p.k+'">'+p.l+'</label><input type="range" min="'+p.min+'" max="'+p.max+'" step="'+p.step+'" value="'+cur.P[p.k]+'"><output></output>';
   const inp=d.querySelector('input'),out=d.querySelector('output');
   const show=()=>{out.textContent=Number(cur.P[p.k]).toFixed(dec)+(p.u||'')};show();
   inp.oninput=()=>{cur.P[p.k]=parseFloat(inp.value);show();readout();if(cur.onParam)cur.onParam(S,p.k)};
   box.appendChild(d)});readout()}
 function readout(){const o={variant:cur.id};cur.params.forEach(p=>o[p.k]=cur.P[p.k]);
  document.getElementById('readout').textContent=JSON.stringify(o,null,1).replace(/\n /g,'\n  ')}
 document.getElementById('reset').onclick=()=>{cur.params.forEach(p=>cur.P[p.k]=p.v);buildParams();if(cur.onParam)cur.onParam(S,'*')};
 document.getElementById('copy').onclick=()=>{const t=document.getElementById('readout').textContent;
  try{navigator.clipboard.writeText(t);flash('값을 복사했다')}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById('readout'));const s=getSelection();s.removeAllRanges();s.addRange(r);flash('선택됨 — Ctrl+C')}};
 document.getElementById('mute').onclick=e=>{AU.muted=!AU.muted;e.target.textContent=AU.muted?'소리 켜기':'소리 끄기';if(AU.master)AU.master.gain.setTargetAtTime(AU.muted?0:.85,AU.C.currentTime,.05)};
 function pos(e){const r=view.getBoundingClientRect();return[(e.clientX-r.left)*S.W/r.width,(e.clientY-r.top)*S.H/r.height]}
 addEventListener('pointerdown',()=>{const had=!!AU.C;audioInit();if(!had&&AU.C&&cur.audio)cur.audio(S)},true);
 addEventListener('keydown',()=>{const had=!!AU.C;audioInit();if(!had&&AU.C&&cur.audio)cur.audio(S)},true);
 view.addEventListener('pointerdown',e=>{view.setPointerCapture(e.pointerId);const[x,y]=pos(e);S.mx=x;S.my=y;S.down=true;S.button=e.button;if(cur.down)cur.down(S,x,y,e)});
 view.addEventListener('pointermove',e=>{const[x,y]=pos(e);S.mx=x;S.my=y;if(cur.move)cur.move(S,x,y,e)});

  g.fillStyle='#f0ece4';g.beginPath();g.moveTo(170,380);g.lineTo(230,380);g.lineTo(220,320);g.lineTo(180,320);g.fill();g.fillStyle='#f4dcc8';g.beginPath();g.arc(200,300,24,0,7);g.fill();g.fillStyle='#1a1410';g.beginPath();g.arc(200,292,26,Math.PI*1.05,Math.PI*1.95);g.fill();g.fillStyle='#000';g.fillRect(190,298,4,4);g.fillRect(206,298,4,4);
  // 액자·시계·오르골·열쇠
  g.fillStyle='#5a4028';g.fillRect(470,90,150,120);g.fillStyle='#8a8070';g.fillRect(482,102,126,96);g.fillStyle='#3a3028';g.beginPath();g.arc(520,150,18,0,7);g.arc(570,150,18,0,7);g.fill();
  g.fillStyle='#e8dcc0';g.beginPath();g.arc(720,140,30,0,7);g.fill();g.strokeStyle='#3a2a1c';g.lineWidth=3;g.stroke();g.beginPath();g.moveTo(720,140);g.lineTo(720,120);g.moveTo(720,140);g.lineTo(736,146);g.stroke();

 open(S){if(S.t-this.t0<this.P.snapMs/1000+this.P.closeMs/1000+.3)return;this.t0=S.t;
  sNoise({type:'bandpass',f:300,f2:2400,q:.8,dur:.18,g:.12});sNoise({type:'highpass',f:4000,dur:.015,g:.15});sTone({f:880,dur:.05,g:.02,at:this.P.snapMs/1000});
  sNoise({type:'lowpass',f:260,dur:.2,g:.2,at:this.P.snapMs/1000+.05})},

 frame(S,dt){const P=this.P,t=S.t;const a=(t-this.t0)*1000;let o=0;
  if(a>=0){if(a<P.openMs)o=easeOut(a/P.openMs);else if(a<P.snapMs)o=1;else if(a<P.snapMs+P.closeMs)o=1-easeInOut((a-P.snapMs)/P.closeMs)}
  this.o=o;const opening=a>=0&&a<P.snapMs;
  if(AU.C)setG(this.tone,o*.05);
  const hr=opening?118:88;this.hb+=dt*hr/60;if(this.hb>=1){this.hb-=1;this.beat=t;heart(o>.5?.25:.45)}const ba=t-(this.beat||-9);const bp=Math.exp(-ba/.08)+(ba>.17?.6*Math.exp(-(ba-.17)/.07):0);
  sg.drawImage(lit,0,0);
  // 섬광 빛: 가운데가 밝다
  sg.globalCompositeOperation='lighter';const fg=sg.createRadialGradient(560,330,40,560,330,620);fg.addColorStop(0,'rgba(200,210,230,.35)');fg.addColorStop(1,'rgba(200,210,230,0)');sg.fillStyle=fg;sg.fillRect(0,0,W,H);sg.globalCompositeOperation='source-over';
  const ad=opening?1+(P.adapt-1)*Math.exp(-a/250):1;

  ug.fillStyle='#ff4a3a';ug.beginPath();ug.arc(40,38,7,0,7);ug.fill();ug.fillStyle='#fff';ug.font='700 14px '+FONT_SANS;ug.fillText('REC',54,43);
  panel(ug,24,80,180,150);ug.fillStyle='#e8e0d0';ug.font='600 14px '+FONT_SANS;ug.fillText('찾을 것',38,104);['녹슨 열쇠','오르골','인형','가족 사진','벽시계'].forEach((s,i)=>{ug.strokeStyle='rgba(255,255,255,.6)';ug.strokeRect(38,116+i*22,11,11);ug.fillStyle='#d8d0c0';ug.font='13px '+FONT_SANS;ug.fillText(s,56,126+i*22)});

  this.U={...U0(),lid:o,lidSoft:.18+.12*(1-o),expo:ad,vigR:.48,vigS:.5,vigStr:.75,after:P.afterAmt,scale:1+bp*.004*(1-o)};
  this.afterOpen=o;this.afterDecay=Math.pow(.5,dt/P.afterS)},

const FX={variants:[V37,V38,V05,V21],
 memo:`<h3>기법</h3><ul>
<li>숨은 <code>lung(phase)</code>: 들숨 40%(코사인 상승) · 날숨 45% · 쉼 15%. 심박은 누적 위상이 1을 넘을 때 박 이벤트 1개 → lub(즉시)·dub(+170ms).</li>
<li>한 값이 여러 감각을 동시에 움직인다: 산소 부족 s → 비네트 반경·터널 흐림·채도·스케일·심박 간격·숨소리 볼륨.</li>
<li>비네트 반경은 목표값으로 <b>스프링</b>(k·c) — 숨을 놓을 때 튕겨 열리는 오버슈트가 "해방"을 전한다.</li>
<li>UI(파형·게이지·타이머)는 별도 캔버스로 후처리 뒤에 얹는다: 시야가 좁아져도 정보는 읽혀야 한다.</li>
<li>21 잔상: 누적 FBO 핑퐁 <code>max(prev·0.5^(dt/반감), 밝은부분·열림)</code>.</li></ul>
<h3>Unity로 옮길 것</h3><ul>
<li>URP Volume을 스크립트로 구동: Vignette.intensity/smoothness, ColorAdjustments.saturation, ChromaticAberration, LensDistortion.scale(화면 수축). 값은 순수 C# <code>BreathModel</code>/<code>HeartModel</code>이 ms 정수 시간으로 계산.</li>
<li>눈꺼풀·잔상은 커스텀 Renderer Feature(풀스크린 셰이더 + 잔상 RT 2장).</li>
<li>소리: 숨 = 밴드패스 잡음(들숨 1.1~1.3kHz, 날숨 700Hz), 볼륨 = |d부피/dt|. 코골이 = 48Hz 톱니 저역통과, 날숨에서만. 심박 = 62→38Hz 사인 + 저역 잡음, dub는 +170ms.</li>
<li>무호흡(38) 판정·길이, 숨 참기(37) 산소·소음 판정은 전부 헤드리스 테스트 가능한 순수 로직.</li></ul>
<h3>함정</h3><ul>
<li>화면 호흡은 2% 이하로. 크면 멀미, 작아도 오래 보면 "살아 있는 방"이 된다. 멀미 옵션으로 0 가능하게.</li>
<li>비네트를 검정 100%로 닫으면 조작 불능 — 최소 반경(<code>vigMin</code>)을 두고 UI는 그 위에.</li>
<li>심박 소리를 매 박 같은 샘플로 내면 기계 같다 — 세기를 공포/산소에 비례, 피치 미세 변화.</li>
<li>잔상 decay를 프레임당 상수로 두면 프레임레이트에 따라 달라진다 — <code>0.5^(dt/반감기)</code>.</li></ul>`,
 setup(S){sc=mkCanvas(W,H);sg=sc.getContext('2d');ui=mkCanvas(W,H);ug=ui.getContext('2d');lit=mkCanvas(W,H);lg2=lit.getContext('2d');tmp=mkCanvas(W,H);tg=tmp.getContext('2d');
  X=S.X;tS=X.tex();tU=X.tex();PR.post=X.prog(SH_POST);PR.after=X.prog(SH_AFTER);AF=[X.fbo(W,H),X.fbo(W,H)]},
 present(S,v){const U=v.U;if(!U)return;X.upload(tS,sc);X.upload(tU,ui);let A=AF[af];
  if(v.after){const a=AF[af],b=AF[1-af];X.run(PR.after,{T:tS,P:b,decay:v.afterDecay||.98,open:v.afterOpen||0},a);af=1-af;A=a}
  X.run(PR.post,{T:tS,U:tU,A,scale:U.scale,vigR:U.vigR,vigS:U.vigS,vigStr:U.vigStr,vigCol:U.vigCol,desat:U.desat,expo:U.expo,ca:U.ca,tunnel:U.tunnel,lid:U.lid,lidSoft:U.lidSoft,after:v.after?U.after:0,warm:U.warm,t:S.t%7,ctr:U.ctr},null)}
};
