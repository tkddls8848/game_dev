<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말풍선 퍼즐</title>
<style>
:root{
  --paper:#fbf6ea; --ink:#141217; --cyan:#27b5e6; --mag:#f0457d; --yel:#ffd23f; --mint:#4fd1a5;
  --desk:#ffd9c9; --desk2:#ffc2ae; --ui:#1b1830;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#120f1c;overflow:hidden}
body{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:1000px;overflow:hidden;transform-origin:50% 50%;
  background:
   radial-gradient(circle at 20% 10%,rgba(255,255,255,.5),transparent 40%),
   radial-gradient(rgba(240,69,125,.18) 22%,transparent 24%) 0 0/18px 18px,
   linear-gradient(135deg,#ffe3d6,#ffc9b8 60%,#ffb8a6);}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}

/* top bar */
.top{position:absolute;left:0;right:0;top:0;height:92px;display:flex;align-items:center;padding:0 34px;gap:22px}
.logo{font-weight:900;font-size:34px;letter-spacing:-.02em;color:#fff;-webkit-text-stroke:0;
  text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),6px 6px 0 var(--mag);transform:rotate(-2deg)}
.ep{background:var(--ink);color:#fff;border-radius:40px;padding:10px 20px;font-weight:800;font-size:18px;box-shadow:4px 4px 0 var(--cyan)}
.ep b{color:var(--yel);margin-right:8px}
.pills{margin-left:auto;display:flex;gap:12px}
.pill{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 14px;font-weight:900;font-size:18px;box-shadow:4px 4px 0 var(--ink);display:flex;align-items:center;gap:8px}
.pill small{font-size:12px;font-weight:700;color:#6b6478}
.pill .ic{width:22px;height:22px;border-radius:50%;display:inline-block}

/* comic page */
.page{position:absolute;left:62px;top:104px;width:950px;height:878px;background:var(--paper);border:4px solid var(--ink);border-radius:6px;
  box-shadow:10px 12px 0 var(--ink),0 30px 60px rgba(80,20,40,.35);transform:rotate(-.6deg)}
.panel{position:absolute;width:445px;height:410px;border:4px solid var(--ink);background:#fff;overflow:hidden;transition:transform .35s cubic-bezier(.2,1.4,.4,1),box-shadow .2s}
.panel svg.art{position:absolute;inset:0;width:100%;height:100%}
.gray svg.art{filter:grayscale(1) contrast(1.15) brightness(1.04)}
.panel .num{position:absolute;left:-4px;top:-4px;background:var(--ink);color:#fff;font-weight:900;font-size:17px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:0 0 12px 0;z-index:3}
.panel .swap{position:absolute;right:8px;bottom:8px;z-index:4;background:#fff;border:3px solid var(--ink);border-radius:10px;font-weight:900;font-size:14px;padding:4px 8px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.panel .swap:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.panel.moving{box-shadow:0 0 0 6px var(--yel),14px 18px 0 rgba(20,18,23,.35);transform:rotate(1.5deg) translateY(-6px);z-index:5}
.drag-arrow{position:absolute;z-index:6;pointer-events:none}

/* bubbles */
.bub{position:absolute;z-index:4;white-space:nowrap;background:#fff;border:3.5px solid var(--ink);border-radius:50%;padding:18px 22px;text-align:center;font-weight:900;font-size:24px;line-height:1.2;letter-spacing:-.02em;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s}
.bub:hover{transform:scale(1.05)}
.bub::after{content:"";position:absolute;width:26px;height:30px;background:#fff;border:3.5px solid var(--ink);border-top:0;border-left:0;
  bottom:-19px;left:var(--tx,40%);transform:skewX(var(--sk,-30deg)) rotate(45deg);border-radius:0 0 6px 0}
.bub.think{border-style:solid;border-radius:46%}
.bub.shout{border-radius:8px;clip-path:none;background:var(--yel)}
.bub.shout::after{background:var(--yel)}
.bub.slot{background:rgba(255,255,255,.55);border:3.5px dashed #6b6478;color:#6b6478;font-size:30px;animation:bob 1.2s ease-in-out infinite}
.bub.slot::after{background:rgba(255,255,255,.55);border-color:#6b6478;border-style:dashed}
.bub.slot.hot{border-color:var(--mag);color:var(--mag);background:rgba(255,230,238,.8);box-shadow:0 0 0 6px rgba(240,69,125,.18)}
.bub.slot.hot::after{border-color:var(--mag);background:rgba(255,230,238,.8)}
@keyframes bob{50%{transform:translateY(-4px)}}
.bub.lifted{z-index:9;transform:rotate(-6deg) scale(1.08);box-shadow:14px 18px 0 rgba(20,18,23,.25);animation:lift 1.6s ease-in-out infinite}
@keyframes lift{50%{transform:rotate(-4deg) scale(1.1) translateY(-6px)}}
.pop{animation:pop .35s cubic-bezier(.2,1.8,.4,1)}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
.sfx{position:absolute;z-index:3;font-weight:900;font-style:italic;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;letter-spacing:.04em;pointer-events:none}

/* side panel */
.side{position:absolute;left:1050px;top:104px;width:510px;height:878px}
.card{background:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:7px 8px 0 var(--ink);padding:18px 22px;position:relative}
.card h4{font-size:15px;font-weight:900;letter-spacing:.12em;color:#6b6478;margin-bottom:10px}
.gauge{height:290px}
.tray{margin-top:20px;height:290px}
.trayin{position:relative;height:220px;background:
   radial-gradient(rgba(39,181,230,.25) 22%,transparent 24%) 0 0/14px 14px,#eaf7fd;border:3px solid var(--ink);border-radius:12px}
.tray .bub{font-size:20px;padding:12px 16px}
.acts{display:flex;gap:12px;margin-top:22px}
.act{flex:1;height:84px;border:4px solid var(--ink);border-radius:16px;font:inherit;font-weight:900;font-size:22px;cursor:pointer;box-shadow:6px 6px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.act:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.act small{display:block;font-size:12px;font-weight:700;opacity:.75}
.act.u{background:#fff;flex:.7}
.act.h{background:var(--cyan);color:#fff;flex:.7}
.act.go{background:var(--mag);color:#fff;flex:1.3}

/* gauge dial */
.needle{transform-origin:250px 190px;transition:transform .6s cubic-bezier(.2,1.6,.4,1);animation:jit 2.2s ease-in-out infinite}
@keyframes jit{50%{transform:rotate(var(--a2,-49deg))}}
.endlabel{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-weight:900;font-size:28px}
.endlabel small{display:block;font-size:13px;color:#6b6478;font-weight:700}

/* ---------- B ---------- */
.burst{position:absolute;left:62px;top:104px;width:950px;height:878px;pointer-events:none;z-index:7}
.stampB{position:absolute;left:240px;top:360px;z-index:8;transform:rotate(-10deg);background:var(--yel);border:6px solid var(--ink);border-radius:20px;padding:18px 36px;text-align:center;
  box-shadow:10px 10px 0 var(--ink);animation:slam .5s cubic-bezier(.2,1.8,.4,1) both}
.stampB small{display:block;font-size:20px;font-weight:900;letter-spacing:.2em;color:var(--mag)}
.stampB b{display:block;font-size:92px;line-height:1;font-weight:900;color:#fff;text-shadow:5px 5px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink),9px 9px 0 var(--mag);letter-spacing:.06em}
@keyframes slam{0%{transform:rotate(-10deg) scale(2.2);opacity:0}100%{transform:rotate(-10deg) scale(1);opacity:1}}
.conf{position:absolute;width:14px;height:22px;z-index:8;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-60px) rotate(0)}100%{transform:translateY(980px) rotate(720deg)}}
.stars{display:flex;justify-content:center;gap:10px;margin:6px 0 12px}
.stars svg{filter:drop-shadow(4px 4px 0 var(--ink))}
.stars svg:nth-child(2){transform:translateY(-14px) scale(1.2)}
.coll{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ec{border:3px solid var(--ink);border-radius:12px;height:132px;position:relative;overflow:hidden;box-shadow:4px 4px 0 var(--ink)}
.ec span{position:absolute;left:0;right:0;bottom:0;background:var(--ink);color:#fff;font-weight:900;font-size:15px;padding:6px 10px}
.ec span small{color:var(--yel);font-size:11px;margin-left:6px}
.ec.new{box-shadow:0 0 0 5px var(--mag),4px 4px 0 var(--ink);animation:glowc 1.2s ease-in-out infinite}
@keyframes glowc{50%{box-shadow:0 0 0 9px rgba(240,69,125,.35),4px 4px 0 var(--ink)}}
.ec.lock{background:repeating-linear-gradient(45deg,#e4e0ea 0 10px,#d6d1de 10px 20px);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:#9a93a8}
.ec.sm{height:78px}.ec.sm span{font-size:12px;padding:3px 6px}.ec.sm.lock{font-size:28px}
.diff{margin-top:14px;font-size:15px;line-height:1.6;color:#3a3446;background:#fff7d6;border:3px dashed var(--ink);border-radius:12px;padding:10px 14px}
.diff b{color:var(--mag)}

.tabs{position:absolute;right:14px;bottom:12px;z-index:50;display:flex;gap:6px}
.tabs button{font:800 12px/1 "Noto Sans KR",sans-serif;padding:7px 10px;border-radius:8px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
 <defs>
  <pattern id="rain" width="40" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(14)">
    <path d="M6 0 v22 M26 30 v24 M16 10 v10" stroke="#5a7fa8" stroke-width="2.4" stroke-linecap="round"/>
  </pattern>
  <pattern id="tone" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.8" fill="#9aa7bd"/></pattern>
  <pattern id="toneD" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.9" fill="#4e5a78"/></pattern>
  <radialGradient id="blush"><stop offset="0" stop-color="#ff8fa8" stop-opacity=".8"/><stop offset="1" stop-color="#ff8fa8" stop-opacity="0"/></radialGradient>

  <!-- 지호 head -->
  <g id="jiho">
    <path d="M-44 -6 Q-50 -52 -4 -56 Q42 -56 46 -10 L40 10 L-40 10Z" fill="#1f2233"/>
    <ellipse cx="0" cy="6" rx="36" ry="40" fill="#ffe0c9" stroke="#141217" stroke-width="3.5"/>
    <path d="M-42 -2 Q-46 -46 -6 -52 Q34 -56 44 -16 L34 -20 L30 -2 L20 -24 L8 -6 L2 -28 L-10 -4 L-18 -26 L-28 -2 L-32 -18Z" fill="#1f2233" stroke="#141217" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="-14" cy="12" rx="5.5" ry="9" fill="#141217"/><ellipse cx="14" cy="12" rx="5.5" ry="9" fill="#141217"/>
    <circle cx="-12" cy="8" r="2.4" fill="#fff"/><circle cx="16" cy="8" r="2.4" fill="#fff"/>
    <path d="M-6 32 Q0 35 6 32" stroke="#141217" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- 하린 head -->
  <g id="harin">
    <path d="M-50 40 Q-58 -44 0 -56 Q58 -44 50 40 L34 42 Q38 -4 28 -14 L-28 -14 Q-38 -4 -34 42Z" fill="#3a2a38" stroke="#141217" stroke-width="3.5" stroke-linejoin="round"/>
    <ellipse cx="0" cy="6" rx="34" ry="38" fill="#ffe6d6" stroke="#141217" stroke-width="3.5"/>
    <path d="M-38 -4 Q-30 -50 4 -50 Q38 -48 40 -4 Q30 -22 18 -20 L12 -8 L4 -24 L-8 -8 L-14 -22 Q-28 -20 -38 -4Z" fill="#3a2a38" stroke="#141217" stroke-width="3" stroke-linejoin="round"/>
    <rect x="18" y="-30" width="16" height="7" rx="3" fill="#ffd23f" stroke="#141217" stroke-width="2.5" transform="rotate(-20 26 -26)"/>
    <ellipse cx="-13" cy="12" rx="6.5" ry="10" fill="#141217"/><ellipse cx="13" cy="12" rx="6.5" ry="10" fill="#141217"/>
    <circle cx="-11" cy="7" r="3" fill="#fff"/><circle cx="15" cy="7" r="3" fill="#fff"/><circle cx="-15" cy="16" r="1.4" fill="#fff"/><circle cx="11" cy="16" r="1.4" fill="#fff"/>
    <ellipse cx="-22" cy="26" rx="9" ry="5" fill="url(#blush)"/><ellipse cx="22" cy="26" rx="9" ry="5" fill="url(#blush)"/>
    <path d="M-4 32 Q0 30 4 32" stroke="#141217" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- umbrella open -->
  <g id="umb">
    <path d="M-110 0 Q-100 -86 0 -92 Q100 -86 110 0 Q92 -14 74 0 Q56 -14 36 0 Q18 -14 0 0 Q-18 -14 -36 0 Q-56 -14 -74 0 Q-92 -14 -110 0Z" fill="#27b5e6" stroke="#141217" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-74 0 Q-50 -80 0 -92 M74 0 Q50 -80 0 -92 M0 0 V-92" stroke="#141217" stroke-width="3" fill="none"/>
    <path d="M-90 -40 Q-60 -80 -10 -86" stroke="#fff" stroke-width="5" fill="none" opacity=".55" stroke-linecap="round"/>
    <path d="M0 0 V120 Q0 136 -14 134" stroke="#141217" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
 </defs>
</svg>

<div id="stage">

<!-- ================= A ================= -->
<section class="screen" id="a">
  <div class="top">
    <div class="logo">말풍선 퍼즐</div>
    <div class="ep"><b>제 047화</b>우산 하나</div>
    <div class="pills">
      <div class="pill"><span class="ic" style="background:var(--mag)"></span>결말 <span>2 / 4</span></div>
      <div class="pill"><small>이동</small>7</div>
      <div class="pill"><span class="ic" style="background:var(--yel);border:2px solid var(--ink)"></span>힌트 2</div>
    </div>
  </div>

  <div class="page gray" id="pageA"></div>

  <div class="side">
    <div class="card gauge">
      <h4>지금 이 순서면 결말은…</h4>
      <svg width="440" height="200" viewBox="0 -40 500 250" style="display:block;margin:0 auto">
        <path d="M60 190 A190 190 0 0 1 440 190" fill="none" stroke="#141217" stroke-width="44"/>
        <path d="M60 190 A190 190 0 0 1 155 25.5" fill="none" stroke="#9aa7bd" stroke-width="36"/>
        <path d="M155 25.5 A190 190 0 0 1 250 0" fill="none" stroke="#27b5e6" stroke-width="36"/>
        <path d="M250 0 A190 190 0 0 1 345 25.5" fill="none" stroke="#f0457d" stroke-width="36"/>
        <path d="M345 25.5 A190 190 0 0 1 440 190" fill="none" stroke="#d6d1de" stroke-width="36"/>
        <g font-weight="900" font-size="19" fill="#fff" text-anchor="middle" dominant-baseline="middle">
          <text x="98" y="104" transform="rotate(-62 98 104)">엇갈림</text>
          <text x="202" y="6" transform="rotate(-15 202 6)">우정</text>
          <text x="298" y="6" transform="rotate(15 298 6)">고백</text>
          <text x="402" y="104" transform="rotate(62 402 104)" fill="#6b6478">???</text>
        </g>
        <g class="needle" id="needle" style="transform:rotate(-58deg);--a2:-50deg">
          <path d="M246 190 L250 40 L254 190Z" fill="#141217"/>
        </g>
        <circle cx="250" cy="190" r="16" fill="#ffd23f" stroke="#141217" stroke-width="4"/>
      </svg>
      <div class="endlabel" style="position:static;margin-top:4px;font-size:24px">엇갈림 <small style="display:inline;margin-left:6px">— 그는 먼저 빗속으로 간다</small></div>
    </div>

    <div class="card tray">
      <h4>남은 말풍선 · 눌러서 집기</h4>
      <div class="trayin" id="tray">
        <div class="bub" data-t="…고마워." style="left:20px;top:22px;width:150px;height:84px;--tx:30%">…고마워.</div>
        <div class="bub think" data-t="비 그치면 할 말 있어." style="left:196px;top:16px;width:260px;height:96px;--tx:60%;--sk:30deg">비 그치면<br>할 말 있어.</div>
        <div class="bub" data-t="기다릴게." style="left:40px;top:124px;width:160px;height:80px;--tx:55%">기다릴게.</div>
        <div class="bub shout" data-t="금방 올게!" style="left:236px;top:128px;width:190px;height:70px;--tx:20%;opacity:.35">금방 올게!</div>
      </div>
    </div>

    <div class="acts">
      <button class="act u" id="undo">↶<small>되돌리기</small></button>
      <button class="act h" id="hint">?<small>힌트</small></button>
      <button class="act go" id="done">이대로 완성!<small>결말 확인</small></button>
    </div>
    <div class="card" style="margin-top:22px;padding:14px 18px;display:flex;align-items:center;gap:14px">
      <div style="font-weight:900;font-size:15px;line-height:1.35;width:120px">결말 도감<br><span style="color:var(--mag);font-size:26px">2 / 4</span></div>
      <div class="coll mini" id="collA" style="flex:1;grid-template-columns:repeat(4,1fr);gap:8px"></div>
    </div>
  </div>
</section>

<!-- ================= B ================= -->
<section class="screen" id="b">
  <div class="top">
    <div class="logo">말풍선 퍼즐</div>
    <div class="ep"><b>제 047화</b>우산 하나</div>
    <div class="pills">
      <div class="pill"><span class="ic" style="background:var(--mag)"></span>결말 <span>3 / 4</span></div>
      <div class="pill"><small>이동</small>9</div>
      <div class="pill"><small>누적</small>★ 131</div>
    </div>
  </div>

  <div class="page" id="pageB"></div>
  <svg class="burst" viewBox="0 0 950 878" id="burst"></svg>
  <div class="stampB"><small>숨은 결말 발견!</small><b>고 백</b></div>

  <div class="side">
    <div class="card" style="text-align:center;padding-top:14px">
      <h4 style="margin-bottom:18px">047화 클리어</h4>
      <div class="stars" id="stars"></div>
      <div style="font-weight:900;font-size:20px">같은 네 컷, 다른 이야기</div>
      <div class="diff"><b>2컷 ↔ 3컷</b>을 바꾸고 <b>“먼저 갈게.”</b>를 빼자<br>우산은 핑계가 되고, 말은 약속이 되었다.</div>
    </div>
    <div class="card" style="margin-top:22px">
      <h4>결말 도감 · 047화</h4>
      <div class="coll" id="coll"></div>
    </div>
    <div class="acts">
      <button class="act u" id="replay">↻<small>다시</small></button>
      <button class="act go" id="next">다음 화 ▸<small>048화 · 교실 창가</small></button>
    </div>
  </div>
  <div id="confetti"></div>
</section>

</div>

<div class="tabs"><button data-s="a">1 · 배치</button><button data-s="b">2 · 숨은 결말</button></div>

<script>
(function(){
  var stage=document.getElementById('stage');
  function fit(){var s=Math.min(window.innerWidth/1600,window.innerHeight/1000);stage.style.transform='translate(-50%,-50%) scale('+s+')';}
  window.addEventListener('resize',fit);fit();
  function show(k){ if(k!=='a'&&k!=='b')k='a';
    var ss=document.querySelectorAll('.screen');for(var i=0;i<ss.length;i++)ss[i].classList.toggle('on',ss[i].id===k);
    var bs=document.querySelectorAll('.tabs button');for(var j=0;j<bs.length;j++)bs[j].classList.toggle('on',bs[j].getAttribute('data-s')===k);
    if(location.hash!=='#'+k){try{history.replaceState(null,'','#'+k);}catch(e){}}
  }
  var tb=document.querySelectorAll('.tabs button');
  for(var t=0;t<tb.length;t++)tb[t].addEventListener('click',function(){show(this.getAttribute('data-s'));});
  window.addEventListener('keydown',function(e){if(e.key==='1')show('a');if(e.key==='2')show('b');});
  window.addEventListener('hashchange',function(){show(location.hash.slice(1));});

  // ---------- panel art (445x410), drawn in color; screen A shows it as grayscale manga ----------
  var ART={
    1:'<rect width="445" height="410" fill="#cfe3f5"/><rect width="445" height="410" fill="url(#rain)"/>'+
      '<rect y="300" width="445" height="110" fill="#8795a8"/><rect y="300" width="445" height="110" fill="url(#toneD)" opacity=".5"/>'+
      '<path d="M0 300 L445 300" stroke="#141217" stroke-width="4"/>'+
      '<path d="M40 70 L405 50 L405 80 L40 100Z" fill="#f0457d" stroke="#141217" stroke-width="4" stroke-linejoin="round"/>'+
      '<path d="M60 96 V300 M390 78 V300" stroke="#141217" stroke-width="6"/>'+
      '<rect x="300" y="120" width="80" height="120" fill="#fff" stroke="#141217" stroke-width="3"/><text x="340" y="150" font-size="16" font-weight="900" text-anchor="middle" fill="#141217">버스</text><text x="340" y="178" font-size="13" text-anchor="middle" fill="#141217">7 · 12 · 33</text>'+
      '<g transform="translate(140 200) scale(.85)"><path d="M-44 60 Q-40 30 0 28 Q40 30 44 60 L50 190 L-50 190Z" fill="#fff4dc" stroke="#141217" stroke-width="4"/><use href="#harin"/></g>'+
      '<g transform="translate(290 196) scale(.9)"><path d="M-46 60 Q-42 30 0 28 Q42 30 46 60 L52 190 L-52 190Z" fill="#2b3a6b" stroke="#141217" stroke-width="4"/><path d="M-8 32 L0 70 L8 32" fill="#fff" stroke="#141217" stroke-width="3"/><use href="#jiho"/>'+
      '<path d="M50 90 L78 170" stroke="#27b5e6" stroke-width="12" stroke-linecap="round"/><path d="M50 90 L78 170" stroke="#141217" stroke-width="3" fill="none"/></g>'+
      '<g stroke="#fff" stroke-width="3" opacity=".9"><path d="M110 140 l-6 12 M176 136 l6 12"/></g>',
    2:'<rect width="445" height="410" fill="#fff5f8"/>'+
      '<g stroke="#141217" stroke-width="2.2" opacity=".85" id="speed"></g>'+
      '<g transform="translate(222 230) scale(2.3)"><path d="M-46 60 Q-42 40 0 40 Q42 40 46 60 L52 120 L-52 120Z" fill="#2b3a6b" stroke="#141217" stroke-width="2"/><use href="#jiho"/></g>'+
      '<path d="M300 150 q10 -24 20 0 q-10 12 -20 0Z" fill="#9fe0ff" stroke="#141217" stroke-width="3"/>'+
      '<g transform="translate(120 380) rotate(-30)"><rect x="-10" y="-120" width="22" height="130" rx="8" fill="#27b5e6" stroke="#141217" stroke-width="4"/></g>',
    3:'<rect width="445" height="410" fill="#d9e8f5"/><rect width="445" height="410" fill="url(#rain)"/>'+
      '<rect y="310" width="445" height="100" fill="#8795a8"/><path d="M0 310 L445 310" stroke="#141217" stroke-width="4"/>'+
      '<g transform="translate(110 210)"><path d="M-44 60 Q-40 30 0 28 Q40 30 44 60 L50 200 L-50 200Z" fill="#fff4dc" stroke="#141217" stroke-width="4"/><use href="#harin"/></g>'+
      '<g transform="translate(330 214)"><path d="M-46 60 Q-42 30 0 28 Q42 30 46 60 L52 200 L-52 200Z" fill="#2b3a6b" stroke="#141217" stroke-width="4"/><use href="#jiho"/>'+
      '<path d="M-40 80 L-120 60" stroke="#2b3a6b" stroke-width="22" stroke-linecap="round"/><path d="M-40 80 L-120 60" stroke="#141217" stroke-width="4" fill="none"/>'+
      '<g transform="translate(-150 20) rotate(-60) scale(.55)"><use href="#umb"/></g></g>',
    4:'<rect width="445" height="410" fill="#bcd3ea"/><rect width="445" height="410" fill="url(#rain)"/>'+
      '<rect y="290" width="445" height="120" fill="#7d8ba0"/><path d="M0 290 L445 290" stroke="#141217" stroke-width="4"/>'+
      '<g opacity=".6"><ellipse cx="330" cy="330" rx="40" ry="8" fill="#9fe0ff"/><ellipse cx="380" cy="360" rx="26" ry="6" fill="#9fe0ff"/></g>'+
      '<g transform="translate(130 150)"><use href="#umb"/></g>'+
      '<g transform="translate(118 190)"><path d="M-44 60 Q-40 30 0 28 Q40 30 44 60 L50 200 L-50 200Z" fill="#fff4dc" stroke="#141217" stroke-width="4"/><use href="#harin"/></g>'+
      '<g transform="translate(350 210) scale(.72) rotate(8)"><path d="M-46 60 Q-42 30 0 28 Q42 30 46 60 L52 170 L-52 170Z" fill="#2b3a6b" stroke="#141217" stroke-width="5"/>'+
      '<path d="M-30 170 L-60 240 M30 170 L70 230" stroke="#141217" stroke-width="16" stroke-linecap="round"/><g transform="scale(-1 1)"><use href="#jiho"/></g></g>'+
      '<g stroke="#141217" stroke-width="3" stroke-linecap="round"><path d="M410 190 h24 M404 216 h30 M414 242 h20"/></g>'
  };
  // panel positions inside the page (slot order)
  var POS=[[16,16],[481,16],[16,448],[481,448]];
  function bub(p,o){ // o: [x,y,w,h,text,cls,tx,sk]
    return '<div class="bub '+(o[5]||'')+'" style="left:'+(POS[p][0]+o[0])+'px;top:'+(POS[p][1]+o[1])+'px;width:'+o[2]+'px;height:'+o[3]+'px;--tx:'+(o[6]||'40%')+';--sk:'+(o[7]||'-30deg')+'">'+o[4]+'</div>';
  }
  function build(id,order,bubbles,extra){
    var pg=document.getElementById(id),h='';
    for(var i=0;i<4;i++){
      h+='<div class="panel" data-slot="'+i+'" style="left:'+POS[i][0]+'px;top:'+POS[i][1]+'px"><div class="num">'+(i+1)+'</div>'+
         '<svg class="art" viewBox="0 0 445 410">'+ART[order[i]]+'</svg>'+(id==='pageA'?'<div class="swap">⇄ 순서</div>':'')+'</div>';
    }
    for(var b=0;b<bubbles.length;b++)h+=bub(bubbles[b][0],bubbles[b][1]);
    pg.innerHTML=h+(extra||'');
    // speed lines for close-up
    var sp=pg.querySelectorAll('#speed');
    for(var s=0;s<sp.length;s++){var g='';for(var a=0;a<48;a++){var ang=a/48*Math.PI*2,r1=150+(a%3)*18;
      g+='<line x1="'+(222+Math.cos(ang)*r1).toFixed(1)+'" y1="'+(205+Math.sin(ang)*r1).toFixed(1)+'" x2="'+(222+Math.cos(ang)*420).toFixed(1)+'" y2="'+(205+Math.sin(ang)*420).toFixed(1)+'"/>';}
      sp[s].innerHTML=g;sp[s].removeAttribute('id');}
  }
  // A: original order, one empty slot, one bubble being carried
  build('pageA',[1,2,3,4],[
    [0,[20,20,176,78,'비 오네…','','30%']],
    [0,[250,118,170,80,'우산 없어?','','70%','30deg']],
    [1,[26,24,190,90,'?','slot hot','70%','30deg']],
    [2,[190,28,200,86,'같이 쓸래?','','70%','30deg']],
    [3,[230,40,196,84,'?','slot','55%']]
  ],
    '<div class="bub lifted" style="left:640px;top:520px;width:200px;height:86px;--tx:55%">먼저 갈게.</div>'+
    '<svg class="drag-arrow" style="left:0;top:0" width="950" height="878"><path d="M760 600 C 820 600, 860 560, 820 505" stroke="#f0457d" stroke-width="5" stroke-dasharray="10 9" fill="none" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-38" dur=".8s" repeatCount="indefinite"/></path><path d="M808 512 L820 495 L832 514" stroke="#f0457d" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
    '<svg class="drag-arrow" style="left:776px;top:560px" width="60" height="70" viewBox="0 0 70 80"><path d="M20 6 Q28 0 32 10 L34 34 L40 30 Q48 28 50 36 L56 34 Q64 34 64 44 L64 62 Q60 78 40 78 L28 78 Q14 76 10 60 L6 44 Q4 36 12 36 L16 40 Z" fill="#fff" stroke="#141217" stroke-width="4" stroke-linejoin="round"/></svg>'+
    '<div class="sfx" style="left:360px;top:300px;font-size:44px;transform:rotate(-8deg)">쏴아아</div>'
  );
  // B: panels 2 and 3 swapped, new bubbles, full color
  build('pageB',[1,3,2,4],[
    [0,[20,20,176,78,'비 오네…','','30%']],
    [0,[250,118,170,80,'우산 없어?','','70%','30deg']],
    [1,[170,26,160,80,'이거 써.','','70%','30deg']],
    [2,[20,22,250,96,'비 그치면<br>할 말 있어.','think','70%','30deg']],
    [3,[20,24,170,80,'기다릴게.','','40%']],
    [3,[236,40,190,74,'금방 올게!','shout','55%']]
  ],'<div class="sfx" style="left:600px;top:700px;font-size:40px;transform:rotate(10deg);color:#ffd23f">타다닷</div>');

  // burst lines + hearts behind the stamp (B)
  var bu=document.getElementById('burst'),g='';
  for(var i=0;i<36;i++){var a=i/36*Math.PI*2;g+='<path d="M'+(475+Math.cos(a)*160).toFixed(1)+' '+(470+Math.sin(a)*120).toFixed(1)+' L'+(475+Math.cos(a+.05)*700).toFixed(1)+' '+(470+Math.sin(a+.05)*700).toFixed(1)+' L'+(475+Math.cos(a-.03)*700).toFixed(1)+' '+(470+Math.sin(a-.03)*700).toFixed(1)+'Z" fill="'+(i%2?'rgba(255,210,63,.42)':'rgba(255,255,255,.4)')+'"/>';}
  bu.innerHTML=g;

  // stars
  var star='<svg width="64" height="64" viewBox="0 0 24 24"><path d="M12 1.8l3 6.4 7 .8-5.2 4.8 1.4 6.9L12 17.3l-6.2 3.4 1.4-6.9L2 9l7-.8z" fill="#ffd23f" stroke="#141217" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  document.getElementById('stars').innerHTML=star+star+star;

  // ending collection
  var coll=[['엇갈림','#9aa7bd',4,'',''],['우정','#27b5e6',3,'',''],['고백','#f0457d',4,'new','NEW'],['???','',0,'lock','']];
  var ch='';
  for(var c=0;c<coll.length;c++){var e=coll[c];
    if(e[3]==='lock'){ch+='<div class="ec lock">?</div>';continue;}
    ch+='<div class="ec '+e[3]+'" style="background:'+e[1]+'"><svg viewBox="0 0 445 410" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;position:absolute;inset:0;'+(e[3]?'':'filter:grayscale(.5)')+'">'+ART[e[2]]+'</svg><span>'+e[0]+(e[4]?'<small>'+e[4]+'</small>':'')+'</span></div>';}
  document.getElementById('coll').innerHTML=ch;
  var cA=[['엇갈림',4],['우정',3],['',0],['',0]],hA='';
  for(var m=0;m<4;m++){ if(!cA[m][1]){hA+='<div class="ec sm lock">?</div>';continue;}
    hA+='<div class="ec sm"><svg viewBox="0 0 445 410" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;position:absolute;inset:0;filter:grayscale(1)">'+ART[cA[m][1]]+'</svg><span>'+cA[m][0]+'</span></div>';}
  document.getElementById('collA').innerHTML=hA;

  // confetti (deterministic)
  var seed=47;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
  var cf=document.getElementById('confetti'),cols=['#f0457d','#27b5e6','#ffd23f','#4fd1a5','#fff'];
  for(var k=0;k<46;k++){var d=document.createElement('i');d.className='conf';d.style.left=(40+rnd()*1500)+'px';d.style.top=(rnd()*900-100)+'px';
    d.style.background=cols[k%cols.length];d.style.border='2px solid #141217';d.style.animationDuration=(4+rnd()*4)+'s';d.style.animationDelay=(-rnd()*8)+'s';
    if(k%3===0){d.style.borderRadius='50%';d.style.width='16px';d.style.height='16px';}cf.appendChild(d);}

  // ---------- audio: only on interaction ----------
  var AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}return AC;}
  function blip(f1,f2,dur,type){var c=ac();if(!c)return;var t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=type||'square';
    o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+dur+.05);
    o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.08);}
  function fanfare(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){blip(f,f*1.01,.16,'triangle');},i*110);});}

  // ---------- interaction (A): pick a tray bubble, place in slot; swap panels ----------
  var held=null;
  var trayB=document.querySelectorAll('#tray .bub');
  for(var q=0;q<trayB.length;q++)trayB[q].addEventListener('click',function(){
    for(var z=0;z<trayB.length;z++)trayB[z].classList.remove('lifted');this.classList.add('lifted');held=this;blip(420,900,.08);});
  var slots=document.querySelectorAll('#pageA .bub.slot');
  for(var s2=0;s2<slots.length;s2++)slots[s2].addEventListener('click',function(){
    if(!held){blip(200,140,.12);return;}
    this.className='bub pop';this.innerHTML=held.innerHTML;held.style.visibility='hidden';held.classList.remove('lifted');held=null;blip(600,1200,.1,'triangle');
    var n=document.getElementById('needle');n.style.animation='none';n.style.transform='rotate(38deg)';
    var el=document.querySelector('#a .endlabel');if(el)el.innerHTML='고백? <small style="display:inline;margin-left:6px">— 무언가 달라지고 있다</small>';});
  var sw=document.querySelectorAll('#pageA .swap');
  for(var w=0;w<sw.length;w++)sw[w].addEventListener('click',function(){var p=this.parentNode;p.classList.toggle('moving');blip(300,500,.1);});
  document.getElementById('done').addEventListener('click',function(){fanfare();setTimeout(function(){show('b');},450);});
  document.getElementById('hint').addEventListener('click',function(){blip(880,660,.2,'sine');var sl=document.querySelector('#pageA .bub.slot');if(sl)sl.classList.add('hot');});
  document.getElementById('undo').addEventListener('click',function(){blip(500,250,.12);});
  document.getElementById('next').addEventListener('click',fanfare);
  document.getElementById('replay').addEventListener('click',function(){blip(500,250,.12);show('a');});

  show((location.hash||'#a').slice(1));
})();
