<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>빛이 닿지 않는 것</title>
<style>
html,body{margin:0;height:100%;background:#030405;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:1000px;margin:-500px 0 0 -800px;transform-origin:50% 50%;overflow:hidden;background:#05070a;
  font-family:"Nanum Myeongjo","Noto Serif KR","Batang",serif;color:#d9d3c4}
.screen{position:absolute;inset:0;display:none}.screen.on{display:block}
.canvas-tex{position:absolute;inset:0;pointer-events:none;z-index:20;opacity:.22;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.55 .9' numOctaves='3' seed='7'/><feColorMatrix values='0 0 0 0 .8 0 0 0 0 .78 0 0 0 0 .7 0 0 0 1 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
.vig{position:absolute;inset:0;pointer-events:none;z-index:19;background:radial-gradient(ellipse 58% 62% at 45% 52%,rgba(0,0,0,0) 30%,rgba(0,0,0,.8) 100%)}
.who{animation:breath 5.2s ease-in-out infinite;transform-origin:650px 760px;transition:opacity 1.6s ease}
@keyframes breath{0%,100%{transform:scale(1,1)}45%{transform:scale(1.006,1.012)}}
.lit .who{opacity:0;transition:opacity .35s ease}
.beamA{opacity:0;transition:opacity .15s}
.lit .beamA{opacity:1}
.speech{position:absolute;left:0;right:0;bottom:92px;text-align:center;z-index:30}
.speech .l{font-size:27px;line-height:44px;color:#cfd6dc;text-shadow:0 0 20px rgba(0,0,0,.9);letter-spacing:.5px}
.speech .s{font-size:13px;letter-spacing:7px;color:#5d6b76;margin-top:14px}
.corner{position:absolute;z-index:30;font-size:13px;letter-spacing:4px;color:#5d6b76}
.corner b{display:block;font-weight:400;font-size:22px;letter-spacing:3px;color:#aeb8c0;margin-top:8px}
.breathline{position:absolute;left:60px;bottom:60px;z-index:30}
.hold{position:absolute;right:60px;bottom:60px;z-index:30;text-align:right;font-size:13px;letter-spacing:4px;color:#5d6b76}
.hold .btn{display:inline-flex;align-items:center;gap:10px;margin-top:10px;padding:10px 16px;border:1px solid #3a4550;color:#aeb8c0;font-size:15px;letter-spacing:2px;cursor:pointer;background:rgba(10,14,18,.6)}
.hold .btn i{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #aeb8c0}
.lit .hold .btn{border-color:#e9c98a;color:#f5e2b8;box-shadow:0 0 20px rgba(233,201,138,.3)}
.lit .hold .btn i{background:#f5e2b8;border-color:#f5e2b8;box-shadow:0 0 10px #f5e2b8}
.mote{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff1cc;opacity:0;animation:mote 7s linear infinite;z-index:12}
@keyframes mote{0%{opacity:0;transform:translate(0,0)}20%{opacity:.8}100%{opacity:0;transform:translate(-40px,120px)}}
.ash{position:absolute;width:3px;height:3px;border-radius:50%;background:#8ea3b4;opacity:0;animation:ash 3.4s ease-out infinite;z-index:13}
@keyframes ash{0%{opacity:.9;transform:translate(0,0)}100%{opacity:0;transform:translate(-90px,-60px)}}
.tabs{position:absolute;right:16px;top:12px;z-index:60;display:flex;gap:6px}
.tab{font:12px/1 "DejaVu Sans",sans-serif;color:#aeb8c0;background:rgba(10,14,18,.8);border:1px solid #2a333c;padding:6px 10px;cursor:pointer}
.tab.on{background:#d9d3c4;color:#0a0d10}
</style>
</head>
<body>
<div id="stage">
 <div class="tabs"><div class="tab" data-s="a">1 · 어둠 속</div><div class="tab" data-s="b">2 · 비춘 순간</div></div>

 <svg width="0" height="0" style="position:absolute"><defs>
  <filter id="paint" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".018 .03" numOctaves="3" seed="4" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="10" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="brush" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".05 .012" numOctaves="2" seed="2" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="16" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="1.2"/></filter>
  <filter id="blur30"><feGaussianBlur stdDeviation="30"/></filter>
  <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
  <linearGradient id="wallA" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#070a0d"/><stop offset=".6" stop-color="#0e1519"/><stop offset="1" stop-color="#16222a"/></linearGradient>
  <linearGradient id="floorA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1013"/><stop offset="1" stop-color="#040607"/></linearGradient>
  <linearGradient id="winLight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b6d7a"/><stop offset="1" stop-color="#2a3842"/></linearGradient>
  <linearGradient id="wallB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#05070a"/><stop offset=".6" stop-color="#0b1114"/><stop offset="1" stop-color="#121b21"/></linearGradient>
  <radialGradient id="beam" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff0cc" stop-opacity=".95"/><stop offset=".45" stop-color="#e8c48a" stop-opacity=".6"/><stop offset="1" stop-color="#b98a4a" stop-opacity="0"/></radialGradient>
  <radialGradient id="rim" cx="100%" cy="40%" r="80%"><stop offset="0" stop-color="#6f8596" stop-opacity=".9"/><stop offset=".35" stop-color="#1b252c" stop-opacity=".9"/><stop offset="1" stop-color="#030506"/></radialGradient>
 </defs></svg>

 <section class="screen" id="sa">
  <svg id="roomA" width="1600" height="1000" viewBox="0 0 1600 1000" style="position:absolute;inset:0"></svg>
  <div class="vig"></div><div class="canvas-tex"></div>
  <div class="corner" style="left:60px;top:48px">방 하나 · 밤 · 세 번째 방문<b>그녀는 불을 켜지 않으면 거기 있다</b></div>
  <div class="corner" style="right:60px;top:48px;text-align:right">거리<b>세 걸음</b></div>
  <div class="speech"><div class="l">"…불 켜지 마. 오늘은 얼굴 말고, 목소리로 기억해 줘."</div><div class="s">숨소리가 들리는 쪽으로 · 천천히</div></div>
  <svg class="breathline" width="360" height="60" viewBox="0 0 360 60"><text x="0" y="12" font-size="12" letter-spacing="4" fill="#5d6b76" font-family="Noto Sans KR,sans-serif">그녀의 숨</text><path id="bl" d="" fill="none" stroke="#aeb8c0" stroke-width="1.6" opacity=".8"/></svg>
  <div class="hold">손전등<br><span class="btn" id="holdBtn"><i></i>누르고 있으면 켜진다</span></div>
 </section>

 <section class="screen" id="sb">
  <svg id="roomB" width="1600" height="1000" viewBox="0 0 1600 1000" style="position:absolute;inset:0"></svg>
  <div id="motes"></div><div id="ashes"></div>
  <div class="vig" style="background:radial-gradient(ellipse 50% 55% at 42% 55%,rgba(0,0,0,0) 30%,rgba(0,0,0,.88) 100%)"></div><div class="canvas-tex"></div>
  <div class="corner" style="left:60px;top:48px">방 하나 · 밤 · 세 번째 방문<b style="color:#f0dcb0">비추는 순간, 없었다</b></div>
  <div class="corner" style="right:60px;top:48px;text-align:right">그녀를 본 시간<b style="color:#f0dcb0">0.4초</b></div>
  <div class="speech"><div class="l" style="color:#efe0c0">의자는 아직 따뜻하다. 숄이 반쯤 흘러내려 있다.</div><div class="s" style="color:#8a7a5a">잃은 것 · 목소리 한 줄 &nbsp;·&nbsp; 남은 것 · 온기 · 숄 · 찻잔</div></div>
  <div class="hold" style="color:#8a7a5a">손전등<br><span class="btn" style="border-color:#e9c98a;color:#f5e2b8;box-shadow:0 0 20px rgba(233,201,138,.3)"><i style="background:#f5e2b8;border-color:#f5e2b8"></i>켜짐 · 놓으면 어둠이 돌아온다</span></div>
 </section>
</div>
<script>
(function(){
 var st=document.getElementById('stage');
 function fit(){var s=Math.min(window.innerWidth/1600,window.innerHeight/1000);st.style.transform='scale('+s+')';}
 window.addEventListener('resize',fit);fit();
 function show(id){var ss=document.querySelectorAll('.screen'),i;for(i=0;i<ss.length;i++){ss[i].classList.toggle('on',ss[i].id==='s'+id);}
  var ts=document.querySelectorAll('.tab');for(i=0;i<ts.length;i++){ts[i].classList.toggle('on',ts[i].getAttribute('data-s')===id);}
  try{if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);}catch(e){}}
 function fromHash(){show(location.hash==='#b'?'b':'a');}
 window.addEventListener('hashchange',fromHash);
 var tabs=document.querySelectorAll('.tab');for(var t=0;t<tabs.length;t++){tabs[t].addEventListener('click',function(){show(this.getAttribute('data-s'));});}
 fromHash();

 function room(lit){var s='';
  s+='<g filter="url(#paint)">';
  s+='<rect width="1600" height="730" fill="url(#'+(lit?'wallB':'wallA')+')"/>';
  /* wainscot */
  s+='<rect y="600" width="1600" height="130" fill="#0a0f12"/><rect y="596" width="1600" height="6" fill="#1a242b"/>';
  for(var p=0;p<9;p++){s+='<rect x="'+(40+p*180)+'" y="618" width="150" height="92" fill="none" stroke="#141c21" stroke-width="3"/>';}
  s+='<rect y="730" width="1600" height="270" fill="url(#floorA)"/>';
  for(var b=0;b<14;b++){var x0=-200+b*150;s+='<line x1="'+(x0+ (x0-800)*0.25)+'" y1="1000" x2="'+x0+'" y2="730" stroke="#030405" stroke-width="3" opacity=".8"/>';}
  /* tall window */
  s+='<rect x="1060" y="110" width="260" height="480" fill="url(#winLight)" opacity="'+(lit?.55:1)+'"/>';
  s+='<g stroke="#0b1115" stroke-width="12" fill="none"><rect x="1060" y="110" width="260" height="480"/><line x1="1190" y1="110" x2="1190" y2="590"/><line x1="1060" y1="270" x2="1320" y2="270"/><line x1="1060" y1="430" x2="1320" y2="430"/></g>';
  s+='<path d="M1030 90 C1050 300 1020 500 1045 640 L1000 640 C990 460 1010 260 990 90 Z" fill="#0d1417"/><path d="M1350 90 C1330 300 1360 500 1335 640 L1390 640 C1400 460 1375 260 1395 90 Z" fill="#0d1417"/>';
  /* moon/streetlight spill on floor */
  s+='<polygon points="1060,740 1320,740 1180,990 780,990" fill="#6c8190" opacity="'+(lit?.05:.16)+'" filter="url(#blur8)"/>';
  /* small table + cup */
  s+='<rect x="860" y="600" width="120" height="14" fill="#141b20"/><rect x="872" y="614" width="10" height="170" fill="#0c1114"/><rect x="958" y="614" width="10" height="170" fill="#0c1114"/>';
  s+='<path d="M900 582 L940 582 L936 600 L904 600 Z" fill="'+(lit?'#d9ccb2':'#1d272e')+'"/><path d="M940 586 Q952 590 940 596" fill="none" stroke="'+(lit?'#d9ccb2':'#1d272e')+'" stroke-width="3"/>';
  /* armchair */
  var ch=lit?'#6a4a2e':'#1f2b31',ch2=lit?'#4a321e':'#131b20',ch3=lit?'#8a6440':'#2a3940';
  s+='<path d="M540 420 C540 380 600 360 660 360 C720 360 790 380 790 420 L800 640 L530 640 Z" fill="'+ch+'"/>';
  s+='<path d="M500 540 C500 510 540 500 560 520 L570 700 L505 700 Z" fill="'+ch3+'"/><path d="M770 520 C790 500 830 510 830 540 L826 700 L760 700 Z" fill="'+ch2+'"/>';
  s+='<path d="M550 610 L790 610 L800 700 L540 700 Z" fill="'+ch3+'"/>';
  s+='<rect x="520" y="700" width="16" height="70" fill="'+ch2+'"/><rect x="800" y="700" width="16" height="70" fill="'+ch2+'"/>';
  if(lit){ /* dent in the cushion + shawl slipping off */
   s+='<ellipse cx="665" cy="628" rx="88" ry="14" fill="#3a2716" opacity=".8"/>';
   s+='<path d="M740 410 C780 420 800 470 792 560 C788 610 810 660 800 720 C780 730 760 700 766 650 C772 600 752 520 730 470 Z" fill="#8f3a2a"/>';
   s+='<path d="M745 420 C770 440 780 500 776 560" fill="none" stroke="#c46a4a" stroke-width="3" opacity=".6"/>';
   for(var fr=0;fr<7;fr++){s+='<line x1="'+(770+fr*5)+'" y1="720" x2="'+(768+fr*5)+'" y2="742" stroke="#8f3a2a" stroke-width="2"/>';}
  }
  s+='</g>';
  /* the one who is only in the dark */
  if(!lit){
   s+='<g class="who" id="who"><g filter="url(#brush)">';
   var body='M636 426 C612 440 600 480 598 530 C596 560 598 578 606 598 C612 614 626 618 646 618 L756 614 C762 660 764 720 766 756 L762 770 L816 772 L812 760 L790 756 C790 700 792 640 790 600 C788 580 776 570 756 570 L700 568 C704 540 704 500 696 470 C690 446 684 432 676 426 Z';
   s+='<path d="'+body+'" fill="#020304"/>';
   s+='<ellipse cx="662" cy="380" rx="29" ry="36" fill="#020304"/><circle cx="632" cy="362" r="17" fill="#020304"/><rect x="648" y="405" width="24" height="26" fill="#020304"/>';
   s+='<path d="M640 350 C622 380 616 420 624 452 L640 440 C636 410 640 380 650 360 Z" fill="#020304"/>';
   s+='<path d="M662 446 C650 490 648 520 664 546 C690 566 720 572 748 574" fill="none" stroke="#020304" stroke-width="17" stroke-linecap="round"/>';
   s+='</g>';
   s+='<g fill="none" stroke="#a9c0d2" stroke-linecap="round" filter="url(#brush)">';
   s+='<path d="M680 352 C690 364 692 380 690 392 C694 398 692 404 686 408 C684 414 680 418 674 420" stroke-width="2.4" opacity=".8"/>';
   s+='<path d="M678 430 C690 444 698 466 702 500 C704 530 702 552 700 566" stroke-width="2" opacity=".55"/>';
   s+='<path d="M760 571 C780 574 790 586 791 606 C792 650 790 700 791 754 L814 762" stroke-width="2" opacity=".5"/>';
   s+='<path d="M652 346 C660 342 672 344 680 352" stroke-width="1.6" opacity=".6"/>';
   s+='</g>';
   s+='<ellipse cx="712" cy="396" rx="18" ry="8" fill="#c9d6e0" opacity=".06" filter="url(#blur8)"><animate attributeName="opacity" values="0;.12;0" dur="5.2s" repeatCount="indefinite"/><animate attributeName="cx" values="704;724;704" dur="5.2s" repeatCount="indefinite"/></ellipse>';
   s+='</g>';
   /* beam used while holding */
   s+='<g class="beamA"><ellipse cx="660" cy="520" rx="240" ry="260" fill="url(#beam)" opacity=".75" style="mix-blend-mode:screen"/></g>';
  } else {
   s+='<ellipse cx="660" cy="520" rx="280" ry="300" fill="url(#beam)" opacity=".55" style="mix-blend-mode:screen"/>';
   s+='<ellipse cx="660" cy="520" rx="130" ry="140" fill="#fff4d8" opacity=".18" filter="url(#blur30)"/>';
   /* afterimage: negative outline dissolving at the beam edge */
   s+='<g opacity=".5" filter="url(#brush)"><path d="M636 426 C612 440 600 480 598 530 C596 560 598 578 606 598 C612 614 626 618 646 618 L756 614 C762 660 764 720 766 756 M790 756 C790 700 792 640 790 600 C788 580 776 570 756 570 L700 568 C704 540 704 500 696 470" fill="none" stroke="#9fb4c4" stroke-width="2" stroke-dasharray="3 9"><animate attributeName="opacity" values=".9;.1;.9" dur="3.4s" repeatCount="indefinite"/></path>';
   s+='<ellipse cx="662" cy="380" rx="29" ry="36" fill="none" stroke="#9fb4c4" stroke-width="2" stroke-dasharray="2 10"><animate attributeName="opacity" values=".7;0;.7" dur="3.4s" repeatCount="indefinite"/></ellipse></g>';
  }
  return s;}
 document.getElementById('roomA').innerHTML=room(false);
 document.getElementById('roomB').innerHTML=room(true);
 /* motes in beam, ash drifting away from where she was */
 var m='';for(var i=0;i<34;i++){m+='<div class="mote" style="left:'+(470+Math.random()*380).toFixed(0)+'px;top:'+(300+Math.random()*420).toFixed(0)+'px;animation-delay:'+(Math.random()*7).toFixed(2)+'s"></div>';}document.getElementById('motes').innerHTML=m;
 var a='';for(var j=0;j<28;j++){a+='<div class="ash" style="left:'+(560+Math.random()*180).toFixed(0)+'px;top:'+(350+Math.random()*260).toFixed(0)+'px;animation-delay:'+(Math.random()*3.4).toFixed(2)+'s"></div>';}document.getElementById('ashes').innerHTML=a;
 /* breath line */
 var tk=0,lit=false;
 setInterval(function(){tk++;var d='';for(var x=0;x<=360;x+=4){var ph=(x+tk*3)/60;var amp=lit?0.5:14*Math.max(0,Math.sin(ph))*Math.max(0,Math.sin(ph*0.5+1));d+=(x?'L':'M')+x+' '+(40-amp).toFixed(1);}
  var bl=document.getElementById('bl');if(bl)bl.setAttribute('d',d);},60);
 /* hold to light: she disappears; release: she slowly returns */
 var sa=document.getElementById('sa'),ac=null,bg=null;
 function startAudio(){if(ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;return;}
  var len=ac.sampleRate*2,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
  var s=ac.createBufferSource();s.buffer=b;s.loop=true;var f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=700;f.Q.value=.7;bg=ac.createGain();bg.gain.value=0;s.connect(f);f.connect(bg);bg.connect(ac.destination);s.start();
  var lfo=ac.createOscillator();lfo.frequency.value=.2;var lg=ac.createGain();lg.gain.value=.03;lfo.connect(lg);lg.connect(bg.gain);lfo.start();bg.gain.value=.03;}
 function setLit(v){lit=v;sa.classList.toggle('lit',v);if(ac&&bg){bg.gain.cancelScheduledValues(ac.currentTime);bg.gain.setTargetAtTime(v?0:.03,ac.currentTime,v?.05:1.2);
   if(v){var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=1200;o.type='square';g.gain.setValueAtTime(.03,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.04);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.05);}}}
 sa.addEventListener('mousedown',function(){startAudio();setLit(true);});
 window.addEventListener('mouseup',function(){setLit(false);});
 document.addEventListener('keydown',function(e){if(e.key==='1')show('a');else if(e.key==='2')show('b');else if(e.key===' '){startAudio();setLit(true);}});
 document.addEventListener('keyup',function(e){if(e.key===' ')setLit(false);});
})();
</script>
</body>
</html>
