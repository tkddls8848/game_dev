<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한 사람의 유품</title>
<style>
:root{
  --honey:#f1d39a; --floor:#7b5b3e; --floor-d:#4a3526; --ash:#3a2c24; --paper:#f5eddc; --paper-d:#e3d6bb;
  --ink:#3b2f27; --ink-soft:#7a6a5a; --thread:#c9a36a; --glow:#ffe4a8;
  --blue:#243049; --moon:#c9cfe6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#050505;overflow:hidden}
body{font-family:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;color:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:1000px;overflow:hidden;transform-origin:50% 50%;background:var(--floor-d)}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
.sans{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}

/* floor planks */
.floor{position:absolute;inset:0;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 2px, transparent 2px 148px),
    repeating-linear-gradient(90deg, transparent 0 60px, rgba(255,255,255,.025) 60px 100px, transparent 100px 148px),
    linear-gradient(180deg,#8a6746,#6f5037 55%,#5a412d);}
.floor::after{content:"";position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='148' height='600'><filter id='w'><feTurbulence type='fractalNoise' baseFrequency='.012 .35' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .18  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23w)'/></svg>");}
.planks-y{position:absolute;inset:0;background:
  linear-gradient(180deg,transparent 0 310px,rgba(0,0,0,.25) 310px 312px,transparent 312px) 0 0/148px 1000px,
  linear-gradient(180deg,transparent 0 720px,rgba(0,0,0,.25) 720px 722px,transparent 722px) 74px 0/148px 1000px;opacity:.8}
/* window light */
.shafts{position:absolute;inset:-200px;pointer-events:none;mix-blend-mode:screen;transform:rotate(-24deg) translate(260px,-120px);
  background:repeating-linear-gradient(90deg, transparent 0 60px, rgba(255,220,150,.20) 60px 170px, rgba(255,220,150,.08) 170px 180px, transparent 180px 230px);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 25%,#000 60%,transparent 90%);mask-image:linear-gradient(180deg,transparent 0,#000 25%,#000 60%,transparent 90%);
  animation:sway 12s ease-in-out infinite}
@keyframes sway{50%{opacity:.75;transform:rotate(-23deg) translate(270px,-120px)}}
.warm{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 55% at 62% 38%,rgba(255,210,140,.28),transparent 70%)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.2;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 55% 42%,transparent 45%,rgba(20,10,5,.7))}
.motes{position:absolute;inset:0;pointer-events:none}
.motes i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,236,190,.85);box-shadow:0 0 6px rgba(255,220,150,.9);animation:mote linear infinite}
@keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}85%{opacity:.7}100%{transform:translate(40px,-120px);opacity:0}}

/* boxes */
.stack{position:absolute;left:40px;top:90px;width:360px;height:560px}
.cb{position:absolute;border-radius:3px;background:linear-gradient(135deg,#caa574,#a98052 60%,#8b6540);box-shadow:0 18px 22px rgba(20,10,5,.5),inset 0 0 0 1px rgba(0,0,0,.12)}
.cb::before{content:"";position:absolute;left:0;right:0;top:46%;height:12%;background:rgba(222,206,164,.8)}
.cb .n{position:absolute;left:12px;top:10px;font-size:22px;color:#4a3322;font-weight:700;opacity:.8;font-family:"Nanum Pen Script",cursive,serif}
.cb .n small{font-size:14px}

/* open box top-down */
.openbox{position:absolute;left:520px;top:150px;width:520px;height:440px;filter:drop-shadow(0 28px 26px rgba(20,10,5,.6))}
.item{position:absolute;cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .35s}
.item:hover{transform:translate(0,-8px) rotate(var(--r)) scale(1.04)!important;filter:drop-shadow(0 22px 16px rgba(20,10,5,.55)) brightness(1.06)}
.whisper{position:absolute;font-style:italic;color:#fff3dc;font-size:19px;letter-spacing:.04em;text-shadow:0 1px 10px rgba(60,30,10,.8);opacity:.92;animation:breath 4.5s ease-in-out infinite}
.whisper::before{content:"";position:absolute;left:-22px;top:50%;width:14px;height:1px;background:rgba(255,243,220,.7)}
@keyframes breath{50%{opacity:.55}}

/* held item */
.held{position:absolute;left:650px;top:600px;transform:rotate(-8deg);filter:drop-shadow(18px 34px 18px rgba(20,10,5,.55));animation:float 3s ease-in-out infinite;z-index:6}
@keyframes float{50%{transform:rotate(-6deg) translateY(-6px)}}
.hand{position:absolute;left:760px;top:640px;z-index:7;pointer-events:none}

/* timeline */
.tl{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(180deg,transparent,rgba(30,18,10,.55) 35%,rgba(22,13,8,.86));}
.thread{position:absolute;left:100px;right:100px;top:168px;height:2px;background:linear-gradient(90deg,rgba(201,163,106,.2),var(--thread) 10%,var(--thread) 90%,rgba(201,163,106,.2));box-shadow:0 0 8px rgba(255,210,140,.35)}
.yr{position:absolute;font-size:14px;color:#d8c4a2;letter-spacing:.06em;text-shadow:0 1px 4px #000}
.yr.dim{color:#8d7a62}
.slot{position:absolute;width:86px;height:98px;transform:translateX(-50%);border-radius:2px;cursor:pointer;transition:transform .25s}
.slot:hover{transform:translateX(-50%) translateY(-4px)}
.slot .pin{position:absolute;left:50%;width:1px;background:rgba(201,163,106,.7)}
.pol{position:absolute;inset:0;background:var(--paper);padding:6px 6px 22px;box-shadow:0 8px 14px rgba(0,0,0,.5)}
.pol svg{display:block;width:100%;height:100%;background:#d9cdb5}
.pol span{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:11px;color:var(--ink-soft)}
.slot.empty .pol{background:transparent;border:1.5px dashed rgba(233,210,170,.45);box-shadow:none}
.slot.empty .pol::after{content:"?";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(233,210,170,.5);font-size:26px}
.slot.target .pol{border:2px solid #ffe4a8;box-shadow:0 0 0 4px rgba(255,228,168,.18),0 0 30px rgba(255,220,150,.55);animation:tg 1.4s ease-in-out infinite}
.slot.target .pol::after{content:"";}
@keyframes tg{50%{box-shadow:0 0 0 8px rgba(255,228,168,.08),0 0 44px rgba(255,220,150,.75)}}
.placed{animation:settle .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes settle{0%{transform:translateX(-50%) translateY(-60px) rotate(-8deg);opacity:0}100%{transform:translateX(-50%)}}

.hudTL{position:absolute;left:48px;top:36px;color:#fff1d8;text-shadow:0 2px 12px rgba(40,20,5,.7);z-index:5}
.hudTL .t{font-size:15px;letter-spacing:.35em;opacity:.8}
.hudTL .n{font-size:44px;font-weight:300;letter-spacing:.05em;margin-top:2px}
.hudTL .n b{font-weight:700}
.hudTL .bar{display:flex;gap:4px;margin-top:10px}
.hudTL .bar i{width:10px;height:4px;background:rgba(255,241,216,.25)}
.hudTL .bar i.o{background:#ffe4a8;box-shadow:0 0 6px rgba(255,220,150,.8)}
.hudTR{position:absolute;right:48px;top:40px;text-align:right;color:#fff1d8;font-size:16px;line-height:1.7;opacity:.85;text-shadow:0 2px 10px rgba(40,20,5,.8);z-index:5}
.hudTR .k{display:inline-block;border:1px solid rgba(255,241,216,.5);padding:0 7px;border-radius:3px;font-size:12px;margin-right:6px;font-family:"Noto Sans KR",sans-serif}
.tlhead{position:absolute;left:100px;top:-26px;color:#e9d7b6;font-size:15px;letter-spacing:.3em}
.tlhead b{font-weight:400;color:#fff4de;font-size:20px;letter-spacing:.12em;margin-right:12px}
.guide{position:absolute;pointer-events:none;z-index:5}

/* ---------- B : blue hour ---------- */
#b .floor{background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.35) 0 2px, transparent 2px 148px),
    linear-gradient(180deg,#3c4458,#2b3244 55%,#20263a);}
#b .floor::after{opacity:.28}
#b .shafts{background:repeating-linear-gradient(90deg, transparent 0 60px, rgba(190,200,255,.10) 60px 170px, rgba(190,200,255,.04) 170px 180px, transparent 180px 230px);animation:none}
#b .warm{background:radial-gradient(ellipse 22% 26% at 50% 44%,rgba(255,208,140,.30),transparent 70%)}
#b .vig{background:radial-gradient(ellipse 70% 65% at 50% 45%,transparent 35%,rgba(5,8,18,.82))}
#b .motes i{background:rgba(210,220,255,.7);box-shadow:0 0 6px rgba(180,200,255,.8)}
.ghostmark{position:absolute;border:1px solid rgba(200,210,240,.10);background:rgba(0,0,0,.12);border-radius:2px}
.lastbox{position:absolute;left:600px;top:250px;width:400px;height:320px;filter:drop-shadow(0 26px 30px rgba(0,0,0,.7))}
.keytag{position:absolute;left:760px;top:330px;transform:rotate(-10deg);cursor:pointer;z-index:4}
.keytag .glint{position:absolute;left:40px;top:40px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 18px 8px rgba(255,230,170,.8);animation:gl 3.2s ease-in-out infinite}
@keyframes gl{0%,70%,100%{opacity:0;transform:scale(.4)}80%{opacity:1;transform:scale(1)}}
.name{position:absolute;left:0;right:0;top:596px;text-align:center;color:#f6ecd8;z-index:5;text-shadow:0 2px 20px rgba(0,0,0,.9)}
.name .nm{font-size:64px;letter-spacing:.5em;font-weight:300;margin-right:-.5em;animation:rise 3s ease-out both}
.name .yy{font-size:18px;letter-spacing:.4em;color:#c9cfe6;margin-top:4px}
@keyframes rise{from{letter-spacing:.8em}}
#b .tl{background:linear-gradient(180deg,transparent,rgba(8,10,20,.55) 35%,rgba(6,8,16,.9))}
#b .thread{height:3px;background:linear-gradient(90deg,rgba(255,220,150,.2),#ffe0a0 8%,#ffe0a0 92%,rgba(255,220,150,.2));box-shadow:0 0 14px rgba(255,210,140,.8),0 0 40px rgba(255,210,140,.35);animation:thr 4s ease-in-out infinite}
@keyframes thr{50%{box-shadow:0 0 8px rgba(255,210,140,.6),0 0 24px rgba(255,210,140,.2)}}
#b .pol{background:#e9e2d2}
.epi{position:absolute;right:48px;top:40px;text-align:right;color:#c9cfe6;font-size:16px;line-height:1.8;z-index:5}
.epi b{color:#f6ecd8;font-weight:400}

.tabs{position:absolute;right:14px;bottom:12px;z-index:50;display:flex;gap:6px}
.tabs button{font:600 12px/1 "Noto Sans KR",sans-serif;padding:7px 10px;border-radius:3px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.5);color:#ddd;cursor:pointer}
.tabs button.on{background:#f1d39a;color:#2a1c10;border-color:#f1d39a}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
 <defs>
  <linearGradient id="kr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d6b27f"/><stop offset=".6" stop-color="#a98052"/><stop offset="1" stop-color="#86613c"/></linearGradient>
  <linearGradient id="krB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a8378"/><stop offset=".6" stop-color="#6b645c"/><stop offset="1" stop-color="#4b463f"/></linearGradient>
  <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f2b1a"/><stop offset="1" stop-color="#6c4d2f"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1c4"/><stop offset=".45" stop-color="#d9ad55"/><stop offset="1" stop-color="#8f6a26"/></linearGradient>
  <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffeec0"/><stop offset=".4" stop-color="#c9a052"/><stop offset="1" stop-color="#6e5220"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
 </defs>
</svg>

<div id="stage">

<!-- ================= A : afternoon, box 12 ================= -->
<section class="screen" id="a">
  <div class="floor"></div><div class="planks-y"></div>
  <div class="shafts"></div><div class="warm"></div>

  <div class="stack" id="stackA"></div>

  <!-- open box 12 -->
  <svg class="openbox" viewBox="0 0 520 440">
    <path d="M60 50 L460 50 L500 0 L20 0Z" fill="#b78d5c"/>
    <rect x="40" y="50" width="440" height="340" rx="3" fill="url(#kr)"/>
    <rect x="62" y="70" width="396" height="300" fill="url(#inside)"/>
    <rect x="62" y="70" width="396" height="40" fill="rgba(0,0,0,.35)"/>
    <path d="M40 50 L0 100 L0 360 L40 390Z" fill="#c29a67"/>
    <path d="M480 50 L520 96 L520 370 L480 390Z" fill="#9e7648"/>
    <path d="M40 390 L480 390 L500 436 L20 436Z" fill="#c09565"/>
    <text x="70" y="424" font-size="24" fill="#4a3322" font-family="Nanum Pen Script,cursive,serif" opacity=".85">12 · 안방 장롱 위</text>
    <!-- tissue paper -->
    <path d="M80 300 Q160 250 240 300 T420 290 L440 370 L70 370Z" fill="#efe6d6" opacity=".85"/>
    <path d="M100 330 Q180 300 260 330" stroke="#d6cab3" stroke-width="2" fill="none"/>
  </svg>

  <!-- baby gown (inside box) -->
  <div class="item" style="left:610px;top:250px;--r:6deg;transform:rotate(6deg)">
    <svg width="200" height="190" viewBox="0 0 200 190">
      <path d="M60 20 Q100 40 140 20 L196 58 L176 92 L150 78 L150 180 L50 180 L50 78 L24 92 L4 58Z" fill="#f4efe4"/>
      <path d="M60 20 Q100 40 140 20" stroke="#d9cbb1" stroke-width="3" fill="none"/>
      <path d="M100 34 L100 180" stroke="#e1d6c2" stroke-width="2"/>
      <path d="M94 60 q-22 4 -30 16 M106 60 q22 4 30 16" stroke="#e7a9a0" stroke-width="3" fill="none"/>
      <g fill="#eab7ad" opacity=".6"><circle cx="72" cy="120" r="3"/><circle cx="128" cy="140" r="3"/><circle cx="90" cy="156" r="3"/><circle cx="118" cy="104" r="3"/></g>
      <path d="M50 170 L150 170" stroke="#e1d6c2" stroke-width="3"/>
      <path d="M60 20 Q100 40 140 20 L196 58 L176 92 L150 78 L150 180 L50 180 L50 78 L24 92 L4 58Z" fill="rgba(255,220,160,.12)"/>
    </svg>
  </div>
  <!-- cassette (on floor) -->
  <div class="item" style="left:1060px;top:360px;--r:-12deg;transform:rotate(-12deg)">
    <svg width="190" height="122" viewBox="0 0 190 122">
      <rect x="2" y="2" width="186" height="118" rx="8" fill="#2f2b2a"/>
      <rect x="14" y="12" width="162" height="62" rx="3" fill="#efe3c6"/>
      <rect x="14" y="12" width="162" height="12" fill="#d9774f"/>
      <text x="22" y="46" font-size="17" fill="#2b3f7a" font-family="Nanum Pen Script,cursive,serif">엄마 목소리 '94</text>
      <text x="22" y="66" font-size="12" fill="#2b3f7a" font-family="Nanum Pen Script,cursive,serif">B면 — 지우지 말 것</text>
      <rect x="50" y="80" width="90" height="28" rx="12" fill="#1b1918"/>
      <circle cx="70" cy="94" r="9" fill="#5b544f"/><circle cx="120" cy="94" r="9" fill="#5b544f"/>
      <circle cx="70" cy="94" r="4" fill="#1b1918"/><circle cx="120" cy="94" r="4" fill="#1b1918"/>
      <rect x="2" y="2" width="186" height="30" rx="8" fill="rgba(255,255,255,.08)"/>
    </svg>
  </div>
  <div class="whisper" style="left:1270px;top:392px">누구의 목소리를 남기고 싶었을까</div>
  <div class="whisper" style="left:830px;top:190px;animation-delay:-2s">한 번도 입히지 못한 옷</div>

  <!-- the held item: hospital wristband -->
  <div class="held" id="held">
    <svg width="250" height="90" viewBox="0 0 250 90">
      <path d="M8 40 Q20 10 60 16 L230 26 Q246 28 244 44 Q242 60 226 60 L60 66 Q20 70 8 40Z" fill="#fbf7ee"/>
      <path d="M8 40 Q20 10 60 16" stroke="#e4dccb" stroke-width="3" fill="none"/>
      <rect x="70" y="24" width="120" height="34" rx="3" fill="#fff"/>
      <text x="78" y="38" font-size="11" fill="#7a6a5a" font-family="Noto Sans KR,sans-serif">성모산부인과 · 신생아</text>
      <text x="78" y="53" font-size="13" fill="#3b2f27" font-weight="700" font-family="Noto Sans KR,sans-serif">윤○○ 아기 · 1968.3.2</text>
      <circle cx="210" cy="42" r="5" fill="#e3a3b0"/><circle cx="222" cy="42" r="5" fill="#e3a3b0"/>
    </svg>
  </div>
  <svg class="hand" width="70" height="80" viewBox="0 0 70 80"><path d="M20 6 Q28 0 32 10 L34 34 L40 30 Q48 28 50 36 L56 34 Q64 34 64 44 L64 62 Q60 78 40 78 L28 78 Q14 76 10 60 L6 44 Q4 36 12 36 L16 40 Z" fill="#fff4e4" stroke="#6b4f3a" stroke-width="2.5" stroke-linejoin="round"/></svg>

  <!-- guide curve from held item to target slot -->
  <svg class="guide" style="left:0;top:0" width="1600" height="1000">
    <path d="M690 690 C 640 760, 580 820, 557 890" stroke="#ffe4a8" stroke-width="2" stroke-dasharray="4 7" fill="none" opacity=".85"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="1s" repeatCount="indefinite"/></path>
  </svg>

  <div class="hudTL"><div class="t">상 자</div><div class="n"><b>12</b> / 30</div><div class="bar" id="barA"></div></div>
  <div class="hudTR">물건을 그 사람의 삶 위에 놓는다<br><span class="k">끌기</span>자리 찾기 <span class="k">길게</span>들여다보기</div>

  <div class="tl" id="tlA"><div class="tlhead"><b>이름 모를 사람</b>1941 —</div><div class="thread"></div></div>

  <div class="motes" id="motesA"></div>
  <div class="grain"></div><div class="vig"></div>
</section>

<!-- ================= B : blue hour, box 30 ================= -->
<section class="screen" id="b">
  <div class="floor"></div><div class="planks-y"></div>
  <div class="shafts"></div><div class="warm"></div>
  <!-- where boxes used to be -->
  <div class="ghostmark" style="left:60px;top:110px;width:170px;height:130px"></div>
  <div class="ghostmark" style="left:240px;top:120px;width:150px;height:120px"></div>
  <div class="ghostmark" style="left:80px;top:270px;width:200px;height:150px"></div>
  <div class="ghostmark" style="left:1200px;top:150px;width:180px;height:140px"></div>
  <div class="ghostmark" style="left:1260px;top:320px;width:160px;height:120px"></div>

  <svg class="lastbox" viewBox="0 0 400 320">
    <path d="M40 40 L360 40 L390 0 L10 0Z" fill="#7d7468"/>
    <rect x="20" y="40" width="360" height="250" rx="3" fill="url(#krB)"/>
    <rect x="40" y="58" width="320" height="214" fill="#1c1a1c"/>
    <path d="M20 40 L-10 80 L-10 270 L20 290Z" fill="#857c70"/>
    <path d="M380 40 L410 76 L410 280 L380 290Z" fill="#5c554d"/>
    <path d="M20 290 L380 290 L396 318 L4 318Z" fill="#7a7266"/>
    <text x="50" y="310" font-size="22" fill="#2a2622" font-family="Nanum Pen Script,cursive,serif" opacity=".8">30 · 현관 신발장</text>
  </svg>

  <div class="keytag" id="key">
    <svg width="280" height="190" viewBox="0 0 280 190">
      <!-- string -->
      <path d="M70 50 C 110 40, 130 70, 160 64" stroke="#cdbfa6" stroke-width="2" fill="none"/>
      <!-- key -->
      <g transform="translate(10 20)">
        <circle cx="40" cy="30" r="26" fill="url(#brass)"/>
        <circle cx="40" cy="30" r="10" fill="#1c1a1c"/>
        <rect x="62" y="24" width="84" height="12" rx="3" fill="url(#brass)"/>
        <path d="M120 36 v12 h6 v-6 h6 v10 h6 v-16" fill="url(#brass)"/>
      </g>
      <!-- paper tag -->
      <g transform="translate(150 50) rotate(8)">
        <path d="M0 18 L18 0 L120 0 L120 110 L18 110 L0 92Z" fill="#f2ead7"/>
        <circle cx="16" cy="55" r="5" fill="#1c1a1c"/>
        <text x="30" y="30" font-size="15" fill="#2b3f7a" font-family="Nanum Pen Script,cursive,serif">다 보셨으면</text>
        <text x="30" y="52" font-size="15" fill="#2b3f7a" font-family="Nanum Pen Script,cursive,serif">열쇠는</text>
        <text x="30" y="74" font-size="15" fill="#2b3f7a" font-family="Nanum Pen Script,cursive,serif">우편함에.</text>
        <text x="30" y="98" font-size="15" fill="#2b3f7a" font-family="Nanum Pen Script,cursive,serif">고마워요.</text>
      </g>
    </svg>
    <div class="glint"></div>
  </div>

  // seeded rng (stable screenshots)

    d.style.left=q[0]+'px';d.style.top=q[1]+'px';d.style.width=q[2]+'px';d.style.height=q[3]+'px';d.style.transform='rotate('+((rnd()-.5)*6).toFixed(1)+'deg)';
    d.innerHTML='<span class="n">'+q[4]+'<small> ~'+(q[4]+ (b===6?11:0))+'</small></span>';if(b!==6)d.innerHTML='<span class="n">'+q[4]+'</span>';st.appendChild(d);}

  // motes
  function motes(id,n){var m=document.getElementById(id);for(var i=0;i<n;i++){var e=document.createElement('i');
    e.style.left=(500+rnd()*1000)+'px';e.style.top=(80+rnd()*520)+'px';var s=(1.5+rnd()*3);e.style.width=e.style.height=s+'px';
    e.style.animationDuration=(8+rnd()*10)+'s';e.style.animationDelay=(-rnd()*14)+'s';m.appendChild(e);}}
  motes('motesA',46);motes('motesB',22);

  // timeline icons
  var ic={
    school:'<rect width="60" height="50" fill="#b9b2a4"/><rect y="32" width="60" height="18" fill="#8f877a"/><g fill="#3d3833"><circle cx="20" cy="20" r="6"/><path d="M11 50 Q12 28 20 27 Q28 28 29 50Z"/><circle cx="40" cy="20" r="6"/><path d="M31 50 Q32 28 40 27 Q48 28 49 50Z"/></g>',
    badge:'<rect width="60" height="50" fill="#c9c3b3"/><rect x="10" y="8" width="40" height="34" rx="2" fill="#f0ebdc" stroke="#8a7f6a"/><rect x="14" y="12" width="12" height="15" fill="#9b9384"/><text x="29" y="20" font-size="6" fill="#3b2f27">대한방직</text><text x="29" y="28" font-size="5" fill="#7a6a5a">검사 3조</text><rect x="14" y="32" width="32" height="4" fill="#b0453a"/>',
    ring:'<rect width="60" height="50" fill="#5c4a3c"/><ellipse cx="30" cy="27" rx="15" ry="12" fill="none" stroke="url(#gold)" stroke-width="5"/><circle cx="24" cy="18" r="2" fill="#fff" opacity=".8"/>',
    band:'<rect width="60" height="50" fill="#e8dfd0"/><path d="M4 26 Q10 14 22 16 L56 20 Q60 26 56 32 L22 34 Q10 36 4 26Z" fill="#fbf7ee" stroke="#d9cfbd"/><rect x="22" y="20" width="22" height="10" fill="#fff" stroke="#e3a3b0" stroke-width=".8"/><circle cx="50" cy="26" r="2" fill="#e3a3b0"/>',
    school2:'<rect width="60" height="50" fill="#9fb0a2"/><rect y="30" width="60" height="20" fill="#7c8c66"/><path d="M10 30 L20 14 L30 30Z" fill="#6c5a4a"/><g fill="#3d3833"><circle cx="40" cy="24" r="4"/><path d="M34 40 Q35 29 40 28 Q45 29 46 40Z"/></g><g fill="#b44a3a"><circle cx="48" cy="30" r="3"/><path d="M44 42 Q45 34 48 33 Q51 34 52 42Z"/></g>',
    letter:'<rect width="60" height="50" fill="#d7ccb5"/><rect x="8" y="12" width="44" height="28" fill="#f7f1e2" stroke="#b9ab8f"/><path d="M8 12 L30 30 L52 12" stroke="#b9ab8f" fill="none"/><rect x="42" y="15" width="7" height="8" fill="#c9594a"/>',
    tape:'<rect width="60" height="50" fill="#524a45"/><rect x="8" y="12" width="44" height="28" rx="3" fill="#2f2b2a"/><rect x="12" y="15" width="36" height="12" fill="#efe3c6"/><rect x="12" y="15" width="36" height="3" fill="#d9774f"/><circle cx="23" cy="33" r="3" fill="#7a716b"/><circle cx="37" cy="33" r="3" fill="#7a716b"/>',
    pot:'<rect width="60" height="50" fill="#b9c0a8"/><path d="M20 30 L40 30 L37 46 L23 46Z" fill="#b8643e"/><path d="M30 30 Q24 16 16 14 M30 30 Q34 14 44 12 M30 30 L30 10" stroke="#4e7a3a" stroke-width="3" fill="none"/><circle cx="30" cy="10" r="4" fill="#e8b84a"/>',
    pass:'<rect width="60" height="50" fill="#c7c0b1"/><rect x="8" y="12" width="44" height="28" rx="3" fill="#3d7a5a"/><text x="13" y="24" font-size="7" fill="#fff" font-weight="700">경로 우대</text><rect x="13" y="28" width="16" height="7" fill="#e7d27a"/>',
    key:'<rect width="60" height="50" fill="#2d2a2c"/><circle cx="20" cy="25" r="9" fill="url(#brass)"/><circle cx="20" cy="25" r="3.5" fill="#2d2a2c"/><rect x="28" y="23" width="24" height="4" fill="url(#brass)"/><path d="M44 27 v5 h3 v-3 h3 v4" fill="url(#brass)"/>'
  };
  function x(y){return 100+(y-1941)*(1400/84);}
  var A=[
    [1941,'school','국민학교',0],[1959,'badge','첫 월급',1],[1966,'ring','',0],[1968,'band','',1,'target'],
    [1974,null,'',0,'empty'],[1988,'letter','편지',1],[1994,null,'',0,'empty'],[2003,null,'',1,'empty'],[2011,'pass','',0],[2025,null,'',0,'empty']];
  var B=[
    [1941,'school','국민학교',0],[1952,'school2','피란',1],[1959,'badge','첫 월급',0],[1966,'ring','혼인',1],[1968,'band','딸',0],
    [1974,'letter','남편 편지',1],[1988,'letter','딸 결혼',0],[1994,'tape','목소리',1],[2003,'pot','혼자 된 봄',0],[2011,'pass','경로',1],[2025,'key','',0]];

      s.innerHTML=h;
      var p=document.createElement('div');p.className='pin';p.style.cssText=up?'top:98px;height:40px':'top:-28px;height:28px';s.appendChild(p);
      el.appendChild(s);
      if(years){var yl=document.createElement('div');yl.className='yr'+(it[1]?'':' dim');yl.style.left=(px+6)+'px';yl.style.top=(up?'142px':'174px');
        yl.textContent=it[0];el.appendChild(yl);}
    }}
  tl('tlA',A,true); tl('tlB',B,true);

  // audio: soft chime on interaction only
  var AC=null; function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}return AC;}
  function chime(f){var c=ac();if(!c)return;var t=c.currentTime;[1,2.01,3.02].forEach(function(m,i){var o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f*m;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12/(i+1),t+.02);g.gain.exponentialRampToValueAtTime(.0005,t+2.4);o.connect(g).connect(c.destination);o.start(t);o.stop(t+2.5);});}
  function paper(){var c=ac();if(!c)return;var t=c.currentTime,len=c.sampleRate*.3,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(Math.sin(Math.PI*i/len),3)*.35;var n=c.createBufferSource(),f=c.createBiquadFilter();f.type='highpass';f.frequency.value=1800;n.buffer=b;n.connect(f).connect(c.destination);n.start(t);}

  var slots=document.querySelectorAll('#tlA .slot.target');
  for(var k=0;k<slots.length;k++)slots[k].addEventListener('click',function(){

  var its=document.querySelectorAll('.item');for(var z=0;z<its.length;z++)its[z].addEventListener('click',paper);
  document.getElementById('key').addEventListener('click',function(){chime(392);setTimeout(function(){chime(587.3);},380);});
})();
