<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>찍히지 않은 사람</title>
<style>
html,body{margin:0;height:100%;background:#0d0c0b;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:1000px;margin:-500px 0 0 -800px;transform-origin:50% 50%;overflow:hidden;
  background:radial-gradient(ellipse 80% 70% at 50% 45%,#5a4632 0%,#3a2b1e 55%,#1a120b 100%);font-family:"Nanum Pen Script","Nanum Brush Script","Noto Sans KR",cursive;color:#efe9dc}
.screen{position:absolute;inset:0;display:none}.screen.on{display:block}
.album{position:absolute;left:70px;top:70px;width:1460px;height:860px;border-radius:10px;background:#3d2418;box-shadow:0 40px 80px rgba(0,0,0,.6),inset 0 0 0 10px #4a2c1d,inset 0 0 0 12px #2a180f}
.page{position:absolute;top:22px;bottom:22px;width:696px;background:#1d1c1a;box-shadow:inset 0 0 60px rgba(0,0,0,.6)}
.page:after{content:"";position:absolute;inset:0;opacity:.25;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .48 0 0 0 0 .44 0 0 0 .7 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
.page.l{left:22px}.page.r{right:22px}
.gutter{position:absolute;left:718px;top:22px;bottom:22px;width:24px;background:linear-gradient(90deg,rgba(0,0,0,.7),rgba(60,40,30,.3) 50%,rgba(0,0,0,.7))}
.glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.06) 42%,rgba(255,255,255,0) 50%)}
.ph{position:absolute;background:#f2ece0;padding:10px;box-shadow:0 6px 14px rgba(0,0,0,.55);cursor:pointer;transition:transform .2s}
.ph:hover{transform:scale(1.015)}
.ph svg{display:block}
.corner{position:absolute;width:26px;height:26px;background:linear-gradient(135deg,#0c0b0a 50%,rgba(0,0,0,0) 50%);z-index:2}
.cap{position:absolute;font-size:22px;color:#e9e1cf;opacity:.9;white-space:nowrap}
.note{position:absolute;font-size:30px;color:#fff6dc;white-space:nowrap;text-shadow:0 0 1px #fff;z-index:4;pointer-events:none}
.pen{position:absolute;inset:0;pointer-events:none;z-index:3}
.hud{position:absolute;z-index:6;font-family:"Pretendard","Noto Sans KR",sans-serif}
.tabs{position:absolute;right:16px;bottom:12px;z-index:60;display:flex;gap:6px}
.tab{font:12px/1 "DejaVu Sans",sans-serif;color:#efe9dc;background:rgba(20,14,10,.8);border:1px solid #6a5238;padding:6px 10px;cursor:pointer}
.tab.on{background:#efe9dc;color:#1a120b}
.polaroid{position:absolute;background:#f7f4ec;padding:18px 18px 70px;box-shadow:0 30px 50px rgba(0,0,0,.6);transform:rotate(-4deg);z-index:5;transition:transform .4s}
.dev{animation:dev 7s ease-out -5s forwards}
.dev0{animation:dev 7s ease-out forwards}
@keyframes dev{0%{filter:grayscale(1) brightness(.35) contrast(.6) sepia(.3)}40%{filter:grayscale(.7) brightness(.8) contrast(.8) sepia(.4)}100%{filter:none}}
.slot{position:absolute;border:2px dashed rgba(239,233,220,.25)}
.hint{font-family:"Pretendard","Noto Sans KR",sans-serif;font-size:13px;letter-spacing:4px;color:#b8a88e}
.pulse{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}
</style>
</head>
<body>
<div id="stage">
 <div class="tabs"><div class="tab" data-s="a">1 · 여백 읽기</div><div class="tab" data-s="b">2 · 한 장 추가</div></div>
 <svg width="0" height="0" style="position:absolute"><defs>
  <filter id="kodak" x="0" y="0" width="100%" height="100%"><feGaussianBlur stdDeviation=".45" result="b"/>
   <feColorMatrix in="b" values="0.95 0.12 0.05 0 0.07  0.05 0.85 0.08 0 0.04  0.02 0.1 0.72 0 0.05  0 0 0 1 0"/></filter>
  <filter id="fgrain"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="1" seed="3"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .35"/></feComponentTransfer></filter>
  <radialGradient id="fade" cx="50%" cy="50%" r="72%"><stop offset=".5" stop-color="#fff5e0" stop-opacity="0"/><stop offset="1" stop-color="#ffe3c0" stop-opacity=".35"/></radialGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fc3d8"/><stop offset="1" stop-color="#3f8aa8"/></linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe0ee"/><stop offset="1" stop-color="#eaf2f0"/></linearGradient>
  <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8cf9e"/><stop offset="1" stop-color="#d4b27a"/></linearGradient>
  <linearGradient id="room" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6cfa8"/><stop offset="1" stop-color="#c8a878"/></linearGradient>
 </defs></svg>

 <section class="screen" id="sa">
  <div class="album"><div class="page l" id="pl"></div><div class="page r" id="pr"></div><div class="gutter"></div><div class="glass"></div></div>
  <svg class="pen" width="1600" height="1000" viewBox="0 0 1600 1000">
   <g fill="none" stroke="#fff6dc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".92">
    <path d="M360 392 C326 396 318 430 336 452 C356 474 410 474 428 446 C444 420 424 392 392 390 C380 389 370 390 362 394" stroke-dasharray="400" stroke-dashoffset="400"><animate attributeName="stroke-dashoffset" from="400" to="0" dur="1.2s" fill="freeze" begin=".2s"/></path>
    <path d="M432 420 C500 400 540 360 572 330"/><path d="M572 330 l-15 2 M572 330 l-4 14"/>
   </g>
  </svg>
  <div class="note" style="left:585px;top:258px;transform:rotate(-3deg);font-size:26px;line-height:36px">셔터 누른 사람의<br>그림자 · 샌들</div>
  <div class="hud" style="left:98px;top:22px"><span class="hint">가족 앨범 · 1994 — 1998 · 셋째 장</span></div>
  <div class="hud" style="right:98px;top:18px;text-align:right"><span class="hint">읽은 여백</span> <b style="font:800 26px 'Bahnschrift','DejaVu Sans',sans-serif;color:#fff6dc;margin-left:8px">7 / 25</b></div>
  <div class="hud" style="left:0;right:0;bottom:22px;text-align:center"><span class="hint">사진의 빈 곳을 누르면 연필로 적어 둔다 · 사람은 없고 흔적만 있다</span></div>
 </section>

 <section class="screen" id="sb">
  <div class="album"><div class="page l" id="pl2"></div><div class="page r" id="pr2"></div><div class="gutter"></div><div class="glass"></div></div>
  <div class="hud" style="left:98px;top:22px"><span class="hint">가족 앨범 · 마지막 장</span></div>
  <div class="hud" style="right:98px;top:18px;text-align:right"><span class="hint">읽은 여백</span> <b style="font:800 26px 'Bahnschrift','DejaVu Sans',sans-serif;color:#fff6dc;margin-left:8px">25 / 25</b></div>
  <div class="hud" style="left:0;right:0;bottom:22px;text-align:center"><span class="hint pulse" id="devHint">사진을 누르면 다시 현상된다</span></div>
 </section>
</div>
<script>
(function(){
 var st=document.getElementById('stage');
 function fit(){var s=Math.min(window.innerWidth/1600,window.innerHeight/1000);st.style.transform='scale('+s+')';}
 window.addEventListener('resize',fit);fit();
 function show(id){var ss=document.querySelectorAll('.screen'),i;for(i=0;i<ss.length;i++){ss[i].classList.toggle('on',ss[i].id==='s'+id);}
  var ts=document.querySelectorAll('.tab');for(i=0;i<ts.length;i++){ts[i].classList.toggle('on',ts[i].getAttribute('data-s')===id);}
  try{if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);}catch(e){}}
 function fromHash(){show(location.hash==='#b'?'b':'a');}
 window.addEventListener('hashchange',fromHash);
 var tabs=document.querySelectorAll('.tab');for(var t=0;t<tabs.length;t++){tabs[t].addEventListener('click',function(){show(this.getAttribute('data-s'));});}
 fromHash();

 /* people: soft rounded figures */
 function kid(x,y,s,shirt,pants){return '<g transform="translate('+x+' '+y+') scale('+s+')"><rect x="-9" y="-2" width="7" height="30" rx="3" fill="'+pants+'"/><rect x="2" y="-2" width="7" height="30" rx="3" fill="'+pants+'"/><rect x="-14" y="-40" width="28" height="42" rx="10" fill="'+shirt+'"/><circle cy="-52" r="13" fill="#f0c9a0"/><path d="M-13 -55 Q0 -72 13 -55 Q6 -60 -13 -55" fill="#2a1a12"/></g>';}
 function adult(x,y,s,shirt,pants,hair){return '<g transform="translate('+x+' '+y+') scale('+s+')"><rect x="-12" y="-2" width="10" height="52" rx="4" fill="'+pants+'"/><rect x="2" y="-2" width="10" height="52" rx="4" fill="'+pants+'"/><rect x="-19" y="-62" width="38" height="64" rx="12" fill="'+shirt+'"/><circle cy="-76" r="15" fill="#e8bd92"/><path d="M-15 -78 Q0 -98 15 -78 Q8 -86 -15 -78" fill="'+(hair||'#1e140e')+'"/></g>';}
 function frame(inner,w,h){return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 400 300"><g filter="url(#kodak)">'+inner+'</g><rect width="400" height="300" fill="url(#fade)"/><rect width="400" height="300" filter="url(#fgrain)" style="mix-blend-mode:overlay"/></svg>';}
 /* 1 · beach, the photographer's shadow */
 function beach(withMom){var s='<rect width="400" height="300" fill="url(#sky)"/><rect y="110" width="400" height="70" fill="url(#sea)"/><path d="M0 170 Q100 160 200 172 T400 168 L400 300 L0 300 Z" fill="url(#sand)"/>';
  s+='<path d="M0 178 Q60 172 120 180 T260 178 T400 176" fill="none" stroke="#fff" stroke-width="4" opacity=".7"/>';
  s+=adult(150,210,1,'#2f6fb0','#e8e0cc')+kid(205,232,.95,'#e8573c','#3a5a8a')+kid(250,236,.85,'#f2c230','#e8e0cc');
  if(!withMom){s+='<path d="M190 300 L214 256 C218 248 232 246 236 256 L246 300 Z" fill="#6a5238" opacity=".55"/><ellipse cx="226" cy="252" rx="13" ry="9" fill="#6a5238" opacity=".55"/>';}
  else{s+=adult(320,222,1.05,'#f2e4d8','#6a8a6a','#3a2418');}
  s+='<rect x="18" y="20" width="60" height="20" fill="none"/><text x="386" y="288" text-anchor="end" font-family="DejaVu Sans Mono" font-size="14" fill="#ff8a3a">'+(withMom?"'98 8 15":"'94 7 30")+'</text>';return s;}
 /* 2 · birthday table, four bowls three people */
 function birthday(){var s='<rect width="400" height="300" fill="url(#room)"/><rect y="200" width="400" height="100" fill="#8a5a3a"/><rect x="40" y="60" width="90" height="70" fill="#f4ead8" stroke="#8a6a4a" stroke-width="4"/>';
  s+='<rect x="20" y="190" width="360" height="30" rx="6" fill="#6a3a22"/>';
  s+=adult(90,190,.9,'#7a8a5a','#3a3a3a')+kid(170,196,.9,'#e8573c','#3a5a8a')+kid(250,198,.8,'#f2c230','#3a5a8a');
  for(var i=0;i<4;i++){s+='<ellipse cx="'+(70+i*85)+'" cy="198" rx="22" ry="8" fill="#f4f0e6"/><ellipse cx="'+(70+i*85)+'" cy="196" rx="16" ry="4" fill="#5a6a3a"/>';}
  s+='<rect x="300" y="150" width="60" height="40" rx="6" fill="#f2d0d8"/><g fill="#ffb347">'+[0,1,2,3,4].map(function(k){return '<rect x="'+(308+k*10)+'" y="136" width="3" height="14"/>';}).join('')+'</g>';
  s+='<rect x="300" y="222" width="70" height="18" rx="6" fill="#b04a4a" opacity=".85"/>';
  s+='<text x="386" y="288" text-anchor="end" font-family="DejaVu Sans Mono" font-size="14" fill="#ff8a3a">\'95 3 11</text>';return s;}
 /* 3 · new year bow, reflection in TV */
 function newyear(){var s='<rect width="400" height="300" fill="#d8c29a"/><rect y="210" width="400" height="90" fill="#c9a26a"/>';
  s+='<rect x="270" y="80" width="110" height="90" rx="8" fill="#2a2a2a"/><rect x="280" y="88" width="90" height="70" rx="10" fill="#3a4448"/>';
  s+='<g opacity=".55"><circle cx="330" cy="112" r="7" fill="#a0b0b8"/><rect x="323" y="119" width="14" height="22" rx="5" fill="#a0b0b8"/><rect x="336" y="108" width="10" height="7" fill="#c8d8e0"/></g>';
  s+=adult(90,220,.95,'#8a3a4a','#3a2a2a','#ddd')+adult(160,220,.95,'#3a4a6a','#3a2a2a','#ccc');
  s+='<g transform="translate(220 250)"><ellipse rx="30" ry="14" fill="#e8573c"/><circle cx="-26" cy="-4" r="11" fill="#f0c9a0"/></g>';
  s+='<text x="386" y="288" text-anchor="end" font-family="DejaVu Sans Mono" font-size="14" fill="#ff8a3a">\'96 2 19</text>';return s;}
 /* 4 · school gate, a hand at the edge */
 function school(){var s='<rect width="400" height="300" fill="#cfe2ea"/><rect y="170" width="400" height="130" fill="#b8a488"/><rect x="40" y="60" width="320" height="120" fill="#e8dcc8"/><rect x="40" y="60" width="320" height="16" fill="#a04a3a"/>';
  s+='<g fill="#7a9ab0">'+[0,1,2,3,4,5].map(function(k){return '<rect x="'+(60+k*50)+'" y="90" width="30" height="30"/>';}).join('')+'</g>';
  s+='<rect x="150" y="130" width="100" height="16" fill="#fff"/><text x="200" y="143" text-anchor="middle" font-size="12" font-family="Noto Sans KR,sans-serif" fill="#333">입학을 축하합니다</text>';
  s+=kid(190,250,1.2,'#f2c230','#3a5a8a');
  s+='<path d="M400 150 C370 160 350 176 338 190 C330 200 336 206 346 202 L372 186 L400 180 Z" fill="#e8bd92"/><path d="M400 140 L376 150 L400 196 Z" fill="#b04a6a"/>';
  s+='<text x="386" y="288" text-anchor="end" font-family="DejaVu Sans Mono" font-size="14" fill="#ff8a3a">\'97 3 2</text>';return s;}
 function place(el,x,y,w,h,rot,svg,cap,capx,capy){var d=document.createElement('div');d.className='ph';d.style.cssText='left:'+x+'px;top:'+y+'px;transform:rotate('+rot+'deg)';d.innerHTML=svg+'<div class="corner" style="left:-6px;top:-6px"></div><div class="corner" style="right:-6px;top:-6px;transform:rotate(90deg)"></div><div class="corner" style="right:-6px;bottom:-6px;transform:rotate(180deg)"></div><div class="corner" style="left:-6px;bottom:-6px;transform:rotate(270deg)"></div>';
  el.appendChild(d);if(cap){var c=document.createElement('div');c.className='cap';c.style.cssText='left:'+capx+'px;top:'+capy+'px';c.textContent=cap;el.appendChild(c);}return d;}
 var pl=document.getElementById('pl'),pr=document.getElementById('pr');
 place(pl,60,70,380,285,-2,frame(beach(false),380,285),'1994 여름 · 대천 — 아빠, 나, 동생',70,380);
 place(pl,300,470,340,255,3,frame(birthday(),340,255),'동생 생일 · 미역국은 네 그릇',300,762);
 place(pr,80,60,340,255,1.5,frame(newyear(),340,255),'1996 설 · 할머니 댁',90,332);
 place(pr,300,400,340,255,-2.5,frame(school(),340,255),'입학식 · 누가 손을 잡고 있었지',310,694);
 /* pencil marks on the right page (static) */
 var mk=document.createElement('div');mk.style.cssText='position:absolute;inset:0;pointer-events:none';mk.innerHTML='<svg width="696" height="816" style="position:absolute;inset:0"><g fill="none" stroke="#fff6dc" stroke-width="2.4" opacity=".75" stroke-linecap="round"><ellipse cx="376" cy="148" rx="42" ry="44"/><path d="M420 150 C470 160 500 190 520 210"/><ellipse cx="628" cy="600" rx="36" ry="48"/></g></svg><div class="note" style="left:470px;top:214px;font-size:22px;line-height:30px;transform:rotate(2deg)">✓ TV 화면 속<br>카메라 든 사람</div><div class="note" style="left:40px;top:470px;font-size:22px;line-height:30px;transform:rotate(-2deg)">✓ 화면 밖 손<br>꽃무늬 소매 →</div>';
 pr.appendChild(mk);
 /* ---------- B ---------- */
 var pl2=document.getElementById('pl2'),pr2=document.getElementById('pr2');
 function mini(el,x,y,rot,svg,cap,cx,cy){place(el,x,y,0,0,rot,svg,cap,cx,cy);}
 mini(pl2,50,60,-2,frame(birthday(),300,225),'1998 생일 · 네 그릇 ✓',60,305);
 mini(pl2,360,110,2,frame(school(),290,218),'졸업식 · 꽃무늬 소매 ✓',370,350);
 mini(pl2,90,440,1,frame(newyear(),300,225),'설 · TV 속 ✓',100,685);
 var n=document.createElement('div');n.className='note';n.style.cssText='left:430px;top:520px;font-size:26px;line-height:44px;transform:rotate(-3deg);white-space:normal;width:250px';n.innerHTML='스물다섯 장 모두<br>같은 사람이<br>찍고 있었다';pl2.appendChild(n);
 var slot=document.createElement('div');slot.className='slot';slot.style.cssText='left:88px;top:92px;width:520px;height:470px';pr2.appendChild(slot);
 var po=document.createElement('div');po.className='polaroid';po.style.cssText='left:100px;top:84px';po.innerHTML='<div id="devImg" class="dev">'+frame(beach(true),480,360)+'</div><div style="position:absolute;left:24px;bottom:18px;font-size:24px;color:#2a2a3a;white-space:nowrap">1998. 8. 15 · 타이머 10초 · 처음으로 엄마도</div>';
 pr2.appendChild(po);
 var cap2=document.createElement('div');cap2.className='note';cap2.style.cssText='left:90px;top:640px;font-size:23px;line-height:38px;white-space:normal;width:560px;opacity:.9';cap2.innerHTML='그림자의 샌들 · 꽃무늬 소매 · TV 속 카메라<br>— 셔터 옆에서 뛰어와, 맨 오른쪽에 섰다.';pr2.appendChild(cap2);
 po.addEventListener('click',function(){var d=document.getElementById('devImg');d.classList.remove('dev');d.classList.remove('dev0');void d.offsetWidth;d.classList.add('dev0');shutter();});
 /* ---------- audio: page turn / shutter on interaction ---------- */
 var ac=null;function actx(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return ac;}
 function nz(dur,f,vol,type){var a=actx();if(!a)return;var n=a.currentTime,b=a.createBuffer(1,Math.floor(a.sampleRate*dur),a.sampleRate),d=b.getChannelData(0);for(var i=0;i<d.length;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);}
  var s=a.createBufferSource();s.buffer=b;var fl=a.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.value=f;var g=a.createGain();g.gain.value=vol;s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(n);}
 function shutter(){nz(.04,3000,.6);setTimeout(function(){nz(.06,1800,.5);},70);}
 function pencil(){for(var i=0;i<6;i++){setTimeout(function(){nz(.05,5200,.12,'highpass');},i*45);}}
 var phs=document.querySelectorAll('#sa .ph');for(var k=0;k<phs.length;k++){phs[k].addEventListener('click',pencil);}
 document.addEventListener('keydown',function(e){if(e.key==='1')show('a');else if(e.key==='2')show('b');});
})();
</script>
</body>
</html>
