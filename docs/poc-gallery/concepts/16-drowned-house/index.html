<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>익사한 집</title>
<style>
:root{--murk:#06221f;--murk2:#0b3a34;--light:#ffd28a;--pale:#cfe9e2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:var(--pale)}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:1000px;transform-origin:50% 50%;overflow:hidden;background:#020d0c}
.screen{position:absolute;inset:0;display:none}
body[data-screen="a"] #sa, body[data-screen="b"] #sb{display:block}
.view{position:absolute;inset:0;perspective:900px;perspective-origin:50% 100%;overflow:hidden}
.ceil{position:absolute;left:-700px;top:-40px;width:3000px;height:1500px;transform-origin:50% 0;transform:rotateX(-68deg);
 background:
  repeating-linear-gradient(0deg,transparent 0 420px,rgba(0,0,0,.55) 420px 424px,#0a1614 424px 470px,rgba(255,255,255,.06) 470px 472px,transparent 472px 520px),
  repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 118px,rgba(255,210,138,.55) 118px 121px,rgba(0,0,0,.9) 121px 124px),
  repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 7px),
  repeating-linear-gradient(90deg,#1c3a33 0 30px,#1a352f 30px 70px,#20423a 70px 124px)}
.ceil::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,13,12,0) 0,rgba(2,13,12,.2) 30%,rgba(2,13,12,.95) 85%)}
.beam{position:absolute;left:1600px;top:0;width:260px;height:1500px;background:repeating-linear-gradient(0deg,transparent 0 300px,rgba(0,0,0,.95) 300px 312px)}
.caus{position:absolute;inset:0;opacity:.3;background-image:radial-gradient(ellipse 60px 20px at 30% 40%,rgba(160,255,220,.5),transparent 70%),radial-gradient(ellipse 80px 26px at 70% 20%,rgba(160,255,220,.4),transparent 70%),radial-gradient(ellipse 40px 14px at 50% 70%,rgba(160,255,220,.5),transparent 70%);background-size:300px 200px,420px 260px,260px 180px;animation:cau 10s linear infinite}
@keyframes cau{to{background-position:300px 60px,-420px 30px,130px -180px}}
.foot{position:absolute;width:110px;height:250px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 35%,#000 0,rgba(0,0,0,.92) 45%,rgba(0,0,0,.5) 62%,transparent 72%)}
.lamp{position:absolute;border-radius:50%;background:radial-gradient(ellipse,rgba(255,210,138,.22),transparent 65%)}
.foot.old{opacity:.35}.foot.mid{opacity:.6}
.ring{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:3px solid rgba(255,220,160,.7);animation:ring 2.2s ease-out infinite}
@keyframes ring{from{transform:scale(.4);opacity:1}to{transform:scale(7);opacity:0}}
.dust{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1.6px 1.6px at 20% 30%,rgba(200,255,230,.6),transparent),radial-gradient(1.2px 1.2px at 60% 50%,rgba(200,255,230,.5),transparent),radial-gradient(2px 2px at 45% 75%,rgba(200,255,230,.4),transparent),radial-gradient(1px 1px at 80% 20%,rgba(200,255,230,.6),transparent);background-size:260px 240px;animation:drift 18s linear infinite}
@keyframes drift{to{background-position:30px 240px,-20px 240px,10px 240px,-30px 240px}}
.murk{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 60% at 50% 25%,transparent 30%,rgba(3,22,20,.7) 70%,rgba(1,8,8,.97))}
.fog{position:absolute;left:0;right:0;bottom:0;height:520px;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(4,26,24,.85) 45%,#020c0b)}
.sub{position:absolute;left:0;right:0;text-align:center;text-shadow:0 2px 16px #000}
.sub .who{font-size:15px;letter-spacing:.45em;color:#8fc8bb;margin-bottom:10px}
.sub .txt{font-size:32px;font-weight:300;letter-spacing:.04em;color:#e6f4ef}
.corner{position:absolute;left:44px;top:36px;font-size:14px;letter-spacing:.35em;color:#6fa89b;line-height:2}
.corner b{display:block;font-size:22px;letter-spacing:.3em;color:#cfe9e2;font-weight:400}
.steps{position:absolute;right:44px;top:40px;text-align:right;font-size:14px;letter-spacing:.12em;color:#6fa89b;line-height:2.1}
.steps span{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:8px;vertical-align:middle}
.hint{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);font-size:14px;letter-spacing:.2em;color:#5f8f84}
.bubbles{position:absolute;left:0;right:0;bottom:0;height:1000px;pointer-events:none}
.bubbles i{position:absolute;bottom:-20px;border:1.5px solid rgba(207,233,226,.6);border-radius:50%;animation:up linear infinite}
@keyframes up{to{transform:translateY(-900px) translateX(20px);opacity:0}}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.14;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
@keyframes float{50%{transform:translateY(-14px) rotate(3deg)}}
#tabs{position:absolute;right:14px;bottom:10px;z-index:50;display:flex;gap:4px}
#tabs a{font:12px/1 sans-serif;color:#8fc8bb;text-decoration:none;padding:6px 10px;border:1px solid #1f4a42;background:#020d0ccc;border-radius:12px}
#tabs a.on{background:#cfe9e2;color:#021210}
/* B warm */
#sb .ceil{background:
  repeating-linear-gradient(0deg,transparent 0 420px,rgba(0,0,0,.55) 420px 424px,#1a120a 424px 470px,rgba(255,255,255,.06) 470px 472px,transparent 472px 520px),
  repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 118px,rgba(255,200,110,.95) 118px 122px,rgba(0,0,0,.9) 122px 124px),
  repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 7px),
  repeating-linear-gradient(90deg,#3a3526 0 30px,#342f22 30px 70px,#3e3828 70px 124px)}
.hole{position:absolute;left:1180px;top:120px;width:640px;height:420px;background:radial-gradient(ellipse at 50% 30%,#ffe2a8,#f0a850 55%,#8a4a18);box-shadow:0 0 120px 40px rgba(255,190,100,.55),inset 0 0 40px rgba(80,30,0,.6);overflow:hidden}
.hole svg{position:absolute;inset:0}
.warmglow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 50% 45% at 50% 22%,rgba(255,190,100,.35),transparent 70%);mix-blend-mode:screen;animation:flick 4s ease-in-out infinite}
@keyframes flick{50%{opacity:.8}}
.hand{position:absolute;left:1080px;bottom:-120px;width:300px;height:500px;pointer-events:none;transform:rotate(-14deg);transform-origin:50% 100%}
</style>
</head>
<body data-screen="a">
<div id="stage">
 <section class="screen" id="sa">
  <div class="view">
   <div class="ceil" id="ceilA">
    
    <div class="caus"></div>
    <div class="lamp" style="left:1100px;top:120px;width:700px;height:700px"></div>
    <div class="foot old" style="left:880px;top:300px;transform:rotate(-80deg)"></div>
    <div class="foot mid" style="left:1130px;top:220px;transform:rotate(-76deg)"></div>
    <div class="foot" style="left:1440px;top:250px;transform:rotate(-4deg)"></div>
    <div class="ring" style="left:1495px;top:360px"></div>
    <div class="ring" style="left:1495px;top:360px;animation-delay:-1.1s"></div>
    <div class="foot old" style="left:1800px;top:120px;width:70px;height:150px;transform:rotate(20deg)"></div>
    <div class="foot mid" style="left:1900px;top:60px;width:70px;height:150px;transform:rotate(14deg)"></div>
    <div class="foot old" style="left:1980px;top:330px;width:120px;height:270px;opacity:.22;transform:rotate(-30deg)"></div>
    <div class="foot" style="left:760px;top:900px;width:90px;height:190px;opacity:.5;transform:rotate(-2deg)"></div>
   </div>
  </div>
  <div class="dust"></div>
  <div class="fog"></div><div class="murk"></div>
  <svg style="position:absolute;left:150px;top:690px;opacity:.5;animation:float 7s ease-in-out infinite" width="260" height="220" viewBox="0 0 260 220"><g transform="rotate(-18 130 110)" fill="#0d2b27" stroke="#2d5a52" stroke-width="2"><rect x="60" y="20" width="16" height="170" rx="3"/><rect x="170" y="20" width="16" height="170" rx="3"/><rect x="60" y="30" width="126" height="14" rx="3"/><rect x="60" y="70" width="126" height="10" rx="3"/><rect x="40" y="110" width="170" height="20" rx="4"/><rect x="44" y="130" width="14" height="80" rx="3"/><rect x="192" y="130" width="14" height="80" rx="3"/></g></svg>
  <svg style="position:absolute;right:220px;top:760px;opacity:.45;animation:float 9s ease-in-out infinite reverse" width="120" height="80" viewBox="0 0 120 80"><path d="M10 50 C10 30 40 24 60 30 L100 34 C114 36 116 56 100 58 L20 62 C12 62 10 58 10 50Z" fill="#0d2b27" stroke="#2d5a52" stroke-width="2"/><path d="M30 34 l6 -10 l30 4" stroke="#2d5a52" stroke-width="2" fill="none"/></svg>
  <div class="bubbles" id="bubA"></div>
  <div class="corner">익사한 집 · 첫째 밤<b>거실 아래</b></div>
  <div class="steps">엄마 <span style="background:#ffd28a;box-shadow:0 0 8px #ffd28a"></span><br>동생 <span style="background:#8fc8bb"></span><br>아버지 <span style="background:#3a5a54"></span></div>
  <div class="sub" style="top:640px"><div class="who">엄마의 발소리</div><div class="txt">부엌에서 식탁으로. 네 걸음, 그리고 멈춘다.</div></div>
  <div class="hint">[ 클릭 ] 천장을 두드린다 · 대답은 오지 않는다</div>
 </section>

 <section class="screen" id="sb">
  <div class="view">
   <div class="ceil">
    
    <div class="caus" style="opacity:.2"></div>
    <div class="hole">
     <svg viewBox="0 0 640 420" preserveAspectRatio="none">
      <g fill="#1a0c04">
       <!-- table legs -->
       <rect x="250" y="0" width="22" height="420"/><rect x="390" y="0" width="22" height="420"/>
       <!-- chair legs + feet: mother -->
       <rect x="60" y="0" width="12" height="420"/><rect x="140" y="0" width="12" height="420"/>
       <path d="M86 0 L96 300 C80 330 70 360 110 364 L128 364 L122 0Z"/>
       <!-- child, feet not reaching floor -->
       <rect x="470" y="0" width="12" height="420"/><rect x="560" y="0" width="12" height="420"/>
       <path d="M500 0 L506 190 C496 206 500 222 522 222 L532 214 L528 0Z"/>
       <path d="M532 0 L540 170 C534 186 540 200 560 198 L566 190 L558 0Z"/>
      </g>
      <!-- empty chair -->
      <g fill="#1a0c04" opacity=".55"><rect x="300" y="0" width="10" height="420"/><rect x="350" y="0" width="10" height="420"/></g>
      <g fill="#fff3d0" opacity=".25"><circle cx="330" cy="120" r="60"/></g>
     </svg>
    </div>
    <div class="foot mid" style="left:900px;top:300px;transform:rotate(10deg)"></div>
    <div class="ring" style="left:1500px;top:360px;border-color:rgba(255,230,180,.8)"></div>
   </div>
  </div>
  <div class="warmglow"></div>
  <div class="dust" style="filter:sepia(1) saturate(3) hue-rotate(-10deg)"></div>
  <div class="fog"></div><div class="murk" style="background:radial-gradient(ellipse 70% 60% at 50% 25%,transparent 30%,rgba(20,14,6,.65) 70%,rgba(4,4,2,.97))"></div>
  <svg class="hand" viewBox="0 0 340 560">
   <defs><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8d4cc"/><stop offset="1" stop-color="#2a4a44" stop-opacity=".1"/></linearGradient></defs>
   <path d="M130 560 C120 420 110 330 120 250 C100 200 96 150 104 110 C108 90 124 92 126 112 L134 190 L138 80 C140 58 160 58 160 82 L162 186 L170 60 C172 38 192 38 192 62 L190 190 L204 90 C206 70 226 72 224 94 L216 210 C230 190 250 180 262 188 C272 196 262 212 250 226 C230 250 220 290 214 330 C210 420 214 500 220 560Z" fill="url(#skin)" opacity=".85"/>
   <path d="M150 300 C160 320 190 322 200 300" stroke="#6a8a84" stroke-width="2" fill="none" opacity=".5"/>
  </svg>
  <div class="bubbles" id="bubB"></div>
  <div class="corner" style="color:#a88a5a">익사한 집 · 마흔째 밤<b style="color:#f4e2c0">식탁 아래</b></div>
  <div class="steps" style="color:#a88a5a">엄마 <span style="background:#ffd28a"></span><br>동생 <span style="background:#ffd28a"></span><br>아버지 <span style="background:#ffd28a"></span></div>
  <div class="sub" style="top:640px;left:120px;right:auto;width:900px"><div class="who" style="color:#e0b878">저녁 일곱 시</div><div class="txt" style="color:#fff4dc">셋이 앉았다. 의자 하나가, 여전히 비어 있다.</div></div>
  <div class="hint" style="color:#a88a5a">[ 클릭 ] 손을 뻗는다 · 판자 한 장 너머</div>
 </section>
 <div class="grain"></div>
 <nav id="tabs"><a href="#a" data-k="a">1 · 발소리</a><a href="#b" data-k="b">2 · 저녁</a></nav>
</div>
<script>
(function(){
 var st=document.getElementById('stage');
 function fit(){var s=Math.min(window.innerWidth/1600,window.innerHeight/1000);st.style.transform='translate(-50%,-50%) scale('+s+')';}
 window.addEventListener('resize',fit);fit();
 var tabs=document.querySelectorAll('#tabs a');
 function show(k){document.body.setAttribute('data-screen',k);for(var i=0;i<tabs.length;i++){tabs[i].className=tabs[i].getAttribute('data-k')===k?'on':'';}}
 function fromHash(){show(location.hash==='#b'?'b':'a');}
 window.addEventListener('hashchange',fromHash);fromHash();
 window.addEventListener('keydown',function(e){if(e.key==='1')location.hash='a';if(e.key==='2')location.hash='b';});
 function bub(id){var b=document.getElementById(id);if(!b)return;for(var i=0;i<18;i++){var e=document.createElement('i');var s=3+Math.random()*9;e.style.width=s+'px';e.style.height=s+'px';e.style.left=(20+Math.random()*60)+'%';e.style.animationDuration=(6+Math.random()*8).toFixed(1)+'s';e.style.animationDelay=(-Math.random()*12).toFixed(1)+'s';b.appendChild(e);}}
 bub('bubA');bub('bubB');
 var AC=null;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
 function knock(){var c=ac();if(!c)return;var t=c.currentTime;for(var k=0;k<2;k++){var o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=420;o.type='triangle';var tt=t+k*0.22;o.frequency.setValueAtTime(160,tt);o.frequency.exponentialRampToValueAtTime(70,tt+0.18);g.gain.setValueAtTime(0.0001,tt);g.gain.exponentialRampToValueAtTime(0.35,tt+0.01);g.gain.exponentialRampToValueAtTime(0.0001,tt+0.4);o.connect(f);f.connect(g);g.connect(c.destination);o.start(tt);o.stop(tt+0.45);}}
 st.addEventListener('click',function(e){if(e.target&&e.target.tagName==='A')return;knock();
  var r=st.getBoundingClientRect(),sc=r.width/1600;var x=(e.clientX-r.left)/sc,y=(e.clientY-r.top)/sc;
  var ring=document.createElement('div');ring.className='ring';ring.style.cssText='left:'+x+'px;top:'+y+'px;position:absolute;z-index:30;border-color:rgba(207,233,226,.8);animation-iteration-count:1';st.appendChild(ring);
  setTimeout(function(){if(ring.parentNode)ring.parentNode.removeChild(ring);},2300);});
})();
</script>
</body>
</html>
