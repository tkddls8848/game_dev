<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이불 요새</title>
<style>
:root{--moon:#bcd3ff;--warm:#ffcf7a;--ink:#1b1733;--paper:#f4ecd8;--crayR:#e0433b;--crayY:#f2c12e;--crayB:#3d6fd1;--crayG:#4fa35a;--crayP:#8a4fd1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#07060f;overflow:hidden}
body{font-family:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#f4ecd8}
.hand{font-family:"Noto Serif CJK KR","Nanum Pen Script","Noto Serif KR",serif}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:1000px;overflow:hidden;background:#141029}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
canvas.view{position:absolute;left:0;top:0}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.13;mix-blend-mode:overlay;background-size:256px 256px}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 65% at 50% 60%,transparent 50%,rgba(4,3,12,.7))}

/* paper scraps UI */
.scrap{position:absolute;background:linear-gradient(175deg,#f7f0de,#e9dec2);color:var(--ink);box-shadow:0 8px 18px rgba(0,0,0,.5),inset 0 0 30px rgba(160,130,80,.25);border-radius:2px}
.scrap::before,.scrap::after{content:"";position:absolute;width:70px;height:22px;background:rgba(240,228,190,.65);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.scrap::before{left:-18px;top:-6px;transform:rotate(-32deg)}
.scrap::after{right:-18px;top:-6px;transform:rotate(30deg)}
.title{left:26px;top:20px;padding:12px 26px 12px 22px;transform:rotate(-2deg);z-index:4}
.title b{display:block;font-size:40px;font-weight:900;letter-spacing:.02em;color:#2a2152;text-shadow:1px 1px 0 rgba(90,70,200,.25)}
.title span{font-size:14px;color:#6a5a7a;font-weight:700}
.title b i{font-style:normal;color:var(--crayR)}
.night{left:300px;top:28px;padding:10px 18px;transform:rotate(1.5deg);z-index:4;display:flex;gap:18px;align-items:center}
.night .k{font-size:12px;color:#7b6a82;font-weight:700;display:block}
.night .v{font-size:22px;font-weight:900;color:#2a2152}
.night .sep{width:2px;height:34px;background:repeating-linear-gradient(#b8a988 0 4px,transparent 4px 7px)}
.pillows{display:flex;gap:4px;margin-top:3px}
.pillows i{width:22px;height:14px;border-radius:7px;background:#f6f1ff;border:2px solid #6a5acd;display:block}
.pillows i.x{background:#ddd2c0;border-color:#b9a98f;opacity:.6}

/* mom meter */
.mom{position:absolute;right:28px;top:22px;width:300px;padding:12px 16px 12px;z-index:4;background:rgba(18,14,40,.78);border:2px solid rgba(188,211,255,.25);border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.mom .h{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:700;color:#cfd8ff}
.mom .h small{font-size:12px;color:#8d95c4;font-weight:500}
.steps{display:flex;gap:10px;margin-top:10px;align-items:center}
.steps svg{width:34px;height:40px}
.mom .note{font-size:12px;color:#9aa3d6;margin-top:6px}

/* toy tray */
.tray{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:12px;padding:12px 16px 10px;z-index:4;
  background:linear-gradient(#5b3a26,#402716);border-radius:14px;border:3px solid #2a180c;box-shadow:0 14px 28px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,220,170,.2)}
.toy{position:relative;width:112px;height:120px;border-radius:10px;background:linear-gradient(#f3e8cf,#dccaa5);color:var(--ink);text-align:center;cursor:pointer;
  box-shadow:0 4px 0 #a88b5c,0 6px 10px rgba(0,0,0,.4);transition:transform .12s}
.toy:hover{transform:translateY(-6px)}
.toy svg{width:70px;height:62px;margin-top:6px}
.toy b{display:block;font-size:14px;font-weight:900;margin-top:-2px}
.toy small{display:block;font-size:11px;color:#6d5a44;font-weight:700}
.toy .c{position:absolute;right:-6px;top:-8px;background:var(--crayR);color:#fff;font-weight:900;font-size:13px;border-radius:12px;padding:3px 8px;box-shadow:0 2px 0 #7a1e18}
.toy.sel{outline:4px solid var(--crayY);outline-offset:2px;transform:translateY(-8px)}
.toy.off{filter:grayscale(1) brightness(.55)}
.candy{display:flex;flex-direction:column;justify-content:center;align-items:center;width:96px;color:#ffe9c2}
.candy b{font-size:30px;font-weight:900;color:#ffd45e;text-shadow:0 2px 0 #7a4a10}
.candy small{font-size:12px;font-weight:700;color:#e8c89a}

.wave{position:absolute;right:28px;top:152px;z-index:4;padding:10px 16px;transform:rotate(2deg)}
.wave .k{font-size:12px;color:#7b6a82;font-weight:700}
.wave .v{font-size:22px;font-weight:900;color:#2a2152}
.wave .bar{display:flex;gap:4px;margin-top:4px}
.wave .bar i{width:14px;height:14px;border-radius:50%;border:2px solid #2a2152;display:block}
.wave .bar i.d{background:#2a2152}
.wave .bar i.n{background:var(--crayP);border-color:var(--crayP)}

/* B overlays */
.shh{position:absolute;left:0;right:0;top:300px;text-align:center;z-index:4;pointer-events:none}
.shh b{display:inline-block;font-size:92px;font-weight:900;color:#fff4d6;letter-spacing:.02em;transform:rotate(-3deg);
  text-shadow:0 0 30px rgba(255,200,110,.55),4px 4px 0 #3a2a6a,-2px -2px 0 rgba(255,255,255,.2)}
.shh p{margin-top:6px;font-size:22px;color:#ffe2a8;font-weight:700;text-shadow:0 2px 8px #000}
.hold{position:absolute;left:1210px;top:760px;width:170px;height:170px;z-index:4;text-align:center}
.hold svg{position:absolute;inset:0}
.hold .in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center}
.hold .in b{font-size:40px;font-weight:900;color:#fff4d6;line-height:1}
.hold .in span{font-size:13px;color:#cfd8ff;font-weight:700;margin-top:4px}
.hold .in kbd{font-family:inherit;margin-top:6px;font-size:12px;border:2px solid #cfd8ff;border-radius:6px;padding:1px 8px;color:#cfd8ff}
.warn{position:absolute;z-index:4;padding:8px 14px;background:var(--crayR);color:#fff;font-weight:900;font-size:18px;border-radius:6px;transform:rotate(-4deg);box-shadow:0 4px 0 #7a1e18,0 0 24px rgba(224,67,59,.6);animation:wb .5s steps(2) infinite}
@keyframes wb{50%{transform:rotate(-4deg) scale(1.06)}}

.tabs{position:absolute;right:12px;bottom:10px;z-index:50;display:flex;gap:6px}
.tabs button{font:700 12px/1 "Noto Sans KR",sans-serif;padding:7px 10px;border-radius:4px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.6);color:#ddd;cursor:pointer}
.tabs button.on{background:var(--crayY);color:#2a1a00;border-color:var(--crayY)}
</style>
</head>
<body>
<div id="stage">

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-bear" viewBox="0 0 70 62"><circle cx="20" cy="14" r="9" fill="#8a5a34"/><circle cx="50" cy="14" r="9" fill="#8a5a34"/><circle cx="20" cy="14" r="4.5" fill="#d9a877"/><circle cx="50" cy="14" r="4.5" fill="#d9a877"/><ellipse cx="35" cy="48" rx="20" ry="14" fill="#7a4d2c"/><circle cx="35" cy="28" r="17" fill="#9a6a40"/><ellipse cx="35" cy="34" rx="8" ry="6" fill="#e2b98a"/><circle cx="28" cy="25" r="2.6" fill="#1b1733"/><circle cx="42" cy="25" r="2.6" fill="#1b1733"/><circle cx="35" cy="31" r="2.4" fill="#1b1733"/><path d="M26 44 L35 52 L44 44" stroke="#e0433b" stroke-width="4" fill="none"/></symbol>
    <symbol id="i-torch" viewBox="0 0 70 62"><path d="M50 18 L68 4 L68 40 L50 30Z" fill="#ffe08a" opacity=".85"/><rect x="10" y="18" width="36" height="14" rx="3" fill="#3d6fd1"/><rect x="44" y="14" width="10" height="22" rx="3" fill="#9fb3d6"/><rect x="20" y="20" width="6" height="10" rx="2" fill="#f2c12e"/><rect x="10" y="40" width="44" height="8" rx="4" fill="#c9a676"/><rect x="14" y="48" width="40" height="8" rx="4" fill="#b08a57"/></symbol>
    <symbol id="i-soldier" viewBox="0 0 70 62"><rect x="28" y="4" width="14" height="12" rx="3" fill="#1b1733"/><circle cx="35" cy="20" r="7" fill="#f0c9a0"/><rect x="26" y="27" width="18" height="18" rx="3" fill="#e0433b"/><rect x="27" y="45" width="7" height="14" fill="#3d6fd1"/><rect x="36" y="45" width="7" height="14" fill="#3d6fd1"/><rect x="46" y="16" width="4" height="30" fill="#6b5a44"/><circle cx="35" cy="34" r="1.8" fill="#f2c12e"/></symbol>
    <symbol id="i-music" viewBox="0 0 70 62"><rect x="12" y="28" width="46" height="26" rx="4" fill="#c46aa8"/><path d="M12 28 L20 12 L66 12 L58 28Z" fill="#e59ad0"/><circle cx="35" cy="41" r="6" fill="#f2c12e"/><path d="M50 4 v12 M50 4 l8 3" stroke="#f4ecd8" stroke-width="3" fill="none"/><circle cx="48" cy="17" r="3" fill="#f4ecd8"/></symbol>
    <symbol id="i-foot" viewBox="0 0 34 40"><ellipse cx="17" cy="24" rx="9" ry="13"/><circle cx="11" cy="7" r="3"/><circle cx="17" cy="5" r="3"/><circle cx="23" cy="7" r="3"/></symbol>
  </defs>
</svg>

<!-- ================ A ================ -->
<section class="screen" id="a">
  <canvas class="view" id="cvA" width="1600" height="1000"></canvas>
  <div class="grain"></div><div class="vig"></div>
  <div class="scrap title hand"><b>이불 <i>요새</i></b><span>괴물은 옷장과 침대 밑에서 온다</span></div>
  <div class="scrap night">
    <div><span class="k">밤</span><span class="v">셋째 밤</span></div><div class="sep"></div>
    <div><span class="k">시각</span><span class="v">새벽 2:14</span></div><div class="sep"></div>
    <div><span class="k">요새 튼튼함</span><div class="pillows"><i></i><i></i><i></i><i></i><i class="x"></i></div></div>
  </div>
  <div class="mom">
    <div class="h">엄마 기척 <small>조용함</small></div>
    <div class="steps" id="stepsA"></div>
    <div class="note">발소리가 들리면 모두 멈춰야 해요</div>
  </div>

    <div class="toy" data-t="torch"><span class="c">4</span><svg><use href="#i-torch"/></svg><b>손전등</b><small>빛으로 지우기</small></div>
    <div class="toy" data-t="soldier"><span class="c">2</span><svg><use href="#i-soldier"/></svg><b>장난감 병정</b><small>콩알 발사</small></div>
    <div class="toy" data-t="music"><span class="c">5</span><svg><use href="#i-music"/></svg><b>오르골</b><small>재우기</small></div>
  </div>
</section>

<!-- ================ B ================ -->
<section class="screen" id="b">
  <canvas class="view" id="cvB" width="1600" height="1000"></canvas>
  <div class="grain"></div><div class="vig" style="background:radial-gradient(ellipse 65% 60% at 55% 45%,transparent 35%,rgba(4,3,12,.85))"></div>
  <div class="scrap title hand"><b>이불 <i>요새</i></b><span>괴물은 옷장과 침대 밑에서 온다</span></div>
  <div class="scrap night">
    <div><span class="k">밤</span><span class="v">셋째 밤</span></div><div class="sep"></div>
    <div><span class="k">시각</span><span class="v">새벽 2:31</span></div><div class="sep"></div>
    <div><span class="k">요새 튼튼함</span><div class="pillows"><i></i><i></i><i></i><i class="x"></i><i class="x"></i></div></div>
  </div>
  <div class="mom" style="border-color:rgba(255,207,122,.7);box-shadow:0 0 30px rgba(255,190,90,.35)">
    <div class="h" style="color:#ffe2a8">엄마 기척 <small style="color:#ffcf7a">문 앞!</small></div>
    <div class="steps" id="stepsB"></div>
    <div class="note" style="color:#ffd9a0">움직이면 불이 켜지고 밤이 끝나요</div>

  <div class="shh hand"><b>쉿 — 모두 멈춰!</b><p>괴물도, 장난감도, 너도.</p></div>

  <div class="hold">
    <svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="74" fill="rgba(14,10,34,.8)" stroke="rgba(207,216,255,.2)" stroke-width="12"/>
      <circle id="holdArc" cx="85" cy="85" r="74" fill="none" stroke="#ffcf7a" stroke-width="12" stroke-linecap="round" stroke-dasharray="465" stroke-dashoffset="170" transform="rotate(-90 85 85)"/></svg>
    <div class="in"><b id="holdN">3</b><span>숨 참기</span><kbd>Space</kbd></div>
  </div>
  <div class="tray" style="filter:saturate(.35) brightness(.7)">
    <div class="candy"><b>🍬 4</b><small>사탕</small></div>
    <div class="toy off"><span class="c">3</span><svg><use href="#i-bear"/></svg><b>곰인형</b><small>정지</small></div>
    <div class="toy" style="outline:4px solid #e0433b;outline-offset:2px"><span class="c">4</span><svg><use href="#i-torch"/></svg><b>손전등</b><small style="color:#b2261f">아직 켜짐!</small></div>
    <div class="toy off"><span class="c">2</span><svg><use href="#i-soldier"/></svg><b>장난감 병정</b><small>정지</small></div>
    <div class="toy off"><span class="c">5</span><svg><use href="#i-music"/></svg><b>오르골</b><small>정지</small></div>
  </div>

<div class="tabs"><button data-s="a">1 · 한밤의 방어</button><button data-s="b">2 · 엄마 발소리</button></div>
</div>

<script>
(function(){
  var stage=document.getElementById('stage');
  function fit(){var s=Math.min(window.innerWidth/1600,window.innerHeight/1000);stage.style.transform='translate(-50%,-50%) scale('+s+')';}
  window.addEventListener('resize',fit);fit();
  (function(){var c=document.createElement('canvas');c.width=c.height=256;var x=c.getContext('2d'),d=x.createImageData(256,256);
    for(var i=0;i<d.data.length;i+=4){var v=Math.random()*255|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}
    x.putImageData(d,0,0);var u=c.toDataURL();var g=document.querySelectorAll('.grain');for(var k=0;k<g.length;k++)g[k].style.backgroundImage='url('+u+')';})();
  function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

  /* ---------- crayon helpers ---------- */
  function crayLine(g,pts,col,w,R,passes){g.strokeStyle=col;g.lineCap='round';g.lineJoin='round';
    for(var p=0;p<(passes||2);p++){g.lineWidth=w*(0.7+R()*.5);g.globalAlpha=.55+R()*.35;g.beginPath();
      for(var i=0;i<pts.length;i++){var x=pts[i][0]+(R()-.5)*w*.9,y=pts[i][1]+(R()-.5)*w*.9;if(i)g.lineTo(x,y);else g.moveTo(x,y);}g.stroke();}g.globalAlpha=1;}
  function waxHoles(g,w,h,R,n){g.save();g.globalCompositeOperation='destination-out';for(var i=0;i<n;i++){g.fillStyle='rgba(0,0,0,'+(.3+R()*.6)+')';g.fillRect(R()*w,R()*h,1+R()*2,1+R()*1.4);}g.restore();}
  // monster sprite
  function monster(opt){var W=opt.w,H=opt.h,c=document.createElement('canvas');c.width=W;c.height=H;var g=c.getContext('2d'),R=rng(opt.seed);
    var cx=W/2,cy=H*.55,pts=[],n=18;
    for(var i=0;i<=n;i++){var a=i/n*Math.PI*2,rx=W*.40*(0.8+R()*.3),ry=H*.42*(0.8+R()*.3);if(opt.tall&&Math.sin(a)<0)ry*=1.15;pts.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]);}
    // glow
    var gl=g.createRadialGradient(cx,cy,0,cx,cy,W*.5);gl.addColorStop(0,opt.glow);gl.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gl;g.fillRect(0,0,W,H);
    // hatch fill clipped
    g.save();g.beginPath();pts.forEach(function(p,i){if(i)g.lineTo(p[0],p[1]);else g.moveTo(p[0],p[1]);});g.closePath();g.clip();
    for(var y=-H;y<H*2;y+=5){crayLine(g,[[0,y],[W,y+W*.5]],opt.fill,4,R,1);}
    for(var y2=-H;y2<H*2;y2+=11){crayLine(g,[[W,y2],[0,y2+W*.35]],opt.fill2,3,R,1);}
    g.restore();
    crayLine(g,pts,opt.line,5,R,3);
    // spikes / arms
    for(var k=0;k<(opt.spikes||0);k++){var a2=-Math.PI*(0.15+k/(opt.spikes)*0.7),x0=cx+Math.cos(a2)*W*.34,y0=cy+Math.sin(a2)*H*.36;
      crayLine(g,[[x0,y0],[x0+Math.cos(a2)*W*.12+(R()-.5)*10,y0+Math.sin(a2)*H*.14]],opt.line,4,R,2);}
    // arms
    crayLine(g,[[cx-W*.36,cy+H*.05],[cx-W*.48,cy+H*.22],[cx-W*.44,cy+H*.3]],opt.line,4,R,2);
    crayLine(g,[[cx+W*.36,cy+H*.05],[cx+W*.48,cy+H*.2],[cx+W*.46,cy+H*.32]],opt.line,4,R,2);
    // eyes
    (opt.eyes||[[-.14,-.08],[.14,-.08]]).forEach(function(e){var ex=cx+e[0]*W,ey=cy+e[1]*H,er=e[2]||W*.08;
      g.fillStyle='#fffbe8';g.beginPath();g.ellipse(ex,ey,er,er*1.1,0,0,6.3);g.fill();crayLine(g,circ(ex,ey,er,10),'#1b1733',2,R,1);
      g.fillStyle='#1b1733';g.beginPath();g.arc(ex+er*.25,ey+er*.2,er*.45,0,6.3);g.fill();});
    // mouth
    var m=[];for(var j=0;j<=8;j++)m.push([cx-W*.16+j*W*.04,cy+H*.14+(j%2?-H*.04:H*.04)]);crayLine(g,m,'#1b1733',3,R,2);
    waxHoles(g,W,H,R,W*H/18);
    return c;}
  function circ(x,y,r,n){var a=[];for(var i=0;i<=n;i++){var t=i/n*6.3;a.push([x+Math.cos(t)*r,y+Math.sin(t)*r]);}return a;}

  /* ---------- static room ---------- */
  function room(mode){var c=document.createElement('canvas');c.width=1600;c.height=1000;var g=c.getContext('2d'),R=rng(85),B=mode==='b';
    // back wall
    var wg=g.createLinearGradient(0,0,0,270);wg.addColorStop(0,'#1d1a44');wg.addColorStop(1,'#2a2560');g.fillStyle=wg;g.fillRect(0,0,1600,272);
    // wallpaper stars
    for(var i=0;i<90;i++){var x=R()*1600,y=R()*250;g.fillStyle='rgba(200,210,255,'+(0.06+R()*.1)+')';star(g,x,y,4+R()*4);}
    // skirting
    g.fillStyle='#16123a';g.fillRect(0,258,1600,16);g.fillStyle='rgba(255,255,255,.06)';g.fillRect(0,258,1600,2);
    // floor planks
    var fg=g.createLinearGradient(0,274,0,1000);fg.addColorStop(0,'#3a2c4c');fg.addColorStop(1,'#241a33');g.fillStyle=fg;g.fillRect(0,274,1600,726);
    for(var y=274;y<1000;y+=46){g.fillStyle='rgba(0,0,0,.28)';g.fillRect(0,y,1600,2);var off=R()*300;for(var x2=off-300;x2<1600;x2+=300+R()*80){g.fillRect(x2,y,2,46);}
      g.fillStyle='rgba(255,220,180,.025)';g.fillRect(0,y+2,1600,6);}

  Scene.prototype.frame=function(now){var g=this.g,t=Math.max(0,(now-this.t0)/1000),B=this.mode==='b',self=this;

      {y:580,f:function(){drawBear(g,420,580,1,B,B?null:.72);}},
      {y:450,f:function(){drawSoldier(g,600,450,B,t);}},
      {y:760,f:function(){drawMusic(g,440,760,B);}}];
    // monsters
    this.M.forEach(function(m,idx){var mx=m.x,my=m.y,bob=0,sq=1;
      if(!B){bob=Math.sin(t*3+idx)*6;sq=1+Math.sin(t*6+idx)*.03;if(idx===0){mx=m.x+Math.sin(t*1.5)*4;}}
      else{bob=0;}
      items.push({y:my+m.img.height*.4*m.s,f:function(){g.save();g.translate(mx,my+bob);g.scale(m.s*sq,m.s/sq);
        if(B){g.globalAlpha=.55;g.filter='grayscale(.7) brightness(.7)';}

        g.drawImage(m.img,-m.img.width/2,-m.img.height/2);g.filter='none';g.globalAlpha=1;g.restore();
        if(B&&idx<2){g.strokeStyle='rgba(207,216,255,.7)';g.lineWidth=2;g.font='900 18px sans-serif';g.fillStyle='rgba(207,216,255,.85)';g.textAlign='center';g.fillText('❚❚',mx,my-m.img.height*.55);}
      }});});
    items.sort(function(a,b){return a.y-b.y;});items.forEach(function(it){it.f();});
    // flashlight beam (additive)

    var flick=B?1:.9+Math.sin(t*23)*.05+Math.sin(t*7)*.05;

    var bm=g.createLinearGradient(bx,by,ex,ey);bm.addColorStop(0,'rgba(255,236,160,'+(.75*flick)+')');bm.addColorStop(1,'rgba(255,220,130,0)');g.fillStyle=bm;
    g.beginPath();g.moveTo(bx+nx*6,by+ny*6);g.lineTo(ex+nx*80,ey+ny*80);g.lineTo(ex-nx*80,ey-ny*80);g.lineTo(bx-nx*6,by-ny*6);g.closePath();g.fill();

      // erasing sparks from hit monster

      g.fillStyle='#fffbe8';g.font='900 22px "Noto Sans KR",sans-serif';g.textAlign='center';g.lineWidth=5;g.strokeStyle='#1b1733';
      var pop=(t*1.2)%1;g.globalAlpha=1-pop*.4;g.strokeText('지워지는 중!',1120,590-pop*20);g.fillText('지워지는 중!',1120,590-pop*20);g.globalAlpha=1;

  };

  var scenes={a:new Scene(document.getElementById('cvA'),'a'),b:new Scene(document.getElementById('cvB'),'b')};

  // footsteps meters
  function steps(id,n,hot){var el=document.getElementById(id),h='';for(var i=0;i<5;i++){var on=i<n;h+='<svg viewBox="0 0 34 40" style="transform:rotate('+(i%2?12:-12)+'deg) translateY('+(i%2?4:-4)+'px);fill:'+(on?(hot?'#ffcf7a':'#9aa3d6'):'rgba(154,163,214,.18)')+(on&&hot?';filter:drop-shadow(0 0 6px #ffcf7a)':'')+'"><use href="#i-foot"/></svg>';}el.innerHTML=h;}
  steps('stepsA',1,false);steps('stepsB',4,true);
  var wv=document.getElementById('waveA'),wh='';for(var w=0;w<9;w++)wh+='<i class="'+(w<4?'d':(w<6?'n':''))+'"></i>';wv.innerHTML=wh;

  var cur='a';

    var bs=document.querySelectorAll('.tabs button');for(var j=0;j<bs.length;j++)bs[j].classList.toggle('on',bs[j].getAttribute('data-s')===k);

  var AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
  function plink(f){var c=ac();if(!c)return;var t0=c.currentTime;[1,2.01,3.02].forEach(function(m,i){var o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f*m;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.18/(i+1),t0+.005);g.gain.exponentialRampToValueAtTime(.0001,t0+.6/(i+1));o.connect(g).connect(c.destination);o.start(t0);o.stop(t0+.7);});}
