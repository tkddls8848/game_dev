<style>
:root{--serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;--sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1600px;height:1000px;transform-origin:0 0;overflow:hidden;background:#000;font-family:var(--serif);color:#f4e6cc}
.screen{position:absolute;inset:0;display:none}.screen.on{display:block}
svg.scene{position:absolute;left:0;top:0}
.bar{position:absolute;left:0;right:0;height:120px;background:#050505;z-index:5}
.bar.t{top:0}.bar.b{bottom:0}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.14;mix-blend-mode:overlay;z-index:4;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:gr .6s steps(3) infinite}
@keyframes gr{33%{transform:translate(-6px,4px)}66%{transform:translate(5px,-5px)}}
.walker{animation:walk 26s linear infinite}
.walker.w2{animation-duration:34s;animation-delay:-14s}
@keyframes walk{from{transform:translateX(-160px)}to{transform:translateX(1780px)}}
.bob{animation:bob .9s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.twk{animation:twk 3s ease-in-out infinite}
@keyframes twk{50%{opacity:.25}}
.flick{animation:flick 5s steps(1) infinite}
@keyframes flick{0%{opacity:1}62%{opacity:1}63%{opacity:.35}64%{opacity:1}66%{opacity:.5}67%{opacity:1}}
.breathe{animation:br 5s ease-in-out infinite;transform-origin:center bottom;transform-box:fill-box}
@keyframes br{50%{transform:scaleY(1.012)}}

/* HUD lives inside the letterbox bars */
.cap{position:absolute;left:80px;top:40px;z-index:6;font-size:28px;letter-spacing:10px;color:#e9dcc2}
.cap small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:6px;color:#6f6556;margin-top:6px}
.time{position:absolute;right:80px;top:36px;z-index:6;text-align:right}
.time b{font-size:40px;font-weight:300;letter-spacing:2px}
.time span{display:block;font-family:var(--sans);font-size:12px;color:#8a7d68;letter-spacing:3px;margin-top:2px}
.curve{position:absolute;left:80px;bottom:18px;width:900px;height:84px;z-index:6}
.curve .l{position:absolute;left:0;top:0;font-family:var(--sans);font-size:11px;letter-spacing:4px;color:#6f6556}
.curve svg{position:absolute;left:0;top:18px}
.sit{position:absolute;right:80px;bottom:30px;z-index:6;display:flex;gap:26px;align-items:center;font-family:var(--sans)}
.sit .h{font-size:13px;color:#8a7d68;letter-spacing:2px}
.sit .h b{color:#f4e6cc;font-family:var(--serif);font-size:20px;letter-spacing:1px;margin-left:8px;font-weight:400}
.ring{width:58px;height:58px;position:relative;cursor:pointer}
.ring svg{position:absolute;inset:0}
.ring .k{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:#c9b99c;letter-spacing:1px}
.line{position:absolute;left:50%;transform:translateX(-50%);bottom:170px;z-index:6;font-size:22px;letter-spacing:3px;color:#fbefd8;text-shadow:0 2px 10px rgba(0,0,0,.8);opacity:0;transition:opacity 2s;white-space:nowrap}
.line.show{opacity:1}
.choice{position:absolute;right:80px;bottom:30px;z-index:6;display:flex;gap:14px;font-family:var(--serif)}
.choice div{font-size:17px;letter-spacing:2px;padding:10px 20px;border:1px solid rgba(244,230,204,.25);color:#e9dcc2;cursor:pointer;transition:all .4s}
.choice div:hover{border-color:#f4e6cc;background:rgba(244,230,204,.06)}
.choice div.dim{opacity:.35}
.tabs{position:absolute;left:50%;transform:translateX(-50%);top:14px;z-index:10;display:flex;gap:6px}
.tabs button{font-family:var(--sans);font-size:11px;background:transparent;color:#6f6556;border:1px solid #2a2622;padding:3px 9px;cursor:pointer}
.tabs button.on{color:#f4e6cc;border-color:#7a6a52}
</style>

</div>
<div class="line show" id="lineB" style="bottom:160px">버스는 오지 않았다. 옆자리에 누군가 앉았다.</div>
<div class="choice"><div id="stay">계속 앉아 있기</div><div class="dim" id="leave">일어서기</div></div>
</section>

<div class="tabs"><button data-t="a">1 · 18:40</button><button data-t="b">2 · 21:10</button></div>
</div>
<script>
(function(){
  var stage=document.getElementById('stage');
  function fit(){var s=Math.min(innerWidth/1600,innerHeight/1000);stage.style.transform='translate('+((innerWidth-1600*s)/2)+'px,'+((innerHeight-1000*s)/2)+'px) scale('+s+')';}
  addEventListener('resize',fit);fit();
  var cur='a';
  function show(k){cur=(k==='b')?'b':'a';document.getElementById('sa').className='screen'+(cur==='a'?' on':'');document.getElementById('sb').className='screen'+(cur==='b'?' on':'');
    var bs=document.querySelectorAll('.tabs button');for(var i=0;i<bs.length;i++)bs[i].className=bs[i].getAttribute('data-t')===cur?'on':'';}
  function fromHash(){show((location.hash||'#a').replace('#',''));}
  addEventListener('hashchange',fromHash);fromHash();
  var tb=document.querySelectorAll('.tabs button');for(var i=0;i<tb.length;i++)tb[i].addEventListener('click',function(e){location.hash=e.currentTarget.getAttribute('data-t');});

  var ac=null,amb=null;
  function audio(){if(ac)return ac;try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}return ac;}
  function ambience(){var a=audio();if(!a||amb)return;try{var n=a.sampleRate*3,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0),l=0;for(var i=0;i<n;i++){l=l*.985+(Math.random()*2-1)*.015;d[i]=l*6;}
    var s=a.createBufferSource();s.buffer=b;s.loop=true;var f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=380;var g=a.createGain();g.gain.value=.0001;g.gain.linearRampToValueAtTime(.08,a.currentTime+3);s.connect(f);f.connect(g);g.connect(a.destination);s.start();amb=g;}catch(e){}}
  function chirp(){var a=audio();if(!a)return;try{for(var k=0;k<3;k++){var o=a.createOscillator(),g=a.createGain(),t=a.currentTime+k*.07;o.frequency.value=4200+Math.random()*300;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.015,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.05);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.06);}}catch(e){}}
  function bell(f){var a=audio();if(!a)return;try{var o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,a.currentTime);g.gain.linearRampToValueAtTime(.05,a.currentTime+.3);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+3);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+3.1);}catch(e){}}

  // sitting ring: holding space keeps you seated; time passes a little faster while you sit still
  var off=40,holding=false,lines=['건너편 밭에서 누군가 불을 피운다.','그림자가 벤치 끝까지 자랐다.','시간표의 글씨가 더는 읽히지 않는다.','바람이 멈추자 전선이 운다.'],li=0;
  function sayA(){var l=document.getElementById('lineA');if(!l)return;l.textContent=lines[li%lines.length];li++;l.className='line show';clearTimeout(l._t);l._t=setTimeout(function(){l.className='line';},3800);}
  setTimeout(sayA,500);
  function loop(t){var arc=document.getElementById('arcA');if(arc){off=holding?Math.max(0,off-0.3):Math.min(157,off+0.02);arc.setAttribute('stroke-dashoffset',off.toFixed(1));}
    var m=document.getElementById('moth');if(m){m.setAttribute('cx',(1180+Math.sin(t/230)*26+Math.sin(t/97)*8).toFixed(1));m.setAttribute('cy',(300+Math.cos(t/170)*22).toFixed(1));}
    if(cur==='b'&&ac&&Math.random()<.012)chirp();
    requestAnimationFrame(loop);}
  requestAnimationFrame(loop);
  addEventListener('keydown',function(e){audio();ambience();if(e.key==='1'){location.hash='a';return;}if(e.key==='2'){location.hash='b';return;}
    if(e.code==='Space'){e.preventDefault();if(!holding){holding=true;if(cur==='a')sayA();bell(196);}}});
  addEventListener('keyup',function(e){if(e.code==='Space')holding=false;});
  var r=document.getElementById('ringA');if(r){r.addEventListener('pointerdown',function(){audio();ambience();holding=true;sayA();bell(196);});addEventListener('pointerup',function(){holding=false;});}
  var st=document.getElementById('stay'),lv=document.getElementById('leave');
  if(st)st.addEventListener('click',function(){audio();ambience();bell(262);var l=document.getElementById('lineB');l.textContent='둘 다 아무 말도 하지 않았다. 가로등이 한 번 깜빡였다.';});
  if(lv)lv.addEventListener('click',function(){audio();bell(147);var l=document.getElementById('lineB');l.textContent='일어서려다, 다시 앉았다.';});
})();
</script>
</body>
</html>
